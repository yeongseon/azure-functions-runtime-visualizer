<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="funcviz static viewer — renders an Azure Functions runtime trace as four horizontal swimlanes (client / host / python worker / application) over one shared elapsed-time axis, beside the application source panel.">
<title>funcviz — trace viewer</title>
<style>
  /* ============================================================
     funcviz design tokens (inline design system — single file)
     ============================================================ */
  :root {
    /* surfaces */
    --bg: #0d1117;
    --bg-raised: #151b24;
    --bg-inset: #0a0e14;
    /* strokes */
    --border: #26303d;
    --border-strong: #364252;
    /* timeline geometry — shared time axis (#52) */
    --gridline: rgba(144, 160, 180, .13);
    /* text */
    --text: #e6edf3;
    --text-dim: #93a1b5;
    --text-faint: #6b7889;
    /* lane accents */
    --client: #39c5bb;      /* teal  — client */
    --host: #5b9df8;        /* azure — functions host */
    --worker: #e3b341;      /* gold  — python worker */
    --app: #b18bf5;         /* violet— application lane */
    /* semantics */
    --ok: #3fb950;
    --fail: #f85149;
    --idle: #768390;
    /* radii */
    --radius-sm: 6px;
    --radius-md: 10px;
    /* spacing scale (4px base) */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    /* type */
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1100px 500px at 75% -10%, rgba(91,157,248,.07), transparent 60%),
      radial-gradient(900px 420px at 8% 110%, rgba(57,197,187,.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(91,157,248,.35); }
  :focus-visible { outline: 2px solid var(--host); outline-offset: 2px; }
  .vh {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ============================================================
     header
     ============================================================ */
  .app-header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-5);
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #11161e, var(--bg));
  }
  /* §11.11 (#62) — band A holds ONE row at desktop widths so the frame
     never jumps between success and failure traces: the summary and the
     runtime meta ellipsize instead of wrapping to a second line (full text
     preserved in their title attributes). The ≤720px media query restores
     stacking for narrow screens. */
  @media (min-width: 721px) {
    .app-header { flex-wrap: nowrap; }
    .brand-line {
      flex: 0 1 auto; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .outcome-chip { flex: none; }
    .runtime-meta {
      flex: 0 1 auto; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  }
  .brand-line { margin: 0; font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: .4px; }
  .brand-accent { color: var(--host); }
  .summary-sep { color: var(--text-faint); font-weight: 400; }
  .summary-text { font-size: 14px; font-weight: 500; color: var(--text-dim); letter-spacing: 0; }
  .summary-text .fn { color: var(--text); font-weight: 700; }
  .summary-text .dur { color: var(--text); font-weight: 700; }
  .outcome-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin: 0 6px 1px 4px; background: var(--idle);
  }
  .outcome-dot.outcome--success { background: var(--ok); }
  .outcome-dot.outcome--failure { background: var(--fail); }

  /* ============================================================
     outcome chip (#55, spec §2.1) — the run outcome as a headline
     element in band A; a failure header never leads with a duration.
     ============================================================ */
  .outcome-chip {
    display: inline-flex; align-items: center;
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase;
    padding: 4px 12px 4px 8px; border-radius: 999px;
    border: 1px solid var(--border-strong);
    color: var(--text-dim); background: var(--bg-raised);
  }
  .outcome-chip .outcome-dot { margin: 0 7px 0 2px; }
  .outcome-chip[data-outcome="success"] { color: var(--ok); border-color: rgba(63,185,80,.45); background: rgba(63,185,80,.08); }
  .outcome-chip[data-outcome="failed"] { color: var(--fail); border-color: rgba(248,81,73,.5); background: rgba(248,81,73,.08); }
  /* §2.1 — failure time in the summary line is subordinate, never the lead */
  .fail-at { color: var(--text-faint); font-weight: 400; font-size: 13px; }
  .runtime-meta {
    margin: 0 0 0 auto; font-family: var(--mono); font-size: 12px;
    color: var(--text-faint); text-align: right;
  }

  /* ============================================================
     toolbar — trace loading (file / paste / default)
     ============================================================ */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-5);
    border-bottom: 1px solid var(--border);
    background: var(--bg-raised);
  }
  .btn {
    display: inline-flex; align-items: center; gap: var(--sp-1);
    font-family: var(--mono); font-size: 12.5px; font-weight: 600;
    padding: 7px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: transparent; color: var(--text-dim);
    cursor: pointer; transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .btn:hover { color: var(--text); border-color: var(--host); }
  .btn--primary { background: var(--host); border-color: transparent; color: #08111f; }
  .btn--primary:hover { background: #7ab2fb; color: #08111f; }
  #tracePaste {
    flex: 1 1 300px; min-height: 36px; resize: vertical;
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
    color: var(--text); background: var(--bg-inset);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: var(--sp-1) var(--sp-2);
  }
  #tracePaste::placeholder { color: var(--text-faint); }
  .load-status { margin: 0 0 0 auto; font-size: 12px; color: var(--text-faint); font-family: var(--mono); }
  .load-status--ok { color: var(--ok); }
  .load-status--error { color: var(--fail); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:disabled:hover { color: var(--text-dim); border-color: var(--border-strong); }
  .btn--primary:disabled,
  .btn--primary:disabled:hover { background: var(--host); border-color: transparent; color: #08111f; }

  /* ============================================================
     confidence boundary banner (#10) — observed vs inferred vs
     not reached, summarized from lane status/confidence only.
     #61 (spec §15): collapses to ONE line at rest — title mark,
     mono counts, disclosure toggle. The full clause summary and
     detail paragraph (incl. the worker fallback sentence) stay
     reachable behind the toggle. Accent semantics (amber inferred /
     green all-observed / idle empty) still read on the collapsed
     line via the left border, the title swatch, and category colors.
     ============================================================ */
  .confidence-banner {
    --banner-accent: var(--worker); /* amber when any inferred lane is populated */
    width: calc(100% - var(--sp-4) * 2);
    max-width: 1440px;
    margin: var(--sp-4) auto 0;
    padding: var(--sp-2) var(--sp-4);
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-left: 4px solid var(--banner-accent);
    border-radius: var(--radius-md);
    box-shadow: 0 3px 14px rgba(1, 4, 9, .5);
  }
  .confidence-banner--observed { --banner-accent: var(--ok); } /* every populated lane observed */
  .confidence-banner--empty { --banner-accent: var(--idle); }  /* nothing populated at all */
  /* head row — title + counts + toggle always on one line */
  .confidence-head {
    display: flex; flex-wrap: nowrap; align-items: center; gap: var(--sp-3);
  }
  .confidence-banner-title {
    flex: none;
    margin: 0;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim);
    white-space: nowrap;
  }
  .confidence-banner-title::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 2px; background: var(--banner-accent); margin-right: var(--sp-2);
  }
  /* #61 — one-line counts at rest. Observed and inferred are always
     shown; unknown appears only when a lane actually reports it. */
  .confidence-oneline {
    flex: 1 1 auto; min-width: 0; margin: 0;
    font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .confidence-oneline .conf-num { color: var(--text); font-weight: 700; }
  .confidence-oneline .conf-sep { color: var(--text-faint); font-weight: 400; margin: 0 var(--sp-1); }
  .conf-cat--observed { color: var(--ok); }
  .conf-cat--inferred { color: var(--worker); }
  .conf-cat--not-reached { color: var(--text-faint); }
  .conf-cat--unknown { color: var(--text-dim); }
  /* #61 — disclosure control: real button, keyboard operable, focus
     ring from the global :focus-visible rule */
  .confidence-toggle {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .2px;
    padding: 5px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: transparent; color: var(--text-dim);
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .confidence-toggle:hover { color: var(--text); border-color: var(--host); }
  .confidence-toggle-caret {
    display: inline-block; font-size: 10px; line-height: 1;
    transition: transform .18s ease;
  }
  .confidence-banner:not([data-collapsed="true"]) .confidence-toggle-caret { transform: rotate(90deg); }
  /* #61 — collapsible body: 0fr→1fr grid reveal. The inner is
     visibility-hidden at rest so collapsed content leaves the tab
     and accessibility tree (disclosure semantics, like <details>). */
  .confidence-body {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .22s ease;
  }
  .confidence-body-inner {
    overflow: hidden; min-height: 0; visibility: hidden;
    transition: visibility 0s linear .22s;
  }
  .confidence-banner:not([data-collapsed="true"]) .confidence-body { grid-template-rows: 1fr; }
  .confidence-banner:not([data-collapsed="true"]) .confidence-body-inner { visibility: visible; transition-delay: 0s; }
  /* full summary replaces the counts when expanded — the head row
     height never changes, so nothing outside the reveal moves */
  .confidence-banner:not([data-collapsed="true"]) .confidence-oneline { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .confidence-body, .confidence-body-inner, .confidence-toggle-caret { transition: none; }
  }
  .confidence-summary {
    margin: var(--sp-3) 0 var(--sp-1);
    font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text);
  }
  .confidence-detail { margin: 0 0 var(--sp-2); font-size: 13px; line-height: 1.6; color: var(--text-dim); }

  /* ============================================================
     replay transport (#7) — sticky inside the timeline column
     ============================================================ */
  .replay-controls {
    position: sticky; top: var(--sp-4); z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    margin-bottom: var(--sp-4);
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    box-shadow: 0 3px 14px rgba(1, 4, 9, .5);
  }
  .replay-title {
    flex: none; margin: 0 var(--sp-1) 0 0;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-faint);
  }
  .replay-status {
    margin: 0 0 0 auto; font-family: var(--mono); font-size: 11.5px;
    color: var(--text-dim); white-space: nowrap;
  }
  .replay-status[data-state="playing"] { color: var(--ok); }
  .replay-status[data-state="paused"] { color: var(--worker); }
  .replay-status[data-state="ended"] { color: var(--host); }
  .replay-status[data-state="structure"] { color: var(--client); } /* #70 pre-play */
  /* #60 (spec §8) — live REAL elapsed ms at the playhead position */
  .replay-clock {
    margin: 0 var(--sp-2); font-family: var(--mono); font-size: 11.5px;
    font-weight: 600; color: var(--host); white-space: nowrap;
  }

  /* ============================================================
     layout — timeline + source panel
     ============================================================ */
  .layout {
    display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr);
    gap: var(--sp-5); padding: var(--sp-5);
    max-width: 1440px; margin: 0 auto; align-items: start;
  }
  /* right column of .layout — step detail (#6) stacked above the source panel */
  .inspector-rail {
    display: flex; flex-direction: column; gap: var(--sp-5);
    min-width: 0; align-self: stretch;
  }

  /* ============================================================
     durations — three separately-labeled chips (R4: never collapse)
     ============================================================ */
  .durations-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-3); margin-bottom: var(--sp-3); }
  .section-label {
    margin: 0; font-size: 12px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-faint);
  }
  .durations-note { margin: 0; font-size: 11.5px; font-style: italic; color: var(--text-faint); }
  .durations { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-bottom: var(--sp-5); }
  .durations-empty { margin: 0; font-size: 13px; color: var(--text-faint); }
  .duration-chip {
    flex: 1 1 210px; max-width: 320px;
    background: var(--bg-raised); border: 1px solid var(--border-strong);
    border-radius: var(--radius-md); padding: var(--sp-3) var(--sp-4);
  }
  .duration-chip.confidence-inferred {
    border-style: dashed;
    background-image: repeating-linear-gradient(-45deg, rgba(148,163,184,.06) 0 6px, rgba(148,163,184,0) 6px 14px);
  }
  .chip-head { font-family: var(--mono); font-size: 13px; }
  .chip-value { font-size: 18px; font-weight: 700; color: var(--text); }
  .chip-source { color: var(--text-dim); }
  .chip-bar { height: 4px; margin: var(--sp-2) 0 var(--sp-1); border-radius: 2px; background: var(--bg-inset); overflow: hidden; }
  .chip-bar > span { display: block; height: 100%; border-radius: 2px; }
  .bar--host { background: var(--host); }
  .bar--client { background: var(--client); }
  .chip-label { font-size: 11.5px; color: var(--text-faint); font-family: var(--mono); }
  .confidence-badge {
    flex: none; margin-left: auto; font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .8px; padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .confidence-observed .chip-head .confidence-badge,
  .event.confidence-observed .confidence-badge { background: var(--ok); color: #03130a; }
  .confidence-inferred .chip-head .confidence-badge,
  .event.confidence-inferred .confidence-badge {
    color: var(--worker); border: 1px dashed var(--worker); background: transparent;
  }

  /* ============================================================
     lanes — horizontal swimlanes over ONE shared time axis (#52)
     spec §3.1: four fixed rows, always rendered; §4.1: shared
     left→right elapsed axis with t0 at the first event.
     ============================================================ */
  .lanes {
    --lane-gutter: 216px;
    --outcome-col: 132px;
    display: grid; grid-template-columns: minmax(0, 1fr) var(--outcome-col);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: 0 3px 14px rgba(1, 4, 9, .5);
  }
  /* #55 — lanes/axis/structure stack in column 1; the outcome rail in
     column 2 spans them all at the right edge of band B (spec §3.3) */
  .lanes-main { display: flex; flex-direction: column; min-width: 0; position: relative; }

  /* #60 (spec §8) — the playhead: one 1px line sweeping the shared axis.
     The layer is inset by the lane gutter so the line's 0–100% maps onto
     exactly the same track width the nodes are positioned against. Nodes
     NEVER move while it sweeps; they only change state classes. */
  .playhead-layer {
    position: absolute; top: 0; bottom: 0;
    left: var(--lane-gutter); right: 0;
    pointer-events: none; z-index: 3; overflow: hidden;
  }
  .playhead {
    position: absolute; top: 0; bottom: 0; left: 0; width: 1px;
    background: var(--host);
    box-shadow: 0 0 6px rgba(91, 157, 248, .55);
  }
  .playhead::before { /* head marker riding the top edge of band B */
    content: ""; position: absolute; top: 0; left: -3.5px;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 6px solid var(--host);
  }
  /* node play states (#60, spec §8): pending dims, done/active are full.
     Class toggles ONLY — x positions and slot tops never change on play. */
  .lanes[data-view="stream"] .lane-events .event { opacity: .62; transition: opacity .15s ease; }
  .lanes[data-view="stream"] .lane-events .event.is-active,
  .lanes[data-view="stream"] .lane-events .event.is-done { opacity: 1; }
  .lanes[data-view="stream"] .lane-events .event.is-done .event-seq {
    color: var(--ok); border-color: rgba(63, 185, 80, .45);
  }
  @media (prefers-reduced-motion: reduce) {
    .lanes[data-view="stream"] .lane-events .event { transition: none; }
  }

  /* #54 (spec §4.5) — connectors between consecutive events. The overlay
     sits BELOW the nodes (z 0 vs .event z 1) and BELOW the playhead (z 3),
     captures no pointer events. Treatment encodes meaning — same-lane:
     thin line, no arrowhead; observed cross-lane handoff: solid arrow;
     inferred transition: dashed arrow. Color stays neutral for all three:
     the distinction is solidity + arrowhead, never hue. */
  .connectors {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: visible;
  }
  .connector { stroke: #8ea0b5; stroke-width: 1; }
  .connector--same-lane { stroke: var(--border-strong); stroke-opacity: .55; }
  .connector--observed { stroke-opacity: .6; stroke-width: 1.25; }
  .connector--inferred { stroke-opacity: .6; stroke-dasharray: 4 4; }
  .connector-arrow { fill: #8ea0b5; fill-opacity: .75; }

  /* #53 (spec §4.2) — compression artifacts, display-only. When a trace has
     a compressible gap the uniform gridline gradient is suppressed (a single
     period is wrong across break bands): gridlines become explicit per-track
     lines, break bands render as faint hatched voids across the lanes, and
     the axis row carries the axis-break glyph. No tick or gridline is ever
     fabricated inside a compressed band. */
  .lanes[data-compressed="1"] .lane-track { background-image: none; }
  .lane-gridline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--gridline); }
  .lane-break-band {
    position: absolute; top: 0; bottom: 0; width: 48px;
    background: repeating-linear-gradient(-45deg,
      rgba(144, 160, 180, .05) 0 3px, rgba(144, 160, 180, 0) 3px 6px);
    border-left: 1px solid rgba(144, 160, 180, .22);
    border-right: 1px solid rgba(144, 160, 180, .22);
  }
  .axis-break {
    position: absolute; top: 0; bottom: 0; width: 48px;
    background: var(--bg-raised);
    border-left: 1px solid rgba(144, 160, 180, .22);
    border-right: 1px solid rgba(144, 160, 180, .22);
  }
  .axis-break::before, .axis-break::after {
    content: ""; position: absolute; top: 6px; bottom: 6px;
    width: 8%; min-width: 1px;
    background: var(--text-dim); transform: skewX(-20deg); border-radius: 1px;
  }
  /* percentage offsets keep the // glyph inside the band when a narrow
     track shrinks bandW below the 48px desktop default */
  .axis-break::before { left: 34%; }
  .axis-break::after { left: 58%; }
  .outcome-rail {
    display: flex; flex-direction: column; gap: var(--sp-1);
    padding: var(--sp-3) var(--sp-2);
    border-left: 1px solid var(--border-strong);
    background: var(--bg-inset);
    font-family: var(--mono);
  }
  .outcome-rail-title {
    font-size: 9.5px; font-weight: 700; letter-spacing: .9px;
    text-transform: uppercase; color: var(--text-faint);
  }
  .outcome-rail-value { font-size: 13px; font-weight: 700; color: var(--text); }
  .outcome-rail-value--success { color: var(--ok); }
  .outcome-rail-value--failed { color: var(--fail); }
  .outcome-rail-value--pending { color: var(--idle); font-weight: 600; }
  .outcome-rail-lane { font-size: 11.5px; color: var(--text-dim); }
  .outcome-rail-at { font-size: 11px; color: var(--text-faint); }
  .outcome-rail-note { font-size: 10.5px; font-style: italic; color: var(--text-faint); line-height: 1.5; }
  .lane {
    display: grid; grid-template-columns: var(--lane-gutter) minmax(0, 1fr);
    background: var(--bg-raised);
  }
  .lane + .lane { border-top: 1px solid var(--border); }
  .lane--client { --lane-accent: var(--client); }
  .lane--host { --lane-accent: var(--host); }
  .lane--python-worker { --lane-accent: var(--worker); }
  .lane--application { --lane-accent: var(--app); }
  .lane-head {
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1);
    padding: var(--sp-3);
    border-right: 1px solid var(--border);
    border-left: 3px solid var(--lane-accent);
  }
  .lane-title {
    margin: 0; font-size: 12.5px; font-weight: 700;
    letter-spacing: .9px; text-transform: uppercase; color: var(--text-dim);
  }
  .lane-title::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 2px; background: var(--lane-accent); margin-right: var(--sp-2);
  }
  /* role subtitle (spec §3.1) — ownership readable without prior knowledge */
  .lane-subtitle { margin: 0; font-size: 11.5px; font-style: italic; color: var(--text-faint); }
  .lane-status {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border-strong);
    color: var(--idle); background: rgba(118,131,144,.08); white-space: nowrap;
  }
  .lane-status[data-status="reached"] { color: var(--ok); border-color: rgba(63,185,80,.45); background: rgba(63,185,80,.08); }
  .lane-status[data-status="failed-here"] { color: var(--fail); border-color: rgba(248,81,73,.5); background: rgba(248,81,73,.08); }
  .lane-reason { margin: var(--sp-1) 0 0; font-size: 11px; font-style: italic; color: var(--text-faint); }

  /* time track — elapsed runs left→right; gridlines share the axis step */
  .lane-track {
    position: relative; min-height: 92px;
    background-color: var(--bg-inset);
    background-image: repeating-linear-gradient(to right,
      var(--gridline) 0px, var(--gridline) 1px, transparent 1px, transparent var(--grid-period, 25%));
  }
  .lane-track::before { /* lane baseline — the lane's own L→R time line */
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-strong) 4%, var(--border-strong) 96%, transparent);
  }
  .lane[data-status="not-reached"] .lane-track { background-image: none; } /* empty interior (§3.2) */

  /* pre-play structure view (#70, spec §10) — before any motion, band B shows
     the fixed four-component topology: one static dashed L→R chain per lane,
     with drops linking lane to lane in order. This is structure, never
     timing: gridlines and baselines are suppressed, no axis row is drawn,
     and segments on lanes this run did not (or may not have) reached are
     dimmed so the chain never implies control arrived there. */
  .lanes[data-view="structure"] .lane-track { background-image: none; }
  .lanes[data-view="structure"] .lane-track::before { display: none; }
  .lane-chain { position: absolute; left: var(--sp-4); right: var(--sp-4); top: 50%; height: 0; }
  .lane-chain::before {
    content: ""; position: absolute; left: 0; right: 9px; top: -1px;
    border-top: 1.5px dashed var(--idle);
  }
  .lane-chain::after {
    content: ""; position: absolute; right: 0; top: -5px;
    border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    border-left: 8px solid var(--idle);
  }
  .lane-chain--unreached { opacity: .35; }
  .lane-chain-drop {
    position: absolute; right: var(--sp-4); bottom: -4px; width: 0; height: 0; z-index: 2;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 7px solid var(--idle);
  }
  .lane-chain-drop--unreached { opacity: .35; }

  /* deliberate, explained grey state for unreached lanes (FR-9.1) */
  .lane-empty {
    position: absolute; inset: var(--sp-2) var(--sp-3);
    display: flex; flex-direction: column; justify-content: center; gap: 5px;
    border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
    background: rgba(118,131,144,.05); padding: var(--sp-2) var(--sp-3);
  }
  .lane-empty-title { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--idle); }
  .lane-empty-text { margin: 0; font-size: 12px; color: var(--text-dim); }
  .lane-empty-note { margin: 0; font-size: 11px; font-style: italic; color: var(--text-faint); }
  .lane-note {
    position: absolute; inset: 0; margin: 0; padding: 0 var(--sp-4);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-style: italic; color: var(--text-faint); text-align: center;
  }

  /* #55 — the failure marker keeps ONLY its positional geometry: a dashed
     vertical line at the failure event's x. The outcome WORDS live in the
     header chip and the outcome rail, never inside the lane (spec §3.3). */
  .lane-stop-marker { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed rgba(248,81,73,.55); }

  /* untimed tray (#52 honesty): events without elapsedMs never touch the
     time axis — they are listed in a separated strip below the track that
     carries no positional meaning, each chip explicitly labeled "untimed" */
  .lane-untimed {
    grid-column: 2;
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    border-top: 1px dashed var(--border-strong);
    background: rgba(10, 14, 20, .55);
  }
  .lane-untimed-label {
    flex: none; font-family: var(--mono); font-size: 9.5px; font-weight: 700;
    letter-spacing: .9px; text-transform: uppercase; color: var(--text-faint);
  }
  .lane-untimed-events {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: var(--sp-2);
  }
  .lane-untimed .event { position: static; transform: none; }
  .lane-untimed .event-dot { display: none; }
  .event-untimed-tag {
    font-family: var(--mono); font-size: 9.5px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; color: var(--text-faint);
    border: 1px dashed var(--border-strong); border-radius: 999px; padding: 1px 6px;
  }

  /* shared elapsed-time axis row under the lanes (§4.1) */
  .axis {
    display: grid; grid-template-columns: var(--lane-gutter) minmax(0, 1fr);
    border-top: 1px solid var(--border-strong);
    background: var(--bg-raised);
  }
  .axis-gutter {
    display: flex; flex-direction: column; gap: 1px; justify-content: center;
    padding: var(--sp-1) var(--sp-3);
    border-right: 1px solid var(--border);
    font-family: var(--mono);
  }
  .axis-caption { font-size: 10px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--text-faint); }
  .axis-caption-sub { font-size: 9.5px; font-style: italic; color: var(--text-faint); }
  .axis-track { position: relative; height: 34px; background: var(--bg-inset); }
  .axis-tick { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid rgba(144,160,180,.28); }
  .axis-tick-label {
    position: absolute; top: 3px; left: 4px;
    font-family: var(--mono); font-size: 10px; color: var(--text-faint); white-space: nowrap;
  }
  .axis-end {
    position: absolute; right: var(--sp-2); top: 3px;
    font-family: var(--mono); font-size: 10px; color: var(--text-dim); white-space: nowrap;
  }

  /* #70 pre-play caption strip — stands in for the axis row while the
     structure chain is shown; labels the chain as structure, not timing */
  .structure-note {
    display: grid; grid-template-columns: var(--lane-gutter) minmax(0, 1fr);
    border-top: 1px solid var(--border-strong);
    background: var(--bg-raised);
  }
  .structure-note-gutter {
    display: flex; flex-direction: column; gap: 1px; justify-content: center;
    padding: var(--sp-1) var(--sp-3);
    border-right: 1px solid var(--border);
    font-family: var(--mono);
  }
  .structure-note-caption { font-size: 10px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--text-faint); }
  .structure-note-sub { font-size: 9.5px; font-style: italic; color: var(--text-faint); }
  .structure-note-text {
    margin: 0; display: flex; align-items: center;
    padding: var(--sp-2) var(--sp-3);
    font-size: 11.5px; color: var(--text-dim); background: var(--bg-inset);
  }

  /* ============================================================
     events — swimlane nodes at their elapsed-time x (#52).
     The dot sits exactly at the event's time; the label chip
     attaches left or right so the axis stays honest at the edges.
     Observed = solid; inferred = dashed + hatch (unchanged cues).
     ============================================================ */
  .lane-events { list-style: none; margin: 0; padding: 0; position: absolute; inset: 0; }
  .event {
    position: absolute; left: 0; top: 50%;
    display: flex; align-items: center;
    transform: translateY(-50%);
    cursor: pointer; z-index: 1;
  }
  .event[data-side="left"] { flex-direction: row-reverse; transform: translate(-100%, -50%); }
  .event-dot {
    flex: none; width: 10px; height: 10px; border-radius: 50%;
    margin-left: -5px; background: var(--lane-accent);
    box-shadow: 0 0 0 3px rgba(10,14,20,.9);
  }
  .event[data-side="left"] .event-dot { margin-left: 0; margin-right: -5px; }
  .event.confidence-inferred .event-dot { background: transparent; border: 1.5px dashed var(--lane-accent); }
  .event-chip {
    position: relative;
    display: inline-flex; align-items: center; gap: var(--sp-2);
    margin-left: var(--sp-2); padding: 3px var(--sp-2);
    max-width: 320px;
    background: var(--bg-raised); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); white-space: nowrap;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .event[data-side="left"] .event-chip { margin-left: 0; margin-right: var(--sp-2); }
  .event.confidence-observed .event-chip { border-left: 2px solid var(--lane-accent); }
  .event.confidence-inferred .event-chip {
    border-style: dashed;
    background-image: repeating-linear-gradient(-45deg, rgba(148,163,184,.06) 0 6px, rgba(148,163,184,0) 6px 14px);
  }
  .event:hover .event-chip { border-color: var(--lane-accent); }
  .event-seq {
    flex: none; width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10px; color: var(--text-faint);
    border: 1px solid var(--border); border-radius: 50%;
  }
  .event-name {
    font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text);
    max-width: 172px; overflow: hidden; text-overflow: ellipsis;
  }
  .event-elapsed { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
  .event:focus-visible .event-chip { outline: 2px solid var(--host); outline-offset: 2px; }
  .event.is-failure .event-chip { border-color: rgba(248,81,73,.65); }
  .event.is-failure .event-dot { background: var(--fail); }
  .event.confidence-inferred.is-failure .event-dot { background: transparent; border-color: var(--fail); }
  .event.is-active .event-chip {
    border-color: rgba(230,237,243,.7);
    box-shadow: 0 0 0 2px rgba(230,237,243,.55), 0 0 0 6px rgba(91,157,248,.14);
  }
  .event.is-active .event-chip::after {
    content: "current step"; position: absolute; top: -9px; left: var(--sp-2);
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    background: var(--host); color: #08111f;
    padding: 1px 7px; border-radius: 999px;
  }

  /* ============================================================
     step detail — selected step + never-cut raw log (FR-8)
     ============================================================ */
  .step-detail {
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: var(--sp-4);
  }
  .step-detail.confidence-inferred {
    border-style: dashed;
    background-image: repeating-linear-gradient(-45deg, rgba(148,163,184,.06) 0 6px, rgba(148,163,184,0) 6px 14px);
  }
  .step-detail-title {
    display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
    margin: 0 0 var(--sp-3); font-family: var(--mono);
    font-size: 15px; font-weight: 700; color: var(--text);
  }
  .step-detail-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .step-detail.confidence-observed .step-detail-title .confidence-badge { background: var(--ok); color: #03130a; }
  .step-detail.confidence-inferred .step-detail-title .confidence-badge {
    color: var(--worker); border: 1px dashed var(--worker); background: transparent;
  }
  .detail-grid {
    display: grid; grid-template-columns: auto minmax(0, 1fr);
    gap: var(--sp-1) var(--sp-3); margin: 0 0 var(--sp-3);
  }
  .detail-grid dt {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: .7px; text-transform: uppercase; color: var(--text-faint);
    padding-top: 3px; white-space: nowrap;
  }
  .detail-grid dd {
    margin: 0; font-family: var(--mono); font-size: 12.5px;
    color: var(--text-dim); overflow-wrap: anywhere;
  }
  .detail-grid dd.detail-id { color: var(--text); }
  .raw-log-label {
    margin: 0 0 var(--sp-2); font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; color: var(--text-faint);
  }
  .raw-log {
    margin: 0; padding: var(--sp-3);
    font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text);
    background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 360px; overflow: auto;
  }
  .step-detail-empty { margin: 0; font-size: 13px; font-style: italic; color: var(--text-faint); }

  /* ============================================================
     call stack panel (#59, spec §6.2) — band D beside the step
     detail: gdb-style frames of the lanes ACTIVE at the playhead,
     innermost first (#0 application → #3 client). Derived in-viewer
     from crossed timed events + lane status only — NO schema
     change. An absent application frame in a pre-invocation
     failure is the finding itself, so the panel never pads the
     stack; the diagnostic note row makes the absence legible.
     The viewport reserves exactly four frame rows + one note row
     whatever the active count, so band D keeps one height across
     every playhead position (#57 fixed-height discipline, §11
     layout stability).
     ============================================================ */
  .stack-panel {
    --stack-frame-h: 30px;
    --stack-note-h: 26px;
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: var(--sp-4);
  }
  .stack-title {
    display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap;
    margin: 0 0 var(--sp-3); font-family: var(--mono);
    font-size: 15px; font-weight: 700; color: var(--text);
  }
  /* live REAL ms at the playhead — mirrors the transport clock (#60);
       no aria-live because it moves every animation frame */
  .stack-clock {
    margin-left: auto; font-family: var(--mono); font-size: 11.5px;
    font-weight: 600; color: var(--host); white-space: nowrap;
  }
  .stack-viewport {
    height: calc(var(--stack-frame-h) * 4); /* reserved for 4 frames */
    background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden;
  }
  .stack-frames { list-style: none; margin: 0; padding: 0; }
  .stack-frame {
    height: var(--stack-frame-h);
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 0 var(--sp-3) 0 var(--sp-2);
    border-left: 2px solid var(--lane-accent, var(--border-strong));
    font-family: var(--mono);
  }
  .stack-frame + .stack-frame { border-top: 1px solid var(--border); }
  .stack-frame[data-lane="application"] { --lane-accent: var(--app); }
  .stack-frame[data-lane="python-worker"] { --lane-accent: var(--worker); }
  .stack-frame[data-lane="host"] { --lane-accent: var(--host); }
  .stack-frame[data-lane="client"] { --lane-accent: var(--client); }
  .frame-num {
    flex: none; width: 2.4em; text-align: right;
    font-size: 12px; font-weight: 600; color: var(--text-faint);
  }
  .frame-swatch {
    flex: none; width: 8px; height: 8px; border-radius: 2px;
    background: var(--lane-accent);
  }
  .frame-name { font-size: 12.5px; font-weight: 700; color: var(--text); }
  .frame-role {
    margin-left: auto; font-family: var(--sans);
    font-size: 11px; font-style: italic; color: var(--text-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* explicit neutral states — never a blank box, never a fabricated stack */
  .stack-placeholder {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 0 var(--sp-3); text-align: center;
    font-size: 12px; font-style: italic; color: var(--text-faint);
  }
  .stack-note {
    margin: var(--sp-2) 0 0; height: var(--stack-note-h);
    display: flex; align-items: center;
    font-family: var(--mono); font-size: 11px; color: var(--text-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* §6.2 — the absence of an application frame in a pre-invocation
       failure is itself the diagnostic; the note states it factually */
  .stack-note--diagnostic { color: var(--fail); }

  /* ============================================================
     error summary (#62, spec §7 band E) — per-trace failure
     message + failing component, or an EXPLICIT reserved empty
     row. Fixed-height discipline (§11.11): the viewport reserves
     exactly two rows in EVERY state, so a success frame and a
     failure frame hold the same height and nothing below the row
     ever shifts on a trace swap (same pattern as the stack's
     reserved viewport / the banner's fixed head). The message is
     always quoted verbatim from the data — failures[0].message,
     else the failure event's raw log line, tagged as the log
     line — never reworded, never invented.
     ============================================================ */
  .error-summary {
    --err-row-h: 26px;
    --err-accent: var(--idle); /* neutral while no error is present */
    background: var(--bg-raised); border: 1px solid var(--border);
    border-left: 4px solid var(--err-accent);
    border-radius: var(--radius-md); padding: var(--sp-4);
  }
  .error-summary[data-has-error="true"] { --err-accent: var(--fail); }
  .error-title {
    display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap;
    margin: 0 0 var(--sp-3); font-family: var(--mono);
    font-size: 15px; font-weight: 700; color: var(--text);
  }
  .error-viewport {
    height: calc(var(--err-row-h) * 2); /* reserved: message + meta rows */
    background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden;
  }
  .error-msg-row {
    height: var(--err-row-h);
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 0 var(--sp-2) 0 var(--sp-3);
    border-left: 2px solid var(--fail);
    font-family: var(--mono);
  }
  /* source tag names WHERE the quote comes from when it is not a
       failures[].message — the raw log line, quoted as-is */
  .error-msg-src {
    flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: .8px;
    text-transform: uppercase; color: var(--text-faint);
    border: 1px dashed var(--border-strong); border-radius: 999px; padding: 1px 6px;
  }
  .error-msg-text {
    min-width: 0; font-size: 12px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .error-msg-text--absent { color: var(--text-faint); font-style: italic; }
  .error-meta-row {
    height: var(--err-row-h);
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 0 var(--sp-2) 0 var(--sp-3);
    border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden;
  }
  .error-component { font-weight: 700; color: var(--text); }
  .error-component--unknown { color: var(--text-faint); font-weight: 400; font-style: italic; }
  /* failing-lane swatch — same accent vocabulary as lanes/stack frames */
  .error-lane-dot {
    flex: none; width: 8px; height: 8px; border-radius: 2px;
    background: var(--lane-accent, var(--border-strong));
  }
  .error-meta-row[data-lane="application"] { --lane-accent: var(--app); }
  .error-meta-row[data-lane="python-worker"] { --lane-accent: var(--worker); }
  .error-meta-row[data-lane="host"] { --lane-accent: var(--host); }
  .error-meta-row[data-lane="client"] { --lane-accent: var(--client); }
  /* kind chip — small mono context tag (e.g. invocation-failed) */
  .error-kind {
    flex: none; margin-left: auto;
    font-size: 9.5px; font-weight: 700; letter-spacing: .8px;
    text-transform: uppercase; color: var(--text-dim);
    border: 1px solid var(--border-strong); border-radius: 999px; padding: 1px 7px;
  }
  /* explicit neutral state — never a blank box (mirrors stack-placeholder) */
  .error-empty-row {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 0 var(--sp-3); text-align: center;
    font-size: 12px; font-style: italic; color: var(--text-faint);
  }

  /* ============================================================
     application source panel (FR-6)
     ============================================================ */
  .source-panel {
    position: sticky; top: var(--sp-4);
    background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--radius-md); overflow: hidden;
  }
  .source-head {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-4);
    background: var(--bg-raised); border-bottom: 1px solid var(--border);
  }
  .source-dot { flex: none; width: 9px; height: 9px; border-radius: 2px; background: var(--app); }
  .source-file { margin: 0; font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text); }
  .source-reason { margin: var(--sp-2) var(--sp-4) 0; }
  /* #57 (spec §5.1) — gdb-style fixed source window: at most 9 real lines
     (focus ±4) plus two reserved collapse-row slots. The panel height is
     identical for a 9-line and a 600-line file; source text never grows the
     band and never gets a vertical scrollbar (long lines scroll horizontally
     only). Line/collapse heights are CSS-custom-property-driven so the math
     is deterministic across viewport widths. */
  .source-panel { --src-line-h: 21px; --src-collapse-h: 25px; }
  .source-body { padding: var(--sp-2) 0 0; }
  .source-window {
    height: calc(var(--src-line-h) * 9 + var(--src-collapse-h) * 2);
    overflow-x: auto; overflow-y: hidden;
  }
  .source-collapse {
    height: var(--src-collapse-h);
    display: flex; align-items: center; white-space: nowrap;
    padding: 0 var(--sp-4);
    font-family: var(--mono); font-size: 11px; color: var(--text-faint);
    background: rgba(118, 131, 144, .05);
    border-top: 1px dashed var(--border);
    border-bottom: 1px dashed var(--border);
  }
  .source-code { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; }
  .source-line { display: flex; align-items: center; height: var(--src-line-h); white-space: pre; padding: 0 var(--sp-4); }
  .source-line:hover { background: rgba(255,255,255,.025); }
  .line-num {
    flex: none; width: 3.6em; text-align: right; margin-right: var(--sp-4);
    color: var(--text-faint); user-select: none; white-space: pre;
  }
  .line-content { flex: 1; color: var(--text); }
  .source-line.def-line { background: rgba(177,139,245,.10); box-shadow: inset 2px 0 0 var(--app); }
  .source-line.def-line .line-num { color: var(--app); font-weight: 700; }
  /* #58 (spec §5.3/§9b) — the failure-matched line gets a DISTINCT error
     accent. Rules sit after the def-line pair so a line that is BOTH
     (error inside the definition range) reads error-first; the def-line
     class stays on it, the error cue just dominates the cascade. */
  .source-line.error-line { background: rgba(248,81,73,.12); box-shadow: inset 2px 0 0 var(--fail); }
  .source-line.error-line .line-num { color: var(--fail); font-weight: 700; }
  /* #58 (spec §5.3/§9b, acceptance §11.9) — source-highlight confidence
     labels. The definition range note and up to two label rows (definition
     match, failure match) share ONE footer of three reserved rows at
     --src-collapse-h each, rendered whenever any of them has content. The
     height is fixed regardless of which rows are present, so a panel WITH
     labels is exactly as tall as one WITHOUT (#57 fixed-height discipline:
     label presence never moves the panel height). */
  .source-footer {
    /* +1px: the top border lives inside this border-box height, keeping
       the three 25px rows fully inside overflow:hidden (not 1px-clipped) */
    height: calc(var(--src-collapse-h) * 3 + 1px);
    border-top: 1px solid var(--border);
    overflow: hidden;
  }
  .source-range-note,
  .source-confidence-row {
    margin: 0; height: var(--src-collapse-h); line-height: var(--src-collapse-h);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 var(--sp-4);
    font-family: var(--mono); font-size: 11px;
  }
  .source-range-note { color: var(--app); }
  .source-confidence-row { color: var(--text-dim); }
  .source-confidence-row .sc-word { color: var(--worker); font-weight: 700; letter-spacing: .4px; }
  .source-placeholder { padding: var(--sp-5); color: var(--text-dim); font-size: 13.5px; line-height: 1.65; }
  .source-placeholder code {
    font-family: var(--mono); font-size: 12px; color: var(--worker);
    background: rgba(227,179,65,.08); padding: 1px 5px; border-radius: 4px;
  }

  .app-footer {
    max-width: 1440px; margin: 0 auto; padding: 0 var(--sp-5) var(--sp-5);
    font-family: var(--mono); font-size: 11.5px; color: var(--text-faint);
  }

  @media (max-width: 1080px) {
    .layout { grid-template-columns: 1fr; }
    .source-panel { position: static; }
  }
  @media (max-width: 720px) {
    /* role subtitles stay visible at every width (spec §3.1 / acceptance 2) —
       they wrap and shrink instead of disappearing. #60: shrink the gutter by
       overriding --lane-gutter itself so .lane / .axis / .structure-note AND
       .playhead-layer all share ONE origin with the node x% track. */
    .lanes { --lane-gutter: 148px; --outcome-col: 92px; }
    .lane-subtitle { font-size: 10.5px; }
    .lane-reason { font-size: 10px; }
    .runtime-meta { margin-left: 0; flex-basis: 100%; text-align: left; }
    .load-status { margin-left: 0; flex-basis: 100%; }
  }
</style>
</head>

     the disclosure that reveals the full summary + detail paragraph. -->

    </div>

<script>
(function () {
  "use strict";

  /* spec §3.1 — four fixed swimlane rows, top to bottom, always rendered */
  var LANE_ORDER = ["client", "host", "python-worker", "application"];
  var LANE_LABELS = { "client": "Client", "host": "Host", "python-worker": "Python Worker", "application": "Application" };
  /* role subtitles (spec §3.1) — ownership readable without prior knowledge */
  var LANE_ROLE_SUBTITLES = {
    "client": "caller / HTTP",
    "host": "Functions host / dispatch",
    "python-worker": "language worker / gRPC",
    "application": "your function code"
  };
  var STATUS_LABELS = { "reached": "Reached", "failed-here": "Failed here", "not-reached": "Not reached", "unknown": "Unknown" };
  var SOURCE_LABELS = { "log-delta": "log delta", "host-reported": "host reported", "http-reported": "HTTP reported" };

  /* confidence banner (#10) — summarizes all four lanes, matching the
     swimlane rows (#52); the application lane also lives in the source panel */
  var CONFIDENCE_LANE_ORDER = ["client", "host", "python-worker", "application"];
  var CONFIDENCE_LANE_LABELS = { "client": "Client", "host": "Host", "python-worker": "Python Worker", "application": "Application" };
  var CONFIDENCE_DETAIL_INFERRED = "Host\u2194Python Worker is observed and correlatable from log IDs. Client is derived from host HTTP request/response lines; Application is an inferred user-code window. No events are fabricated inside inferred lanes.";
  var CONFIDENCE_DETAIL_NOT_REACHED = "The worker failure is observed in the logs. Client and Application did not run before the failure; their empty lanes are findings, not inferred activity.";
  var CONFIDENCE_DETAIL_NOT_REACHED_GENERIC = "Some lanes were not reached or not captured in this trace. Empty lanes are findings, not inferred activity.";
  var CONFIDENCE_DETAIL_ALL_OBSERVED = "Every populated lane in this trace is observed directly in the captured logs.";
  var CONFIDENCE_DETAIL_INFERRED_GENERIC = "Some lanes are inferred rather than observed directly in the logs. An inferred lane is a window between observed events; no events are fabricated inside it.";
  var CONFIDENCE_DETAIL_NO_TRACE = "No trace is loaded \u2014 lane confidence will be summarized here once a trace is rendered.";
  var CONFIDENCE_WORKER_FALLBACK = "Python Worker activity was not captured; re-run with elevated worker/gRPC logging.";

  /* selection state (#6) — first-class, shared with #7 playback */
  var currentTrace = null;
  var orderedEvents = [];
  var selectedEventId = null;
  /* #70 pre-play structure state (spec §10) — true right after renderTrace
     and resetPlayback; the first play/step/selection flips it false and
     swaps band B from the static structure chain to the event stream. */
  var prePlay = true;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function tx(s) { return document.createTextNode(s); }
  function normalizeRange(range) {
    if (Array.isArray(range) && range.length === 2 &&
        typeof range[0] === "number" && typeof range[1] === "number" &&
        range[0] >= 1 && range[0] <= range[1]) {
      return [range[0], range[1]];
    }
    return null;
  }

  /* ---------------- source window (#57, spec §5.1) ------------------------ */
  /* gdb-style window: focus line ±4 real lines, edge-shifted so up to 9 real
     lines stay visible near the file start/end. Pure and 1-based inclusive:
     (totalLines, focusLine) → {start, end, above, below}. The focus anchor is
     always schema-backed (#58): failures[0].sourceLine when present, else the
     definitionLineRange start, else line 1 when neither exists — there is no
     runtime line number, so none is ever invented here. */
  var SOURCE_WINDOW_RADIUS = 4;
  var SOURCE_WINDOW_LINES = 2 * SOURCE_WINDOW_RADIUS + 1;
  var sourceWindowState = null; /* {start,end,focus,focusSource,total,above,below,definitionConfidence,failureLine,failureConfidence} or null */

  function sourceWindow(totalLines, focusLine) {
    var total = Math.max(1, totalLines);
    var span = Math.min(SOURCE_WINDOW_LINES, total);
    var focus = Math.min(Math.max(1, focusLine), total);
    var start = Math.max(1, focus - SOURCE_WINDOW_RADIUS);
    var end = start + span - 1;
    if (end > total) {
      end = total;
      start = Math.max(1, end - span + 1);
    }
    return { start: start, end: end, above: start - 1, below: total - end };
  }

  function buildSourceCollapse(side, count) {
    var row = el("div", "source-collapse");
    row.setAttribute("data-source-collapse", side);
    row.setAttribute("data-count", String(count));
    row.setAttribute("role", "note");
    row.setAttribute("aria-label", count + " source lines omitted " + side + " the visible window.");
    row.textContent = "… " + count + " lines " + side;
    return row;
  }

  /* ---------------- header summary + outcome chip (#55, spec §2.1) ------ */
  /* #55 — the failing lane is derived ONLY from lanes[*].status ===
     "failed-here" (plus its failureEvent); never hardcoded. Returns null
     when the run did not stop in a lane. */
  function findFailureLane(trace) {
    var lanesMeta = (trace && trace.lanes) || {};
    var i;
    var key;
    var meta;
    for (i = 0; i < LANE_ORDER.length; i++) {
      key = LANE_ORDER[i];
      meta = lanesMeta[key];
      if (meta && meta.status === "failed-here") {
        return { lane: key, meta: meta };
      }
    }
    return null;
  }

  function renderHeader(trace) {
    var summary = document.getElementById("summaryText");
    var chip = document.getElementById("outcomeChip");
    var app = (trace && trace.application) || {};
    /* a loaded trace without application metadata (e.g. indexing failed
       before the function was known) is NOT "no trace" — name it honestly */
    var fn = app.functionName || (trace ? "unknown function" : "no trace loaded");
    var outcome = (trace && trace.outcome) || "none";
    var intervals = (trace && trace.intervals) || [];
    var hostReported = null;
    var failLane = null;
    var failEvent = null;
    var i;
    summary.textContent = "";
    for (i = 0; i < intervals.length; i++) {
      if (intervals[i].source === "host-reported") { hostReported = intervals[i]; break; }
    }
    summary.appendChild(el("span", "fn", fn));

    /* §2.1 — a failure header must not lead with a duration: outcome is the
       headline (chip below), and the failure time, when shown at all, is
       subordinate and framed as "reached failure at". Success keeps its
       duration in the summary line as before. */
    if (outcome === "failure") {
      failLane = findFailureLane(trace);
      failEvent = failLane ? findEventById(failLane.meta.failureEvent) : null;
      if (failEvent && typeof failEvent.elapsedMs === "number") {
        summary.appendChild(tx(" · "));
        summary.appendChild(el("span", "fail-at",
          "reached failure at +" + failEvent.elapsedMs + " ms"));
      }
    } else if (hostReported) {
      summary.appendChild(tx(" · "));
      summary.appendChild(el("span", "dur", hostReported.durationMs + "ms"));
    }
    /* §11.11 (#62) — the one-row header ellipsizes this line; the title
       keeps the full summary reachable on hover/focus */
    summary.parentElement.setAttribute("title", summary.textContent);

    /* outcome chip — the run outcome as a band-A headline element (#55) */
    chip.textContent = "";
    chip.setAttribute("data-outcome",
      outcome === "success" ? "success" : outcome === "failure" ? "failed" : "none");
    chip.appendChild(el("span", "outcome-dot outcome--" + outcome));
    chip.appendChild(tx(outcome === "success" ? "success" : outcome === "failure" ? "failed" : outcome));

    var rt = (trace && trace.runtime) || {};
    var parts = [];
    if (rt.environment) parts.push(rt.environment);
    if (rt.language) parts.push(rt.language);
    if (rt.trigger) parts.push(rt.trigger + " trigger");
    if (rt.hostVersion) parts.push("Host " + rt.hostVersion);
    if (rt.coreToolsVersion) parts.push("Core Tools " + rt.coreToolsVersion);
    document.getElementById("runtimeMeta").textContent = parts.join(" · ");
    document.getElementById("runtimeMeta").setAttribute("title", parts.join(" · "));
    document.getElementById("footerMeta").textContent = trace
      ? "trace " + (trace.traceId || "?") + " · schema " + (trace.schemaVersion || "?")
      : "no trace";
  }

  /* ---------------- confidence boundary banner (#10) -------------------- */
  /* Plain-language summary of which lanes are Observed vs Inferred vs Not
     reached. Derived ONLY from lanes[*].status + lanes[*].confidence — an
     additive summary of the same schema truth, not a new source of it.
     #61 (spec §15): renders one line at rest (title mark, mono counts,
     disclosure toggle); every render resets to collapsed. The full clause
     summary and detail paragraph — including the worker-not-captured
     fallback sentence — remain reachable behind the toggle. */
  function renderConfidenceBanner(trace) {
    var banner = document.getElementById("confidenceBanner");
    var lanesMeta = (trace && trace.lanes) || {};
    var observed = [];
    var inferred = [];
    var notReached = [];
    var unknown = [];
    var i;
    var key;
    var meta;
    var status;
    var detail;
    var worker;
    var host;
    var head;
    var title;
    var oneline;
    var toggle;
    var body;
    var inner;
    var summary;

    for (i = 0; trace && i < CONFIDENCE_LANE_ORDER.length; i++) {
      key = CONFIDENCE_LANE_ORDER[i];
      meta = lanesMeta[key];
      status = meta ? (meta.status || "not-reached") : "not-reached";
      if (status === "reached" || status === "failed-here") {
        if (meta.confidence === "inferred") inferred.push(key);
        else observed.push(key);
      } else if (status === "unknown") {
        unknown.push(key);
      } else { /* not-reached / missing */
        notReached.push(key);
      }
    }

    banner.textContent = "";
    banner.setAttribute("data-observed", observed.join(","));
    banner.setAttribute("data-inferred", inferred.join(","));
    banner.setAttribute("data-not-reached", notReached.join(","));
    banner.setAttribute("data-unknown", unknown.join(","));
    banner.setAttribute("data-collapsed", "true");
    banner.className = "confidence-banner" +
      (inferred.length ? "" : observed.length ? " confidence-banner--observed" : " confidence-banner--empty");

    /* head row (#61) — title mark + one-line counts + disclosure toggle */
    head = el("div", "confidence-head");
    title = el("h2", "confidence-banner-title", "Trace confidence boundary");
    title.setAttribute("id", "confidenceBannerTitle");
    head.appendChild(title);

    oneline = el("p", "confidence-oneline");
    function count(label, n, catClass) {
      var span = el("span", "conf-cat " + catClass);
      span.appendChild(el("span", "conf-num", String(n)));
      span.appendChild(tx(" " + label));
      return span;
    }
    if (!trace) {
      oneline.appendChild(el("strong", "conf-cat", "No trace loaded."));
    } else {
      oneline.appendChild(count("observed", observed.length, "conf-cat--observed"));
      oneline.appendChild(el("span", "conf-sep", "\u00b7"));
      oneline.appendChild(count("inferred", inferred.length, "conf-cat--inferred"));
      oneline.appendChild(el("span", "conf-sep", "\u00b7"));
      oneline.appendChild(count("not reached", notReached.length, "conf-cat--not-reached"));
      if (unknown.length) {
        oneline.appendChild(el("span", "conf-sep", "\u00b7"));
        oneline.appendChild(count("unknown", unknown.length, "conf-cat--unknown"));
      }
    }
    head.appendChild(oneline);

    toggle = el("button", "confidence-toggle");
    toggle.setAttribute("type", "button");
    toggle.setAttribute("aria-expanded", "false");
    toggle.setAttribute("aria-controls", "confidenceBody");
    toggle.appendChild(el("span", "confidence-toggle-caret", "\u25b8"));
    toggle.appendChild(el("span", "confidence-toggle-label", "Details"));
    toggle.addEventListener("click", function () {
      var expand = banner.getAttribute("data-collapsed") === "true";
      banner.setAttribute("data-collapsed", expand ? "false" : "true");
      toggle.setAttribute("aria-expanded", expand ? "true" : "false");
    });
    head.appendChild(toggle);
    banner.appendChild(head);

    body = el("div", "confidence-body");
    body.setAttribute("id", "confidenceBody");
    inner = el("div", "confidence-body-inner");
    body.appendChild(inner);
    banner.appendChild(body);

    if (!trace) {
      detail = CONFIDENCE_DETAIL_NO_TRACE;
    } else if (inferred.length) {
      /* Use the specific v0.1 success copy only for the exact observed/inferred
         shape it describes; otherwise a neutral inferred summary avoids overclaiming. */
      if (observed.join(",") === "host,python-worker" && inferred.join(",") === "client,application") {
        detail = CONFIDENCE_DETAIL_INFERRED;
      } else {
        detail = CONFIDENCE_DETAIL_INFERRED_GENERIC;
      }
    } else if (notReached.length) {
      /* Specific worker-fail copy only for the exact shape it describes;
         otherwise a neutral summary avoids overclaiming which lanes ran. */
      if (observed.join(",") === "host,python-worker" && notReached.join(",") === "client,application") {
        detail = CONFIDENCE_DETAIL_NOT_REACHED;
      } else {
        detail = CONFIDENCE_DETAIL_NOT_REACHED_GENERIC;
      }
    } else {
      detail = CONFIDENCE_DETAIL_ALL_OBSERVED;
    }

    /* worker-not-captured fallback — extra sentence on Line 2 only when the
       worker lane went unobserved while the host lane was actually reached. */
    worker = lanesMeta["python-worker"] || {};
    host = lanesMeta["host"] || {};
    var workerStatus = worker.status || "not-reached";
    var hostStatus = host.status || "not-reached";
    if (trace &&
        (workerStatus === "not-reached" || workerStatus === "unknown") &&
        (hostStatus === "reached" || hostStatus === "failed-here")) {
      detail += " " + (worker.reason || CONFIDENCE_WORKER_FALLBACK);
    }

    summary = el("p", "confidence-summary");
    if (!trace) {
      summary.appendChild(el("strong", "conf-cat", "No trace loaded."));
      inner.appendChild(summary);
      inner.appendChild(el("p", "confidence-detail", detail));
      return;
    }
    function clause(catText, catClass, keys) {
      var names = keys.length
        ? keys.map(function (k) { return CONFIDENCE_LANE_LABELS[k] || k; }).join(", ")
        : "none";
      summary.appendChild(el("strong", catClass, catText));
      summary.appendChild(tx(" " + names + "."));
    }
    clause("Observed runtime activity:", "conf-cat conf-cat--observed", observed);
    summary.appendChild(tx(" "));
    clause("Inferred activity:", "conf-cat conf-cat--inferred", inferred);
    summary.appendChild(tx(" "));
    clause("Not reached:", "conf-cat conf-cat--not-reached", notReached);
    if (unknown.length) {
      summary.appendChild(tx(" "));
      clause("Unknown/unobserved:", "conf-cat conf-cat--unknown", unknown);
    }
    inner.appendChild(summary);

    inner.appendChild(el("p", "confidence-detail", detail));
  }

  /* ---------------- durations — three labeled chips, never collapsed ---- */
  function renderDurations(trace) {
    var host = document.getElementById("durations");
    host.textContent = "";
    var intervals = (trace && trace.intervals) || [];
    if (!intervals.length) {
      host.appendChild(el("p", "durations-empty", "No duration intervals recorded in this trace."));
      return;
    }
    var max = 1;
    intervals.forEach(function (iv) { if (iv.durationMs > max) max = iv.durationMs; });
    intervals.forEach(function (iv) {
      var conf = iv.confidence === "inferred" ? "inferred" : "observed";
      var chip = el("div", "duration-chip confidence-" + conf);
      chip.setAttribute("data-interval-id", iv.id || "");
      chip.setAttribute(
        "aria-label",
        (iv.label || "interval") + ": " + iv.durationMs + " milliseconds, " +
        (SOURCE_LABELS[iv.source] || iv.source || "unattributed") + ", " + conf
      );

      var head = el("div", "chip-head");
      head.appendChild(el("span", "chip-value", (iv.durationMs != null ? iv.durationMs : "?") + " ms"));
      head.appendChild(tx(" · "));
      head.appendChild(el("span", "chip-source", SOURCE_LABELS[iv.source] || iv.source || "unattributed"));
      head.appendChild(tx("  "));
      head.appendChild(el("span", "confidence-badge", conf.toUpperCase()));
      chip.appendChild(head);

      var bar = el("div", "chip-bar");
      var fill = el("span", iv.lane === "client" ? "bar--client" : "bar--host");
      fill.style.width = Math.max(4, Math.round((iv.durationMs / max) * 100)) + "%";
      bar.appendChild(fill);
      chip.appendChild(bar);

      chip.appendChild(el("div", "chip-label", (iv.label || "interval") + (iv.id ? " · " + iv.id : "")));
      host.appendChild(chip);
    });
  }

  /* ---------------- shared time axis (spec §4.1, #52) ------------------- */
  /* One horizontal elapsed-time axis: t0 at the first event, time increasing
     left → right. Display-only mapping from elapsedMs to a track percentage;
     nothing about the data is compressed or rescaled (compression is #53). */
  var AXIS_STEPS = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000];

  function timeScale(events) {
    var t0 = Infinity;
    var tMax = -Infinity;
    events.forEach(function (ev) {
      if (typeof ev.elapsedMs === "number") {
        if (ev.elapsedMs < t0) t0 = ev.elapsedMs;
        if (ev.elapsedMs > tMax) tMax = ev.elapsedMs;
      }
    });
    if (!isFinite(t0) || !isFinite(tMax)) { t0 = 0; tMax = 0; }
    /* realDomain is the measured span (may legitimately be 0). domain is ONLY
       a divide-by-zero guard for x math — ticks and end labels use realDomain
       so a single-timestamp trace never shows a fabricated "+1 ms" span. */
    var realDomain = tMax - t0;
    return { t0: t0, tMax: tMax, realDomain: realDomain, domain: Math.max(1, realDomain) };
  }

  function axisStep(domain) {
    var i;
    for (i = 0; i < AXIS_STEPS.length; i++) {
      if (domain / AXIS_STEPS[i] <= 6) return AXIS_STEPS[i];
    }
    return AXIS_STEPS[AXIS_STEPS.length - 1];
  }

  /* x position (%) per event id — ONLY for events with a numeric elapsedMs.
     An event without elapsedMs has no measured time, so it gets no axis
     position here (undefined) and renders in the lane's untimed tray instead;
     positional meaning is never fabricated for it. */
  function eventXs(events, scale) {
    var xs = {};
    events.forEach(function (ev) {
      if (typeof ev.elapsedMs === "number") {
        xs[ev.id] = ((ev.elapsedMs - scale.t0) / scale.domain) * 100;
      }
    });
    return xs;
  }

  /* ---------------- axis compression (#53, spec §4.2) --------------------- */
  /* Display-only geometry: ANY gap between consecutive timed events that
     spans > 35% of the real domain with no events inside collapses to a
     fixed 48px band carrying an axis-break marker — including the first
     gap starting at t0 (e.g. success.json's 0→251ms lead-in, 85% of the
     domain; excluding it jammed 5 of 7 events into the last 15%). Every
     numeric readout (detail panel, chips, live counter) stays REAL ms;
     only spacing compresses ("the axis may lie about spacing; the readouts
     must not"). A trace with no qualifying gap keeps the pure linear path
     and renders byte-identically to the pre-#53 viewer. */
  var COMPRESSION_THRESHOLD = 0.35;
  var BAND_PX = 48;
  var BAND_WALL_MS = 400; /* §8: a compressed span plays through in fixed 400ms */
  var ORIGIN_NUDGE_PX = 12; /* keeps the "+0" tick clear of an at-origin band */
  var compressionBands = []; /* ms-space qualifying gaps: [{aMs, bMs}] */
  var axisMap = null;        /* px-space piecewise map, rebuilt per layout pass */

  function detectCompression(scale, events) {
    var seen = {};
    var timed = [];
    var i;
    var gap;
    compressionBands = [];
    events.forEach(function (ev) {
      if (typeof ev.elapsedMs === "number" && !seen[ev.elapsedMs]) {
        seen[ev.elapsedMs] = true;
        timed.push(ev.elapsedMs);
      }
    });
    timed.sort(function (a, b) { return a - b; });
    for (i = 1; i < timed.length; i++) {
      gap = timed[i] - timed[i - 1];
      if (gap > COMPRESSION_THRESHOLD * scale.realDomain) {
        compressionBands.push({ aMs: timed[i - 1], bMs: timed[i] });
      }
    }
    return compressionBands.length > 0;
  }

  /* piecewise map: run segments share the non-band px width proportionally
     to their real duration; each band is 48px (spec §4.2) whenever the
     measured track can afford the furniture. On very narrow tracks the
     bands shrink EQUALLY (never past a visible-glyph floor) so the fixed
     budget can never overflow the track — the map stays monotonic and
     within [0, trackW] at every supported viewport; shrinking is purely a
     narrow-viewport degradation, desktop keeps 48px. A band starting AT t0
     gets a small origin nudge so the t0 node and "+0" tick stay clear of
     the break glyph — layout chrome, not fabricated data spacing.
     Zero-width run segments (the at-origin case, or a band ending at tMax)
     are handled by the f=0 guard in msToX — no division by zero anywhere. */
  function buildAxisMap(scale, trackW) {
    var totalBandMs = 0;
    var bandCount = compressionBands.length;
    var nudge = (bandCount > 0 && compressionBands[0].aMs === scale.t0)
      ? ORIGIN_NUDGE_PX
      : 0;
    var minRunReserve = Math.max(1, Math.round(trackW * 0.15));
    var bandW = BAND_PX;
    var runPx;
    var pxPerMs;
    var segments = [];
    var x = 0;
    var ms = scale.t0;
    var i;
    var band;
    for (i = 0; i < bandCount; i++) {
      totalBandMs += compressionBands[i].bMs - compressionBands[i].aMs;
    }
    if (bandCount > 0) {
      /* shrink bands (equally) only when 48px each would starve the runs */
      bandW = Math.min(BAND_PX, Math.floor((trackW - nudge - minRunReserve) / bandCount));
      bandW = Math.max(8, bandW); /* a break band must still read as a band */
      /* last resort for extremely tiny tracks: drop the origin chrome first,
         then cap bands by what actually fits — a degenerate 0-width track
         yields 0-width bands rather than an overflowing, non-monotonic map */
      if (nudge > 0 && nudge + bandCount > trackW) {
        nudge = 0;
      }
      if (nudge + bandCount * bandW > trackW) {
        bandW = Math.max(0, Math.floor((trackW - nudge) / bandCount));
      }
    }
    runPx = Math.max(0, trackW - nudge - bandCount * bandW);
    pxPerMs = runPx / Math.max(1, scale.realDomain - totalBandMs);
    if (nudge > 0) {
      segments.push({ kind: "run", aMs: scale.t0, bMs: scale.t0, xStart: 0, xEnd: nudge });
      x = nudge;
    }
    for (i = 0; i < bandCount; i++) {
      band = compressionBands[i];
      segments.push({ kind: "run", aMs: ms, bMs: band.aMs, xStart: x, xEnd: x + (band.aMs - ms) * pxPerMs });
      x += (band.aMs - ms) * pxPerMs;
      segments.push({ kind: "band", aMs: band.aMs, bMs: band.bMs, xStart: x, xEnd: x + bandW });
      x += bandW;
      ms = band.bMs;
    }
    segments.push({ kind: "run", aMs: ms, bMs: scale.t0 + scale.realDomain,
      xStart: Math.min(x, trackW), xEnd: trackW });
    /* dev-time monotonicity guard (silent clamp, never a user-facing throw):
       segments must be contiguous, non-decreasing, and end exactly at
       trackW — float drift of ±1e-9 aside, the budget math guarantees it */
    for (i = 1; i < segments.length; i++) {
      if (Math.abs(segments[i].xStart - segments[i - 1].xEnd) > 1e-6) {
        segments[i].xStart = segments[i - 1].xEnd;
      }
      if (segments[i].xEnd < segments[i].xStart) {
        segments[i].xEnd = segments[i].xStart;
      }
    }
    if (segments.length) {
      segments[segments.length - 1].xEnd = trackW;
    }
    axisMap = { trackW: trackW, segments: segments, bandW: bandW };
    /* band elements position/size from their own segment — msToX(aMs)
       would resolve an at-origin band to the nudge segment's start (0) */
    axisMap.bandX = segments
      .filter(function (seg) { return seg.kind === "band"; })
      .map(function (seg) { return seg.xStart; });
  }

  function msToX(ms) {
    var segs = axisMap.segments;
    var i;
    var seg;
    var f;
    for (i = 0; i < segs.length; i++) {
      seg = segs[i];
      if (ms <= seg.bMs + 1e-9 || i === segs.length - 1) {
        f = seg.bMs === seg.aMs ? 0 : Math.max(0, Math.min(1, (ms - seg.aMs) / (seg.bMs - seg.aMs)));
        return seg.xStart + f * (seg.xEnd - seg.xStart);
      }
    }
    return axisMap.trackW;
  }

  function msInsideBand(ms) {
    var i;
    for (i = 0; i < compressionBands.length; i++) {
      if (ms > compressionBands[i].aMs + 1e-9 && ms < compressionBands[i].bMs - 1e-9) return true;
    }
    return false;
  }

  /* nice-step ticks over the REAL domain, skipping any that would fall
     inside a compressed band — a tick there would fabricate a position */
  function compressedTicks(scale, step) {
    var ticks = [];
    var k;
    for (k = 0; k * step <= scale.domain; k++) {
      if ((k * step / scale.domain) * 100 > 100.0001) break;
      if (!msInsideBand(scale.t0 + k * step)) {
        ticks.push({ ms: scale.t0 + k * step, label: "+" + (k * step) });
      }
    }
    return ticks;
  }

  /* post-append pass for compressed traces: nodes and stop markers were
     created position-deferred (data-ms); the axis shell was left tick-less.
     Everything below reads the measured track width once — same timing
     model as staggerLaneNodes — and is idempotent for the resize path.
     A parked/paused playhead is re-applied through the SAME msToX so the
     line stays locked to its node after a resize (playhead never keeps a
     stale px left while nodes re-position). */
  var compressionSettleRaf = null;

  /* a forced synchronous measure inside the render pass can differ from
     the settled layout (observed at degenerate widths); one rAF re-apply
     guarantees the final frame's geometry matches the final width. The
     pass is idempotent — desktop positions are recomputed to the same
     strings. */
  function scheduleCompressionSettle() {
    if (compressionSettleRaf != null) window.cancelAnimationFrame(compressionSettleRaf);
    compressionSettleRaf = window.requestAnimationFrame(function () {
      compressionSettleRaf = null;
      if (!prePlay && compressionBands.length > 0 && timeScaleCache) {
        applyCompressionLayout(timeScaleCache, axisStep(timeScaleCache.domain),
          orderedEvents.length > 0);
        staggerLaneNodes();
        renderConnectors();
      }
    });
  }

  function applyCompressionLayout(scale, step, hasEvents) {
    var trackEl = document.querySelector("#lanes .lane-track");
    var axisTrack = document.querySelector("#lanes .axis-track");
    if (!trackEl || !axisTrack) return;
    buildAxisMap(scale, trackEl.offsetWidth);
    positionDeferredByMs('#lanes .event[data-ms]');
    positionDeferredByMs("#lanes .lane-stop-marker[data-ms]");
    renderAxisContent(scale, step, hasEvents, axisTrack);
    renderTrackCompression(scale, step);
    if (playheadMsValue != null) setPlayhead(playheadMsValue);
  }

  function positionDeferredByMs(selector) {
    var nodes = document.querySelectorAll(selector);
    var i;
    var ms;
    var x;
    for (i = 0; i < nodes.length; i++) {
      ms = parseFloat(nodes[i].getAttribute("data-ms"));
      if (!isFinite(ms)) continue;
      /* clamped to the measured track — a mid-reflow measurement can never
         push a node or marker outside [0, trackW] */
      x = Math.max(0, Math.min(axisMap.trackW, msToX(ms)));
      nodes[i].style.left = x.toFixed(1) + "px";
      if (nodes[i].classList.contains("event")) {
        nodes[i].setAttribute("data-side", (x / axisMap.trackW) * 100 > 72 ? "left" : "right");
      }
    }
  }

  function renderAxisContent(scale, step, hasEvents, axisTrack) {
    var ticks = null;
    var i;
    var tick;
    var brk;
    while (axisTrack.firstChild) axisTrack.removeChild(axisTrack.firstChild);
    if (!hasEvents) return;
    if (scale.realDomain === 0) {
      tick = el("div", "axis-tick");
      tick.style.left = "0%";
      tick.appendChild(el("span", "axis-tick-label", "+0"));
      axisTrack.appendChild(tick);
      axisTrack.appendChild(el("span", "axis-end", "end +0 ms"));
      return;
    }
    ticks = compressedTicks(scale, step);
    for (i = 0; i < ticks.length; i++) {
      tick = el("div", "axis-tick");
      tick.style.left = msToX(ticks[i].ms).toFixed(1) + "px";
      tick.appendChild(el("span", "axis-tick-label", ticks[i].label));
      axisTrack.appendChild(tick);
    }
    for (i = 0; i < compressionBands.length; i++) {
      brk = el("div", "axis-break");
      brk.setAttribute("data-axis-break", String(i));
      brk.setAttribute("title", "axis break — " +
        Math.round(compressionBands[i].bMs - compressionBands[i].aMs) +
        " ms compressed for display; readouts stay real");
      brk.style.left = Math.min(axisMap.bandX[i], Math.max(0, axisMap.trackW - axisMap.bandW)).toFixed(1) + "px";
      brk.style.width = axisMap.bandW + "px"; /* 48px desktop; shrunk on narrow tracks */
      axisTrack.appendChild(brk);
    }
    axisTrack.appendChild(el("span", "axis-end", "end +" + scale.realDomain + " ms"));
  }

  function renderTrackCompression(scale, step) {
    var lanes = document.querySelectorAll("#lanes .lane");
    var ticks = compressedTicks(scale, step);
    var i;
    var j;
    var lane;
    var trackEl;
    var stale;
    var band;
    var gridline;
    for (i = 0; i < lanes.length; i++) {
      lane = lanes[i];
      trackEl = lane.querySelector(".lane-track");
      if (!trackEl) continue;
      stale = trackEl.querySelectorAll(".lane-break-band, .lane-gridline");
      for (j = 0; j < stale.length; j++) stale[j].parentNode.removeChild(stale[j]);
      /* not-reached lanes keep their empty interior — no timeline furniture */
      if (lane.getAttribute("data-status") === "not-reached") continue;
      for (j = 0; j < compressionBands.length; j++) {
        band = el("div", "lane-break-band");
        band.setAttribute("aria-hidden", "true");
        band.style.left = Math.min(axisMap.bandX[j], Math.max(0, axisMap.trackW - axisMap.bandW)).toFixed(1) + "px";
        band.style.width = axisMap.bandW + "px"; /* 48px desktop; shrunk on narrow tracks */
        trackEl.appendChild(band);
      }
      for (j = 0; j < ticks.length; j++) {
