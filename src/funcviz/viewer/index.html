        gridline = el("div", "lane-gridline");
        gridline.setAttribute("aria-hidden", "true");
        gridline.style.left = msToX(ticks[j].ms).toFixed(1) + "px";
        trackEl.appendChild(gridline);
      }
    }
  }

  /* ---------------- lanes — horizontal swimlanes on one axis (#52) ------ */
  /* Spec §3.1: four fixed rows (client / host / python-worker / application),
     always rendered, each spanning the width over the shared axis. Nodes sit
     at their elapsed-time x; vertical slot staggering keeps near-simultaneous
     events readable without ever moving their x. */
  function renderLanes(trace) {
    var hostEl = document.getElementById("lanes");
    hostEl.textContent = "";
    hostEl.setAttribute("data-view", prePlay ? "structure" : "stream");
    var main = el("div", "lanes-main");
    var lanesMeta = (trace && trace.lanes) || {};
    var events = (trace && trace.events) || [];
    var marker = null;

    var scale = timeScale(events);
    var xs = eventXs(events, scale);
    var step = axisStep(scale.domain);
    /* #53 — ms-space gap detection runs before the DOM build: compressed
       traces create nodes/markers position-deferred and lay them out from
       the measured track width after append */
    var compressed = detectCompression(scale, events);
    hostEl.setAttribute("data-compressed", compressed ? "1" : "0");
    hostEl.style.setProperty("--grid-period", scale.realDomain === 0
      ? "1000%" /* single t0 line only — no fabricated intermediate gridlines */
      : (step / scale.domain * 100).toFixed(3) + "%");

    LANE_ORDER.forEach(function (key, laneIdx) {
      var meta = lanesMeta[key] || {};
      var status = meta.status || "not-reached";
      var laneEvents = events.filter(function (ev) { return ev.lane === key; });
      var timedEvents = [];
      var untimedEvents = [];
      laneEvents.forEach(function (ev) {
        (typeof ev.elapsedMs === "number" ? timedEvents : untimedEvents).push(ev);
      });
      timedEvents.sort(function (a, b) {
        return (xs[a.id] - xs[b.id]) || ((a.sequence || 0) - (b.sequence || 0));
      });
      untimedEvents.sort(function (a, b) { return (a.sequence || 0) - (b.sequence || 0); });

      var section = el("section", "lane lane--" + key);
      section.setAttribute("data-lane-name", key);
      section.setAttribute("data-status", status);
      section.setAttribute("aria-label", LANE_LABELS[key] + " lane — " +
        (LANE_ROLE_SUBTITLES[key] || "") + " — " + (STATUS_LABELS[status] || status));

      var head = el("header", "lane-head");
      head.appendChild(el("h3", "lane-title", LANE_LABELS[key]));
      head.appendChild(el("p", "lane-subtitle", LANE_ROLE_SUBTITLES[key] || ""));
      var statusChip = el("span", "lane-status", STATUS_LABELS[status] || status);
      statusChip.setAttribute("data-status", status);
      head.appendChild(statusChip);
      if (meta.reason) head.appendChild(el("p", "lane-reason", meta.reason));
      section.appendChild(head);

      var track = el("div", "lane-track");
      var list = el("ul", "lane-events");
      var empty;
      var tray;
      var trayLabel;
      var untimedList;
      var chainReached;
      var nextKey;
      var nextReached;
      var chain;
      var drop;
      if (prePlay) {
        /* #70 structure view (spec §10): the fixed component chain replaces
           the event stream. Topology, not timing — dashed and grey like an
           inferred connector (§4.5), dimmed on lanes whose pre-run status is
           not-reached/unknown so the chain never implies control arrived. */
        chainReached = status === "reached" || status === "failed-here";
        chain = el("div", "lane-chain" + (chainReached ? "" : " lane-chain--unreached"));
        chain.setAttribute("aria-hidden", "true"); /* decorative; lane aria-label carries the meaning */
        track.appendChild(chain);
        nextKey = LANE_ORDER[laneIdx + 1];
        if (nextKey) {
          /* the drop is a handoff INTO the next lane; dim it when either end
             of the handoff is not reached (esp. after a failed-here lane whose
             control never continued) so it never implies control flowed on. */
          nextReached = (function (s) { return s === "reached" || s === "failed-here"; })((lanesMeta[nextKey] || {}).status);
          drop = el("span", "lane-chain-drop" +
            (chainReached && nextReached ? "" : " lane-chain-drop--unreached"));
          drop.setAttribute("aria-hidden", "true");
          track.appendChild(drop);
        }
        section.appendChild(track);
        main.appendChild(section);
        return;
      }
      if (status === "not-reached" && laneEvents.length === 0) {
        empty = el("div", "lane-empty");
        empty.appendChild(el("p", "lane-empty-title", "Lane not reached"));
        empty.appendChild(el("p", "lane-empty-text",
          meta.reason || (trace
            ? "No events were recorded on this lane before the run ended."
            : "No trace is loaded.")));
        empty.appendChild(el("p", "lane-empty-note", "An empty lane is a finding, not a rendering error."));
        track.appendChild(empty);
      } else if (laneEvents.length === 0) {
        track.appendChild(el("p", "lane-note", trace
          ? "No events recorded on this lane."
          : "No trace is loaded."));
      }
      timedEvents.forEach(function (ev) {
        var isFailure = status === "failed-here" && ev.id === meta.failureEvent;
        /* compressed traces defer positioning to the post-append pass */
        list.appendChild(renderEvent(ev, compressed ? null : xs[ev.id],
          ev.id === selectedEventId, isFailure, compressed));
      });
      if (list.children.length) track.appendChild(list);

      /* a failure anchor is only an axis position if the failure event is
         timed; an untimed failure has no x and gets no line (#55) */
      if (status === "failed-here") {
        marker = renderStopMarker(compressionBands.length > 0
          ? (xs[meta.failureEvent] != null ? findEventById(meta.failureEvent).elapsedMs : null)
          : xs[meta.failureEvent]);
        if (marker) track.appendChild(marker);
      }
      section.appendChild(track);

      if (untimedEvents.length) {
        tray = el("div", "lane-untimed");
        trayLabel = el("span", "lane-untimed-label", "untimed — no measured time");
        trayLabel.setAttribute("title",
          "These events carry no elapsedMs in the trace. They are excluded from the time axis and listed without positional meaning.");
        tray.appendChild(trayLabel);
        untimedList = el("ul", "lane-untimed-events");
        untimedEvents.forEach(function (ev) {
          var isFailure = status === "failed-here" && ev.id === meta.failureEvent;
          untimedList.appendChild(renderEvent(ev, null, ev.id === selectedEventId, isFailure));
        });
        tray.appendChild(untimedList);
        section.appendChild(tray);
      }
      main.appendChild(section);
    });

    if (prePlay) {
      main.appendChild(renderStructureNote(trace));
    } else {
      main.appendChild(renderAxis(scale, step, events.length > 0));
      buildSweepPlan(trace, scale, xs); /* #60 — playhead route for this stream */
      main.appendChild(renderPlayheadLayer()); /* hidden until replay starts */
      main.appendChild(renderConnectorsLayer()); /* #54 — filled post-layout below */
    }
    hostEl.appendChild(main);
    // staggerLaneNodes() reads laid-out geometry from `#lanes .lane-events`, so
    // it must run only after `main` is attached to the DOM (#55 fix — running it
    // before append made it a no-op and regressed the #52 collision stagger).
    // Compressed traces (#53) first position deferred nodes/markers, rebuild
    // ticks/breaks/gridlines from the measured track width — same pass.
    if (!prePlay) {
      if (compressionBands.length > 0) {
        applyCompressionLayout(scale, step, events.length > 0);
        scheduleCompressionSettle(); /* re-apply once at the settled width */
      }
      staggerLaneNodes();
      renderConnectors(); /* #54 — same timing model: anchors read AFTER stagger */
    }
    hostEl.appendChild(renderOutcomeRail(trace));
  }

  /* ---------------- playhead (#60, spec §8) ------------------------------ */
  /* The playhead sweeps left→right over the SAME axis mapping the nodes use
     (setPlayhead(ms) routes through msToX — piecewise when #53 compression
     is active, linear otherwise). Nodes are laid out once and only change
     state classes (pending → active → done) as it passes — no re-render,
     no relayout, x and slot-top stay byte-identical (§8). The REAL elapsed
     counter always shows real ms; inside a compressed band the ms
     interpolates the band's real span while the line crosses 48px in a
     fixed 400ms of wall time (§8/§11.8) — spacing compresses, time does
     not. */
  /* evaluated lazily (at play time), so a mid-session OS setting change or
     test emulation is honored instead of a value frozen at load */
  function prefersReducedMotion() {
    return Boolean(window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  var timeScaleCache = null; /* set by buildSweepPlan per stream render */
  var sweepNodes = [];       /* crossable timed nodes, ms-sorted: {id, ms, seq} */
  var sweepEndMs = 0;
  var sweepIdx = 0;          /* next sweepNodes index to cross */
  var sweepRunRate = 0;      /* real axis-ms advanced per wall-ms outside bands */
  var sweepRafId = null;
  var lastFrameTs = 0;
  var playheadMsValue = null;   /* real ms at the playhead (null = hidden) */
  var playheadPctValue = null;  /* 0–100 for the test hook; derived per layout */

  function renderPlayheadLayer() {
    var layer = el("div", "playhead-layer");
    layer.setAttribute("aria-hidden", "true");
    var line = el("div", "playhead");
    line.setAttribute("id", "playheadLine");
    layer.appendChild(line);
    return layer;
  }

  /* Sweep route: timed nodes only (untimed events have no x and are never
     traversed). A failure trace ends the sweep at the failure event's ms —
     from lanes[*].status === "failed-here" — so the line never sweeps into
     post-failure territory. */
  function buildSweepPlan(trace, scale, xs) {
    var failLane = findFailureLane(trace);
    var failEvent = failLane ? findEventById(failLane.meta.failureEvent) : null;
    var endMs = (failEvent && typeof failEvent.elapsedMs === "number")
      ? failEvent.elapsedMs
      : scale.t0 + scale.realDomain;
    timeScaleCache = scale;
    sweepNodes = orderedEvents
      .filter(function (ev) {
        return typeof ev.elapsedMs === "number" && ev.elapsedMs <= endMs + 1e-4;
      })
      .map(function (ev) { return { id: ev.id, ms: ev.elapsedMs, seq: ev.sequence || 0 }; })
      .sort(function (a, b) { return (a.ms - b.ms) || (a.seq - b.seq); });
    sweepEndMs = sweepNodes.length ? sweepNodes[sweepNodes.length - 1].ms : endMs;
    sweepIdx = 0;
    sweepRunRate = 0;
    playheadMsValue = null;
    playheadPctValue = null;
    updateClockHidden();
  }

  function playheadLine() { return document.getElementById("playheadLine"); }

  /* position the line at REAL ms through the ACTIVE mapping: compressed
     traces serialize px against the piecewise map; pure-linear traces keep
     the exact toFixed(3)% strings of the pre-#53 viewer. The clock always
     shows the real ms — compression is display-only (§4.2). */
  function setPlayhead(ms) {
    var line = playheadLine();
    var x = 0;
    playheadMsValue = ms;
    if (compressionBands.length > 0 && axisMap) {
      x = msToX(ms);
      playheadPctValue = (x / axisMap.trackW) * 100;
      if (line) line.style.left = x.toFixed(1) + "px";
    } else if (timeScaleCache) {
      playheadPctValue = ((ms - timeScaleCache.t0) / timeScaleCache.domain) * 100;
      if (line) line.style.left = playheadPctValue.toFixed(3) + "%";
    }
    updatePlayheadClock();
    updateStackPanel(); /* #59 — stack follows the playhead (cheap: signature check) */
  }

  function updateClockHidden() {
    var clock = document.getElementById("playheadClock");
    if (clock) clock.hidden = Boolean(prePlay) || !timeScaleCache || sweepNodes.length === 0;
  }

  function updatePlayheadClock() {
    var clock = document.getElementById("playheadClock");
    if (!clock || !timeScaleCache || playheadMsValue == null) return;
    clock.textContent = "t +" + Math.round(playheadMsValue) + " ms";
  }

  function stopSweepFrames() {
    if (sweepRafId != null) {
      window.cancelAnimationFrame(sweepRafId);
      sweepRafId = null;
    }
    lastFrameTs = 0;
  }

  /* select the LAST node the playhead has passed this frame (one selection
     per frame even when several nodes cross together); nodes never sit
     inside a compressed band, so an ms comparison is exact everywhere */
  function crossNodesAt(ms) {
    var crossed = null;
    while (sweepIdx < sweepNodes.length && sweepNodes[sweepIdx].ms <= ms + 1e-4) {
      crossed = sweepNodes[sweepIdx];
      sweepIdx++;
    }
    if (crossed) selectEvent(crossed.id, { focus: false, fromSweep: true });
  }

  function finishSweep() {
    stopSweepFrames();
    /* fromSweep — never park/resync mid-drain, so each remaining node
       (including several sharing the final x) is selected exactly once */
    while (sweepIdx < sweepNodes.length) {
      selectEvent(sweepNodes[sweepIdx].id, { focus: false, fromSweep: true });
      sweepIdx++;
    }
    setPlaybackState("ended");
  }

  /* §8 + §11.8: real regions advance at the node-paced rate; a compressed
     band is traversed in a FIXED 400ms of wall time regardless of its real
     duration. Inside a band the playhead ms interpolates the band's REAL
     span — the clock keeps showing real elapsed, never compressed time. */
  function sweepRateAt(ms) {
    var i;
    for (i = 0; i < compressionBands.length; i++) {
      if (ms >= compressionBands[i].aMs - 1e-9 && ms <= compressionBands[i].bMs) {
        return (compressionBands[i].bMs - compressionBands[i].aMs) / BAND_WALL_MS;
      }
    }
    return sweepRunRate;
  }

  function sweepFrame(ts) {
    var dt = lastFrameTs ? Math.max(0, ts - lastFrameTs) : 0;
    var axisMs;
    lastFrameTs = ts;
    axisMs = playheadMsValue + dt * sweepRateAt(playheadMsValue);
    if (axisMs >= sweepEndMs) {
      setPlayhead(sweepEndMs);
      finishSweep();
      return;
    }
    setPlayhead(axisMs);
    crossNodesAt(axisMs);
    if (playbackState === "playing") {
      sweepRafId = window.requestAnimationFrame(sweepFrame);
    }
  }

  /* total sweep wall-time scales with the transport cadence: one
     playbackIntervalMs per crossable node, minus the fixed 400ms each
     compressed band already claims (runs keep the remainder, allocated
     proportionally to their real duration by the constant run rate) */
  function startSweep() {
    var scale = timeScaleCache;
    var bandWall = 0;
    var bandRealMs = 0;
    var i;
    if (!scale || !sweepNodes.length) {
      setPlaybackState("ended");
      return;
    }
    for (i = 0; i < compressionBands.length; i++) {
      bandWall += BAND_WALL_MS;
      bandRealMs += compressionBands[i].bMs - compressionBands[i].aMs;
    }
    sweepRunRate = (scale.realDomain - bandRealMs) /
      Math.max(1, sweepNodes.length * playbackIntervalMs - bandWall);
    stopSweepFrames();
    sweepRafId = window.requestAnimationFrame(sweepFrame);
  }

  /* prefers-reduced-motion (spec §8): no smooth sweep — the playhead jumps
     node-to-node and the counter jumps to each node's real elapsedMs */
  function stepTick() {
    var node = null;
    if (sweepIdx >= sweepNodes.length) {
      clearPlaybackTimer();
      setPlaybackState("ended");
      return;
    }
    node = sweepNodes[sweepIdx];
    sweepIdx++;
    setPlayhead(node.ms);
    selectEvent(node.id, { focus: false, fromSweep: true });
    if (sweepIdx >= sweepNodes.length) {
      clearPlaybackTimer();
      setPlaybackState("ended");
    }
  }

  /* manual transport (Next/Prev/click) parks the line on the selected node
     when a sweep is not animating; the sweep owns it otherwise */
  function movePlayheadToSelection() {
    var ev = findEventById(selectedEventId);
    if (!timeScaleCache || !ev || typeof ev.elapsedMs !== "number") return;
    if (sweepRafId != null) return;
    setPlayhead(ev.elapsedMs);
    syncSweepIdx();
  }

  function syncSweepIdx() {
    var i;
    sweepIdx = 0;
    for (i = 0; i < sweepNodes.length; i++) {
      if (sweepNodes[i].ms <= playheadMsValue + 1e-4) sweepIdx = i + 1;
    }
  }

  /* ---------------- connectors (#54, spec §4.5) -------------------------- */
  /* Connectors join consecutive TIMED events in sequence order, across the
     four swimlanes. Three treatments, all classified from data — never per
     trace: same-lane = thin line, NO arrowhead (sequential steps within one
     component aren't handoffs); observed cross-lane handoff = solid arrow;
     inferred transition = dashed arrow. python-worker → application is
     ALWAYS inferred: user-code entry is never logged. Untimed tray events
     are never connected. Geometry is read from the laid-out nodes after
     stagger (same timing model); nodes never move because of connectors. */
  var SVG_NS = "http://www.w3.org/2000/svg";

  function classifyConnector(fromEv, toEv) {
    if (fromEv.lane === toEv.lane) return "same-lane";
    /* forced: worker → application is inferred in EVERY trace (§11.4) */
    if (fromEv.lane === "python-worker" && toEv.lane === "application") return "inferred";
    if (fromEv.confidence === "observed" && toEv.confidence === "observed") return "observed";
    return "inferred";
  }

  function renderConnectorsLayer() {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("id", "connectors");
    svg.setAttribute("class", "connectors");
    svg.setAttribute("aria-hidden", "true");
    return svg;
  }

  function buildConnectorMarker(id) {
    var marker = document.createElementNS(SVG_NS, "marker");
    var path = document.createElementNS(SVG_NS, "path");
    marker.setAttribute("id", id);
    marker.setAttribute("markerWidth", "7");
    marker.setAttribute("markerHeight", "7");
    marker.setAttribute("refX", "5.5");
    marker.setAttribute("refY", "3");
    marker.setAttribute("orient", "auto");
    marker.setAttribute("markerUnits", "userSpaceOnUse");
    path.setAttribute("d", "M0,0 L6,3 L0,6 Z");
    path.setAttribute("class", "connector-arrow");
    marker.appendChild(path);
    return marker;
  }

  /* anchor = the dot's true x, accounting for the data-side translate the
     same way staggerLaneNodes does; y = node center. Both in .lanes-main
     coordinates so the SVG overlay (inset 0 over .lanes-main) lines up. */
  function connectorAnchor(node, mainRect) {
    var r = node.getBoundingClientRect();
    var x = (node.getAttribute("data-side") === "left" ? r.left + r.width : r.left) -
      mainRect.left;
    var y = r.top + r.height / 2 - mainRect.top;
    return { x: x, y: y };
  }

  function buildConnectorLine(fromEv, toEv, mainRect) {
    var fromNode = document.querySelector('.event[data-event-id="' + fromEv.id + '"]');
    var toNode = document.querySelector('.event[data-event-id="' + toEv.id + '"]');
    var kind = null;
    var a = null;
    var b = null;
    var line = null;
    if (!fromNode || !toNode) return null;
    kind = classifyConnector(fromEv, toEv);
    a = connectorAnchor(fromNode, mainRect);
    b = connectorAnchor(toNode, mainRect);
    line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("x1", a.x.toFixed(1));
    line.setAttribute("y1", a.y.toFixed(1));
    line.setAttribute("x2", b.x.toFixed(1));
    line.setAttribute("y2", b.y.toFixed(1));
    line.setAttribute("class", "connector connector--" + kind);
    line.setAttribute("data-connector", kind);
    line.setAttribute("data-from", fromEv.id);
    line.setAttribute("data-to", toEv.id);
    if (kind !== "same-lane") {
      line.setAttribute("marker-end", "url(#fvConnectorArrow" +
        (kind === "observed" ? "Observed" : "Inferred") + ")");
    }
    return line;
  }

  function renderConnectors() {
    var mainEl = document.querySelector("#lanes .lanes-main");
    var svg = document.getElementById("connectors");
    var defs = null;
    var mainRect = null;
    var chain = null;
    var line = null;
    var i;
    if (!mainEl || !svg) return; /* stream view only — no overlay, no connectors */
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    defs = document.createElementNS(SVG_NS, "defs");
    defs.appendChild(buildConnectorMarker("fvConnectorArrowObserved"));
    defs.appendChild(buildConnectorMarker("fvConnectorArrowInferred"));
    svg.appendChild(defs);
    mainRect = mainEl.getBoundingClientRect();
    chain = orderedEvents.filter(function (ev) {
      return typeof ev.elapsedMs === "number"; /* untimed events never connect */
    });
    for (i = 1; i < chain.length; i++) {
      line = buildConnectorLine(chain[i - 1], chain[i], mainRect);
      if (line) svg.appendChild(line);
    }
  }

  /* #55 (spec §3.3) — the outcome rail: a dedicated column at the right
     edge of band B stating the run outcome for the whole timeline. For a
     failure it names the STOPPING LANE from lanes[*].status === "failed-here"
     (never hardcoded) and the failure time from that lane's failureEvent.
     In pre-play it shows a neutral pending state — band A carries the
     recorded outcome, band B states it once the run is on the axis. */
  function renderOutcomeRail(trace) {
    var rail = el("aside", "outcome-rail");
    var outcome = (trace && trace.outcome) || "none";
    var failLane = null;
    var failEvent = null;
    rail.setAttribute("aria-label", "Run outcome");
    rail.appendChild(el("span", "outcome-rail-title", "outcome"));

    if (prePlay) {
      rail.setAttribute("data-state", "pending");
      rail.appendChild(el("span", "outcome-rail-value outcome-rail-value--pending", "not replayed yet"));
      rail.appendChild(el("span", "outcome-rail-note",
        "Pre-play — the recorded outcome is in the header and is stated here on replay."));
      return rail;
    }
    if (outcome === "failure") {
      rail.setAttribute("data-state", "failed");
      rail.appendChild(el("span", "outcome-rail-value outcome-rail-value--failed", "⨯ failed"));
      failLane = findFailureLane(trace);
      if (failLane) {
        rail.appendChild(el("span", "outcome-rail-lane",
          "in " + (LANE_LABELS[failLane.lane] || failLane.lane)));
        failEvent = findEventById(failLane.meta.failureEvent);
        if (failEvent && typeof failEvent.elapsedMs === "number") {
          rail.appendChild(el("span", "outcome-rail-at", "at +" + failEvent.elapsedMs + " ms"));
        }
        rail.appendChild(el("span", "outcome-rail-note",
          "Control did not continue past the failure."));
      } else {
        rail.appendChild(el("span", "outcome-rail-note",
          "No lane is marked failed-here in this trace's lane metadata."));
      }
      return rail;
    }
    if (outcome === "success") {
      rail.setAttribute("data-state", "success");
      rail.appendChild(el("span", "outcome-rail-value outcome-rail-value--success", "✓ success"));
      return rail;
    }
    rail.setAttribute("data-state", "empty");
    rail.appendChild(el("span", "outcome-rail-value outcome-rail-value--pending", "—"));
    rail.appendChild(el("span", "outcome-rail-note", "No trace loaded."));
    return rail;
  }

  /* #70 (spec §10) — pre-play caption strip that stands in for the axis
     row. Names the chain as fixed structure, distinguishes the dimmed
     unreached lanes, and invites Play. Explicit empty state when no trace. */
  function renderStructureNote(trace) {
    var note = el("div", "structure-note");
    var gutter = el("div", "structure-note-gutter");
    gutter.appendChild(el("span", "structure-note-caption", "structure"));
    gutter.appendChild(el("span", "structure-note-sub", "pre-play · no timing"));
    note.appendChild(gutter);
    note.appendChild(el("p", "structure-note-text", trace
      ? "Structure — fixed component decomposition, not observed timing. Faint lanes were not reached, or their activity is unknown, in this run. Press Play to replay the run."
      : "No trace loaded. The four components above are the fixed structure of every trace."));
    return note;
  }

  /* #55 (spec §3.3) — the failure marker keeps ONLY its positional geometry:
     a dashed vertical line at the failure event's x on the shared axis. The
     outcome STATEMENT (the words) lives in the header chip and the outcome
     rail, never inside a lane as if it were an event. An untimed failure has
     no x, so it gets no line — nothing is invented to anchor one. #53: on a
     compressed trace the caller passes the failure's real ms and positioning
     is deferred to the post-append pass. */
  function renderStopMarker(posValue) {
    if (posValue == null) return null;
    var marker = el("div", "lane-stop-marker");
    if (compressionBands.length > 0) {
      marker.setAttribute("data-ms", String(posValue));
    } else {
      marker.style.left = posValue.toFixed(3) + "%";
    }
    return marker;
  }

  /* shared axis row — ticks at even time steps plus the real end time (§4.1).
     Tick xs and the lane gridlines derive from the same step, so the
     repeating backgrounds and the labels can never disagree. A trace whose
     events all share one timestamp (realDomain 0) gets ONLY a "+0" tick —
     no synthetic intermediate ticks are invented from the guard domain.
     #53: a compressed trace leaves the track EMPTY here — px ticks and
     axis-break markers are drawn by applyCompressionLayout once the track
     width is measurable, and ticks never land inside a break band. */
  function renderAxis(scale, step, hasEvents) {
    var axis = el("div", "axis");
    var gutter = el("div", "axis-gutter");
    gutter.appendChild(el("span", "axis-caption", "elapsed (ms)"));
    gutter.appendChild(el("span", "axis-caption-sub", "t0 = first event · shared axis"));
    axis.appendChild(gutter);

    var track = el("div", "axis-track");
    var tick = null;
    var k;
    var pct;
    if (compressionBands.length > 0) {
      /* deferred — see applyCompressionLayout / renderAxisContent */
    } else if (hasEvents && scale.realDomain === 0) {
      tick = el("div", "axis-tick");
      tick.style.left = "0%";
      tick.appendChild(el("span", "axis-tick-label", "+0"));
      track.appendChild(tick);
      track.appendChild(el("span", "axis-end", "end +0 ms"));
    } else if (hasEvents) {
      for (k = 0; k * step <= scale.domain; k++) {
        pct = (k * step / scale.domain) * 100;
        if (pct > 100.0001) break;
        tick = el("div", "axis-tick");
        tick.style.left = pct.toFixed(3) + "%";
        tick.appendChild(el("span", "axis-tick-label", "+" + (k * step)));
        track.appendChild(tick);
      }
      track.appendChild(el("span", "axis-end", "end +" + scale.realDomain + " ms"));
    }
    axis.appendChild(track);
    return axis;
  }

  /* Near-simultaneous events stack into vertical slots instead of moving on
     the time axis — x is timing truth, y is readability only. */
  var NODE_SLOT_TOPS = ["50%", "20%", "80%"];

  function staggerLaneNodes() {
    var lists = document.querySelectorAll("#lanes .lane-events");
    var l;
    var i;
    var s;
    var p;
    var nodes;
    var placed;
    var node;
    var anchor;
    var width;
    var left;
    var right;
    var hit;
    for (l = 0; l < lists.length; l++) {
      nodes = lists[l].children;
      placed = []; /* { slot, left, right } */
      for (i = 0; i < nodes.length; i++) {
        node = nodes[i];
        for (s = 0; s < NODE_SLOT_TOPS.length; s++) {
          node.style.top = NODE_SLOT_TOPS[s];
          /* offsetLeft ignores the side=left translate(-100%), so derive the
             visual box from the anchor + width per side before comparing */
          anchor = node.offsetLeft;
          width = node.offsetWidth;
          left = node.getAttribute("data-side") === "left" ? anchor - width : anchor;
          right = left + width;
          hit = false;
          for (p = 0; p < placed.length; p++) {
            if (placed[p].slot === s && left < placed[p].right + 8 && right > placed[p].left - 8) {
              hit = true;
              break;
            }
          }
          if (!hit) {
            placed.push({ slot: s, left: left, right: right });
            break;
          }
        }
      }
    }
  }

  /* ---------------- event node with stable #6/#7 seams ------------------- */
  /* Swimlane node (#52): the dot sits exactly at the event's elapsed-time x;
     the label chip attaches left or right of the dot so the axis stays honest
     at both edges. Confidence cues mirror the card treatment they replace —
     observed = solid, inferred = dashed + hatch. xPct == null means the event
     carries no numeric elapsedMs: it renders without a dot or axis position,
     in the lane's untimed tray, tagged "untimed" — never a fabricated x. */
  function renderEvent(ev, xPct, isActive, isFailure, deferPosition) {
    var conf = ev.confidence === "inferred" ? "inferred" : "observed";
    var timedNode = xPct != null || deferPosition === true;
    var item = el("li", "event confidence-" + conf +
      (isActive ? " is-active" : "") + (isFailure ? " is-failure" : ""));
    item.setAttribute("data-event-id", ev.id || "");
    item.setAttribute("data-lane", ev.lane || "");
    item.setAttribute("data-observation", conf);
    item.setAttribute("data-step-index", ev.sequence != null ? String(ev.sequence) : "");
    if (ev.timestamp) item.setAttribute("data-timestamp", ev.timestamp);
    if (ev.raw != null) item.setAttribute("data-raw", ev.raw); /* raw-log seam (#6) */
    item.setAttribute("tabindex", "0");
    item.setAttribute("aria-selected", isActive ? "true" : "false");
    item.setAttribute("aria-controls", "stepDetail");
    item.setAttribute("aria-label",
      (ev.event || "event") + " — " + (LANE_LABELS[ev.lane] || ev.lane || "?") +
      " lane — " + conf + (timedNode
        ? " — +" + (ev.elapsedMs != null ? ev.elapsedMs : "?") + " ms"
        : " — untimed (no measured time)"));

    if (xPct != null) {
      item.setAttribute("data-side", xPct > 72 ? "left" : "right");
      item.style.left = xPct.toFixed(3) + "%";
    } else if (timedNode) {
      /* #53 — timed but deferred: the compressed pass positions it from the
         measured track width after append (data-ms carries its real time) */
      item.setAttribute("data-ms", String(ev.elapsedMs != null ? ev.elapsedMs : ""));
    }
    if (timedNode) {
      item.appendChild(el("span", "event-dot"));
    }

    var chip = el("span", "event-chip");
    var name = el("span", "event-name", ev.event || "Unnamed event");
    chip.appendChild(el("span", "event-seq", String((ev.sequence != null ? ev.sequence : 0) + 1)));
    if (ev.event && ev.event.length > 24) name.setAttribute("title", ev.event); /* chip ellipsizes */
    chip.appendChild(name);
    if (timedNode) {
      chip.appendChild(el("span", "event-elapsed", "+" + (ev.elapsedMs != null ? ev.elapsedMs : "?") + " ms"));
    } else {
      chip.appendChild(el("span", "event-untimed-tag", "untimed"));
    }
    chip.appendChild(el("span", "confidence-badge", conf.toUpperCase()));
    item.appendChild(chip);
    return item;
  }

  /* ---------------- step detail — selected step + raw log (FR-8) -------- */
  var DETAIL_ID_KEYS = [
    ["invocationId", "Invocation ID"],
    ["workerRequestId", "Worker Request ID"],
    ["httpRequestId", "HTTP Request ID"]
  ];

  function renderStepDetail(ev) {
    var panel = document.getElementById("stepDetail");
    var emptyTitle = null;
    var conf = null;
    var title = null;
    var dl = null;
    var pre = null;
    var i;
    function row(label, value, cls) {
      dl.appendChild(el("dt", null, label));
      dl.appendChild(el("dd", cls || null, value));
    }
    panel.textContent = "";
    if (!ev) {
      panel.className = "step-detail";
      emptyTitle = el("h2", "step-detail-title", "Step detail");
      emptyTitle.setAttribute("id", "stepDetailTitle");
      panel.appendChild(emptyTitle);
      panel.appendChild(el("p", "step-detail-empty", prePlay
      ? "Pre-play structure view — the run has not been replayed yet. Press Play or select a step to inspect it."
      : "Select a step to inspect its source log line."));
      return;
    }
    conf = ev.confidence === "inferred" ? "inferred" : "observed";
    panel.className = "step-detail confidence-" + conf;

    title = el("h2", "step-detail-title");
    title.setAttribute("id", "stepDetailTitle");
    title.appendChild(el("span", "step-detail-name", ev.event || "Unnamed event"));
    title.appendChild(el("span", "confidence-badge", conf.toUpperCase()));
    panel.appendChild(title);

    dl = el("dl", "detail-grid");
    row("Lane", LANE_LABELS[ev.lane] || ev.lane || "?");
    row("Timestamp", ev.timestamp || "—");
    row("Elapsed", typeof ev.elapsedMs === "number" ? "+" + ev.elapsedMs + " ms" : "untimed — no measured elapsedMs");
    row("Confidence", "confidence: " + conf);
    for (i = 0; i < DETAIL_ID_KEYS.length; i++) {
      if (ev[DETAIL_ID_KEYS[i][0]]) {
        row(DETAIL_ID_KEYS[i][1], String(ev[DETAIL_ID_KEYS[i][0]]), "detail-id");
        break;
      }
    }
    panel.appendChild(dl);

    panel.appendChild(el("p", "raw-log-label", "Raw log"));
    pre = el("pre", "raw-log");
    pre.textContent = ev.raw != null ? String(ev.raw) : "No raw log captured for this event.";
    panel.appendChild(pre);
  }

  /* ---------------- error summary (#62, spec §7 band E) ------------------- */
  /* Per-trace, never per-playhead: rendered once per renderTrace. The
     message is only ever QUOTED from the data, in source order:
     1. failures[0].message when present (worker-fail carries it);
     2. else the failure event's raw log line (invocation-fail), tagged
        "log line" so the quote is never mistaken for a parsed message;
     3. else an honest absence line — nothing is reworded or invented.
     Failing component: the lanes[*].status === "failed-here" lane via
     findFailureLane() (same data-driven derivation as #55/#59), falling
     back to the failure event's own lane. Every no-failure state —
     success, unknown-outcome, no trace — renders the EXPLICIT reserved
     empty row: the viewport keeps its two reserved rows so the §11.11
     frame-match holds (no layout jump between success and failure). */
  var ERROR_MESSAGE_SEAM_MAX = 300; /* data-seam cap; the row itself ellipsizes */

  function renderErrorSummary(trace) {
    var panel = document.getElementById("errorSummary");
    var failures = (trace && Array.isArray(trace.failures)) ? trace.failures : [];
    var failure = failures.length ? failures[0] : null;
    var failLane = null;
    var failEvent = null;
    var laneKey = null;
    var message = null;
    var messageFromLog = false;
    var seamMessage = "";
    var title = null;
    var viewport = null;
    var msgRow = null;
    var msgText = null;
    var metaRow = null;
    var kindChip = null;

    panel.textContent = "";
    title = el("h2", "error-title", "Error");
    title.setAttribute("id", "errorSummaryTitle");
    panel.appendChild(title);
    viewport = el("div", "error-viewport");

    if (!failure) {
      /* outcome=failure with no structured failure record must not read as
         a clean run — the absence of the record is itself the finding */
      if (trace && trace.outcome === "failure") {
        panel.setAttribute("data-has-error", "true");
        panel.setAttribute("data-failure-kind", "unrecorded");
        panel.setAttribute("data-failure-lane", "");
        panel.setAttribute("data-error-message", "");
        viewport.appendChild(el("p", "error-empty-row",
          "Run failed — no structured failure record was captured in this trace."));
        panel.appendChild(viewport);
        return;
      }
      panel.setAttribute("data-has-error", "false");
      panel.setAttribute("data-failure-kind", "");
      panel.setAttribute("data-failure-lane", "");
      panel.setAttribute("data-error-message", "");
      viewport.appendChild(el("p", "error-empty-row", trace
        ? "No errors — the run completed."
        : "No trace loaded."));
      panel.appendChild(viewport);
      return;
    }

    failEvent = failure.event != null ? findEventById(failure.event) : null;
    if (typeof failure.message === "string" && failure.message) {
      message = failure.message;
    } else if (failEvent && typeof failEvent.raw === "string" && failEvent.raw) {
      message = failEvent.raw;
      messageFromLog = true;
    }
    seamMessage = message == null ? "" :
      (message.length > ERROR_MESSAGE_SEAM_MAX
        ? message.slice(0, ERROR_MESSAGE_SEAM_MAX) + "\u2026"
        : message);

    failLane = findFailureLane(trace);
    laneKey = failLane ? failLane.lane : (failEvent ? failEvent.lane : null);

    panel.setAttribute("data-has-error", "true");
    panel.setAttribute("data-failure-kind", failure.kind || "");
    panel.setAttribute("data-failure-lane", laneKey || "");
    panel.setAttribute("data-error-message", seamMessage);

    msgRow = el("div", "error-msg-row");
    if (message != null) msgRow.setAttribute("title", message); /* full text */
    if (messageFromLog) {
      msgRow.appendChild(el("span", "error-msg-src", "log line"));
    }
    msgText = message != null
      ? el("span", "error-msg-text", message)
      : el("span", "error-msg-text error-msg-text--absent",
        "No message or raw log recorded for this failure.");
    msgRow.appendChild(msgText);
    viewport.appendChild(msgRow);

    metaRow = el("div", "error-meta-row");
    if (laneKey) metaRow.setAttribute("data-lane", laneKey);
    if (laneKey) {
      metaRow.appendChild(el("span", "error-lane-dot"));
      metaRow.appendChild(el("span", "error-component",
        "in " + (LANE_LABELS[laneKey] || laneKey)));
    } else {
      metaRow.appendChild(el("span", "error-component error-component--unknown",
        "failing component unknown"));
    }
    if (failure.kind) {
      kindChip = el("span", "error-kind", failure.kind);
      metaRow.appendChild(kindChip);
    }
    viewport.appendChild(metaRow);
    panel.appendChild(viewport);
  }

  /* ---------------- call stack at the playhead (#59, spec §6.2) --------- */
  /* Frames reflect which components are ACTIVE at the playhead, innermost
     first: #0 application → #1 python-worker → #2 host → #3 client, showing
     ONLY active lanes. Derivation is data-only (no schema change):
     - entered: the lane has a TIMED event already crossed by the playhead
       (sweepNodes already encode the failure cutoff — events past the
       failed-here lane's failure event never enter the sweep, so nothing
       past the failure point ever activates a lane; untimed events are
       never traversed, same honesty rule as the axis);
     - eligible: lanes[*].status is "reached" or "failed-here" — a
       "not-reached"/"unknown" lane is never active even if stray events
       exist on it.
     An absent application frame in a pre-invocation failure is the finding
     itself: the stack is never padded, and the diagnostic note row states
     the absence once the failure has been reached. */
  var STACK_FRAME_ORDER = ["application", "python-worker", "host", "client"];
  var STACK_NOTE_GENERIC = "innermost first \u00b7 lanes entered at or before the playhead";
  var STACK_NOTE_NO_APP = "no application frame \u2014 no timed application activity was reached before failure";
  var stackSignature = null; /* last rendered state; "" + join key avoids per-frame rebuilds */

  function stackActiveLanes() {
    var lanesMeta = (currentTrace && currentTrace.lanes) || {};
    var entered = {};
    var active = [];
    var i;
    var ev;
    var lane;
    var meta;
    if (playheadMsValue == null) return active;
    for (i = 0; i < sweepNodes.length; i++) { /* ms-sorted: stop at the playhead */
      if (sweepNodes[i].ms > playheadMsValue + 1e-4) break;
      ev = findEventById(sweepNodes[i].id);
      if (ev && ev.lane && entered[ev.lane] == null) entered[ev.lane] = sweepNodes[i].ms;
    }
    for (i = 0; i < STACK_FRAME_ORDER.length; i++) {
      lane = STACK_FRAME_ORDER[i];
      if (entered[lane] == null) continue;
      meta = lanesMeta[lane] || {};
      if (meta.status === "reached" || meta.status === "failed-here") active.push(lane);
    }
    return active;
  }

  function buildStackFrame(idx, lane) {
    var item = el("li", "stack-frame");
    item.setAttribute("data-frame-index", String(idx));
    item.setAttribute("data-frame-lane", lane);
    item.appendChild(el("span", "frame-num", "#" + idx));
    item.appendChild(el("span", "frame-swatch"));
    item.appendChild(el("span", "frame-name", lane));
    item.appendChild(el("span", "frame-role", LANE_ROLE_SUBTITLES[lane] || ""));
    return item;
  }

  /* §6.2 diagnostic gate: the failure event has been crossed by the
     playhead (data: failed-here lane's failureEvent ms; untimed failures
     never qualify — no time, no crossing) */
  function stackFailureCrossed() {
    var failLane = findFailureLane(currentTrace);
    var failEvent = failLane ? findEventById(failLane.meta.failureEvent) : null;
    return failEvent != null && typeof failEvent.elapsedMs === "number" &&
      playheadMsValue != null && failEvent.elapsedMs <= playheadMsValue + 1e-4;
  }

  function renderStackPanel(panel, hasTrace, active) {
    var list = null;
    var placeholder = null;
    var note = null;
    var noteText = "";
    var clock = null;
    var title = null;
    var viewport = null;
    var i;

    panel.textContent = "";
    panel.setAttribute("data-stack-lanes", active.join(","));

    title = el("h2", "stack-title", "Call stack");
    title.setAttribute("id", "stackPanelTitle");
    clock = el("span", "stack-clock", "");
    clock.setAttribute("id", "stackClock");
    title.appendChild(clock);
    panel.appendChild(title);

    if (!hasTrace) {
      panel.setAttribute("data-state", "no-trace");
      clock.hidden = true;
      placeholder = el("p", "stack-placeholder", "No trace loaded.");
    } else if (prePlay || playheadMsValue == null) {
      /* neutral pre-play state — no fabricated stack before motion (#70) */
      panel.setAttribute("data-state", prePlay ? "pre-play" : "empty");
      clock.hidden = true;
      placeholder = el("p", "stack-placeholder", prePlay
        ? "Stack appears during replay \u2014 press Play or step to a position."
        : "no frames \u2014 run not started");
    } else if (!active.length) {
      /* replay started, but no eligible lane has crossed an event yet */
      panel.setAttribute("data-state", "empty");
      placeholder = el("p", "stack-placeholder", "no frames \u2014 run not started");
    } else {
      panel.setAttribute("data-state", "frames");
      list = el("ol", "stack-frames");
      for (i = 0; i < active.length; i++) list.appendChild(buildStackFrame(i, active[i]));
      /* §6.2 diagnostic: failure reached, application never entered — the
         absence is the finding; state it factually, never pad the stack */
      if (stackFailureCrossed() && active.indexOf("application") === -1) {
        noteText = STACK_NOTE_NO_APP;
      } else {
        noteText = STACK_NOTE_GENERIC;
      }
    }

    /* viewport keeps the reserved 4-frame height in every state; frames
       render INSIDE it so the panel height never depends on the count */
    viewport = el("div", "stack-viewport");
    if (list) viewport.appendChild(list);
    if (placeholder) viewport.appendChild(placeholder);
    panel.appendChild(viewport);
    note = el("p", "stack-note" +
      (noteText === STACK_NOTE_NO_APP ? " stack-note--diagnostic" : ""), noteText);
    note.setAttribute("role", "note");
    panel.appendChild(note);
  }

  /* cheap per-playhead-frame call: re-renders only when the state or the
     active set changes; otherwise just refreshes the live ms readout */
  function updateStackPanel() {
    var panel = document.getElementById("stackPanel");
    var hasTrace = null;
    var active = null;
    var signature = null;
    var clock = null;
    if (!panel) return;
    hasTrace = Boolean(currentTrace);
    active = (!hasTrace || prePlay || playheadMsValue == null) ? [] : stackActiveLanes();
    /* "n" (no playhead) vs "s" (swept) keeps the null→set transition a
       rebuild even when the active set is still empty; "d" re-renders when
       the failure-crossing flips the §6.2 diagnostic note at a constant
       active set (e.g. mid-band → failure event) */
    signature = (hasTrace ? "t" : "n") +
      (prePlay ? "p" : playheadMsValue == null ? "n" : "s") +
      (hasTrace && !prePlay && stackFailureCrossed() ? "d" : "") + active.join(",");
    if (signature !== stackSignature) {
      stackSignature = signature;
      renderStackPanel(panel, hasTrace, active);
    }
    clock = document.getElementById("stackClock");
    if (clock && !clock.hidden && playheadMsValue != null) {
      clock.textContent = "t +" + Math.round(playheadMsValue) + " ms";
    }
  }

  /* ---------------- application source panel (FR-6) ---------------------- */
  /* #58 (spec §5.3, §9 option b) — label wording for inferred source
     highlights, rendered verbatim and asserted verbatim (§11.9): every
     highlighted line carries its inferred-confidence label row. */
  var SOURCE_CONF_DEFINITION_TEXT = "inferred \u2014 matched by function name, not a runtime line";
  var SOURCE_CONF_FAILURE_TEXT = "inferred \u2014 matched from the error message, not a log line";

  /* label row with a stable seam (data-source-confidence) + exact text; the
     lead word "inferred" is amber (the viewer-wide inferred accent) via a
     split span so textContent stays the exact issue wording */
  function buildSourceConfidenceRow(seam, text) {
    var row = el("p", "source-confidence-row");
    row.setAttribute("data-source-confidence", seam);
    row.setAttribute("role", "note");
    row.appendChild(el("span", "sc-word", "inferred"));
    row.appendChild(tx(text.slice("inferred".length)));
    return row;
  }

  function renderSource(trace) {
    var panel = document.getElementById("sourcePanel");
    panel.textContent = "";
    var app = (trace && trace.application) || {};
    var laneMeta = ((trace && trace.lanes) || {}).application || {};
    var status = laneMeta.status || (app.sourceText ? "reached" : "not-reached");

    var head = el("header", "source-head");
    head.appendChild(el("span", "source-dot", ""));
    head.appendChild(el("h2", "source-file", trace ? (app.sourceFile || "source file") : "no trace"));
    var st = el("span", "lane-status", STATUS_LABELS[status] || status);
    st.setAttribute("data-status", status);
    head.appendChild(st);
    panel.appendChild(head);
    if (laneMeta.reason) panel.appendChild(el("p", "lane-reason source-reason", laneMeta.reason));

    var body = el("div", "source-body");
    var range = null;
    var lines = [];
    var code = null;
    var ph = null;
    var focusLine = 1;
    var focusSource = "top";
    var win = null;
    var windowEl = null;
    var footer = null;
    var failureInfo = null;
    var failureLine = null;
    var definitionConfidence = null;
    var i = 0;
    var n = 0;
    var isDef = false;
    var isError = false;
    var prefix = "";
    var li = null;
    if (!trace) {
      sourceWindowState = null;
      body.appendChild(el("p", "source-placeholder", "No trace loaded. Open a trace file or paste trace JSON above."));
    } else if (app.sourceText) {
      range = normalizeRange(app.definitionLineRange);
      lines = String(app.sourceText).replace(/\n$/, "").split("\n");
      /* #58 — failure-anchored line: failures[0].sourceLine is schema-backed
         (matched from a traceback File-line in the failure event's raw text)
         and always paired with sourceConfidence "inferred"; only that
         producer exists, so both fields gate the anchor. A sourceLine beyond
         the embedded file's line count is not renderable — an out-of-file
         anchor must not create a focus origin or label without a highlight. */
      failureInfo = (Array.isArray(trace.failures) && trace.failures.length)
        ? trace.failures[0] : null;
      failureLine = (failureInfo && typeof failureInfo.sourceLine === "number" &&
        failureInfo.sourceLine >= 1 && failureInfo.sourceLine <= lines.length &&
        failureInfo.sourceConfidence === "inferred")
        ? failureInfo.sourceLine : null;
      /* #58 — the only producer of the definition range is the AST
         function-name match, an inferred anchor; traces now carry
         application.highlightConfidence "inferred". LEGACY TRACES PREDATE
         THE FIELD — a missing value still renders the same inferred label,
         so the §11.9 invariant (highlight ⇒ label) holds for old inputs. */
      definitionConfidence = range &&
        (app.highlightConfidence === "inferred" || app.highlightConfidence == null)
        ? "inferred" : null;
      /* schema-backed focus anchor (#57/#58): failure line first, then the
         definition range start, else line 1 — never a fabricated runtime
         line (that data does not exist) */
      if (failureLine != null) {
        focusLine = failureLine;
        focusSource = "failure-line";
      } else if (range) {
        focusLine = range[0];
        focusSource = "definition";
      }
      win = sourceWindow(lines.length, focusLine);
      sourceWindowState = {
        start: win.start, end: win.end, focus: focusLine, focusSource: focusSource,
        total: lines.length, above: win.above, below: win.below,
        definitionConfidence: definitionConfidence,
        failureLine: failureLine,
        failureConfidence: failureLine != null ? "inferred" : null
      };
      windowEl = el("div", "source-window");
      windowEl.setAttribute("data-source-window-start", String(win.start));
      windowEl.setAttribute("data-source-window-end", String(win.end));
      windowEl.setAttribute("data-source-focus-line", String(focusLine));
      windowEl.setAttribute("data-source-focus-origin", focusSource);
      if (win.above > 0) windowEl.appendChild(buildSourceCollapse("above", win.above));
      code = el("ol", "source-code");
      for (i = win.start - 1; i < win.end; i++) {
        n = i + 1;
        isDef = !!range && n >= range[0] && n <= range[1];
        isError = failureLine != null && n === failureLine;
        li = el("li", "source-line" + (isDef ? " def-line" : "") + (isError ? " error-line" : ""));
        li.setAttribute("data-line", String(n));
        if (isError) li.setAttribute("data-source-error-line", String(n));
        if (isError) li.setAttribute("aria-label", "Failure-matched line " + n + " (inferred)");
        else if (isDef) li.setAttribute("aria-label", "Function definition line " + n);
        prefix = isError ? "\u2717 " : isDef ? "\u25b8 " : "  ";
        li.appendChild(el("span", "line-num", prefix + n));
        li.appendChild(el("code", "line-content", lines[i]));
        code.appendChild(li);
      }
      windowEl.appendChild(code);
      if (win.below > 0) windowEl.appendChild(buildSourceCollapse("below", win.below));
      body.appendChild(windowEl);
      /* #58 (§11.9) — every rendered highlight carries its confidence label:
         the fixed three-row footer reserves space for the range note AND
         both labels, so the panel height never depends on which rows are
         present (#57 fixed-height discipline). */
      if (range || definitionConfidence || failureLine != null) {
        footer = el("div", "source-footer");
        if (range) {
          footer.appendChild(el("p", "source-range-note",
            "Function definition block — lines " + range[0] + "–" + range[1] + "."));
        }
        if (definitionConfidence) {
          footer.appendChild(buildSourceConfidenceRow("definition", SOURCE_CONF_DEFINITION_TEXT));
        }
        if (failureLine != null) {
          footer.appendChild(buildSourceConfidenceRow("failure", SOURCE_CONF_FAILURE_TEXT));
        }
        body.appendChild(footer);
      }
    } else {
      sourceWindowState = null;
      ph = el("div", "source-placeholder");
      if (status === "unknown") {
        ph.appendChild(tx("Application execution was not observed, so the source of "));
        ph.appendChild(el("code", null, app.sourceFile || "the source file"));
        ph.appendChild(tx(" is not embedded — showing it here would imply this code ran. " +
          "Re-run with elevated worker logging (see host.json) to observe the worker/application lanes."));
      } else {
        ph.appendChild(tx("Source text was not embedded in this trace. "));
        ph.appendChild(el("code", null, app.sourceFile || "the source file"));
        ph.appendChild(tx(" was recorded as the source file, but local file loading is unavailable from file://."));
      }
      body.appendChild(ph);
    }
    panel.appendChild(body);
  }

  /* ---------------- selection API (#6 UI, #7 playback entrypoints) ------ */
  function findEventById(id) {
    var i;
    if (id == null) return null;
    for (i = 0; i < orderedEvents.length; i++) {
      if (orderedEvents[i].id === id) return orderedEvents[i];
    }
    return null;
  }

  /* #60 (spec §8) — node states are class toggles ONLY: is-active for the
     playhead's node, is-done for timed nodes the playhead has passed (by
     sequence order relative to the selection). Untimed tray nodes are never
     traversed and stay neutral. Nothing here re-renders or relayouts. */
  function updateActiveCards() {
    var cards = document.querySelectorAll('#lanes .event');
    var selIdx = indexOfEvent(selectedEventId);
    var i;
    var isActive = false;
    var isDone = false;
    for (i = 0; i < cards.length; i++) {
      isActive = cards[i].getAttribute("data-event-id") === selectedEventId;
      isDone = !isActive && selIdx !== -1 && cards[i].style.left !== "" &&
        indexOfEvent(cards[i].getAttribute("data-event-id")) < selIdx;
      cards[i].classList.toggle("is-active", isActive);
      cards[i].classList.toggle("is-done", isDone);
      cards[i].setAttribute("aria-selected", isActive ? "true" : "false");
    }
  }

  function selectEvent(id, opts) {
    var ev = findEventById(id);
    var node = null;
    if (!ev) return false;
    if (prePlay) {
      /* #70 — the first selection leaves the structure view; band B swaps
         to the real event stream (a content swap, never a node relayout) */
      prePlay = false;
      renderLanes(currentTrace);
    }
    selectedEventId = id;
    updateActiveCards();
    renderStepDetail(ev);
    updateReplayControls(); /* transport follows every selection change (#7) */
    /* #60 — manual selection parks the playhead; sweep/step selections must
       NOT (fromSweep) — parking calls syncSweepIdx(), which would skip past
       every node sharing the current x and break node-by-node stepping */
    if (!opts || !opts.fromSweep) movePlayheadToSelection();
    /* #59 — after movePlayheadToSelection so one render covers both the
       pre-play flip (untimed selection) and the parked position */
    updateStackPanel();
    if (opts && opts.focus) {
      node = document.querySelector('.event[data-event-id="' + id + '"]');
      if (node) node.focus();
    }
    return true;
  }

  function getSelectedEventId() { return selectedEventId; }

  function getOrderedEventIds() {
    return orderedEvents.map(function (ev) { return ev.id; });
  }

  function indexOfEvent(id) {
    var i;
    if (id != null) {
      for (i = 0; i < orderedEvents.length; i++) {
        if (orderedEvents[i].id === id) return i;
      }
    }
    return -1;
  }

  /* step ±1 from the card that owns the keydown (falls back to current selection) */
  function stepFromEvent(id, delta) {
    var idx = indexOfEvent(id);
    var next = 0;
    if (!orderedEvents.length) return false;
    if (idx === -1) idx = Math.max(0, indexOfEvent(selectedEventId));
    next = Math.min(orderedEvents.length - 1, Math.max(0, idx + delta));
    return selectEvent(orderedEvents[next].id, { focus: true });
  }

  /* ---------------- playback transport (#7) ------------------------------ */
  /* Fixed-cadence replay over the ordered event list — NOT a timing
     re-simulation. Selection stays owned by #6's selectEvent; playback
     only decides which id gets selected next, and how fast. Elapsed
     timing shown in cards/detail is untouched. */
  var DEFAULT_PLAYBACK_INTERVAL_MS = 900;
  var playbackIntervalMs = DEFAULT_PLAYBACK_INTERVAL_MS;
  var playbackState = "idle"; /* idle|playing|paused|ended */
  var playbackTimer = null;

  function clearPlaybackTimer() {
    if (playbackTimer != null) {
      window.clearInterval(playbackTimer);
      playbackTimer = null;
    }
    stopSweepFrames(); /* #60 — one stop path for interval and rAF sweep */
  }

  function setPlaybackState(next) {
    playbackState = next;
    updateReplayControls();
  }

  function play() {
    var ids = getOrderedEventIds();
    if (!ids.length) return false;
    if (playbackState === "playing") return true;
    /* pre-play (#70), ended, or parked at/after the sweep end → start over
       from the first event with the playhead at the first timed node */
    if (prePlay || playbackState === "ended" || playheadMsValue == null ||
        playheadMsValue >= sweepEndMs - 1e-4) {
      selectEvent(ids[0], { focus: false });
      sweepIdx = 0;
      setPlayhead(sweepNodes.length ? sweepNodes[0].ms : timeScaleCache.t0);
    }
    setPlaybackState("playing");
    clearPlaybackTimer(); /* safety — never two live timers/frames */
    /* nothing left to sweep (single-event trace) → end immediately */
    if (!sweepNodes.length || sweepEndMs - playheadMsValue <= 1e-4) {
      setPlaybackState("ended");
      return true;
    }
    if (prefersReducedMotion()) {
      playbackTimer = window.setInterval(stepTick, playbackIntervalMs);
    } else {
      startSweep();
    }
    return true;
  }

  function pause() {
    clearPlaybackTimer();
    /* only "playing" pauses; idle/ended/paused stay as-is so manual
       selection while stopped never mislabels the status as paused */
    if (playbackState === "playing") setPlaybackState("paused");
    return true;
  }

  function nextEvent() {
    var ids = getOrderedEventIds();
    if (!ids.length) return false;
    if (prePlay) {
      /* #70 — Next from the structure view steps into the first event */
      pause();
      return selectEvent(ids[0], { focus: true });
    }
    var idx = indexOfEvent(selectedEventId);
    if (idx === -1 || idx >= ids.length - 1) return false;
    pause(); /* manual step always pauses autoplay first */
    return selectEvent(ids[idx + 1], { focus: true });
  }

  function prevEvent() {
    var ids = getOrderedEventIds();
    var idx = indexOfEvent(selectedEventId);
    if (!ids.length || idx <= 0) return false;
    pause();
    return selectEvent(ids[idx - 1], { focus: true });
  }

  function resetPlayback() {
    var ids = getOrderedEventIds();
    clearPlaybackTimer(); /* also cancels the #60 sweep */
    playheadMsValue = null;
    playheadPctValue = null; /* renderLanes(structure) drops the playhead layer */
    /* #70 — reset returns to the pre-play structure view, not to step 1 */
    prePlay = true;
    selectedEventId = null;
    renderLanes(currentTrace);
    renderStepDetail(null);
    updateStackPanel(); /* #59 — reset → neutral pre-play stack state */
    setPlaybackState("idle");
    return ids.length > 0;
  }

  function setPlaybackIntervalMs(ms) {
    if (typeof ms !== "number" || !isFinite(ms) || ms <= 0) return false;
    playbackIntervalMs = ms;
    if (playbackState === "playing") { /* keep the running cadence fresh */
      clearPlaybackTimer();
      if (prefersReducedMotion()) {
        playbackTimer = window.setInterval(stepTick, playbackIntervalMs);
      } else {
        startSweep(); /* resumes from the current playhead position */
      }
    }
    return true;
  }

  function getPlaybackIntervalMs() { return playbackIntervalMs; }

  /* transport bar reflects both the selection (#6) and the playback state */
  function updateReplayControls() {
    var prevBtn = document.getElementById("replayPrevBtn");
    var playBtn = document.getElementById("replayPlayBtn");
    var nextBtn = document.getElementById("replayNextBtn");
    var resetBtn = document.getElementById("replayResetBtn");
    var statusNode = document.getElementById("replayStatus");
    var count = orderedEvents.length;
    var idx;
    var playing;
    updateClockHidden(); /* #60 — clock visible only with a replayable stream */
    if (prePlay) {
      /* #70 structure view: Play/Next enter the run; Prev has nothing
         before the first event and Reset is already where it would go */
      prevBtn.disabled = true;
      nextBtn.disabled = count === 0;
      resetBtn.disabled = true;
      playBtn.disabled = count === 0;
      playBtn.textContent = "Play";
      playBtn.setAttribute("aria-pressed", "false");
      statusNode.setAttribute("data-state", "structure");
      statusNode.textContent = count === 0
        ? "No events"
        : "Structure · " + count + " events · press Play";
      return;
    }
    idx = indexOfEvent(selectedEventId);
    playing = playbackState === "playing";
    prevBtn.disabled = count === 0 || idx <= 0;
    nextBtn.disabled = count === 0 || idx === -1 || idx === count - 1;
    resetBtn.disabled = count === 0;
    playBtn.disabled = count === 0;
    playBtn.textContent = playing ? "Pause" : "Play";
    playBtn.setAttribute("aria-pressed", playing ? "true" : "false");
    statusNode.setAttribute("data-state", playbackState);
    statusNode.textContent = count === 0
      ? "No events"
      : "Step " + (idx + 1) + " of " + count + " · " + playbackState;
  }

  /* ---------------- public renderer API ---------------------------------- */
  function renderTrace(trace) {
    currentTrace = trace;
    clearPlaybackTimer(); /* never a dangling timer across loads (#7) */
    playbackState = "idle";
    orderedEvents = (trace && trace.events
      ? trace.events.slice().sort(function (a, b) { return (a.sequence || 0) - (b.sequence || 0); })
      : []);
    /* #70 — fresh loads open on the pre-play structure view; nothing is
       selected and no event stream is drawn until play/step/selection */
    prePlay = true;
    selectedEventId = null;
    renderHeader(trace);
    renderConfidenceBanner(trace);
    renderDurations(trace);
    renderLanes(trace);
    renderSource(trace);
    renderStepDetail(null);
    renderErrorSummary(trace); /* #62 — band E is per-trace, never per-playhead */
    updateStackPanel(); /* #59 — fresh loads open on the neutral pre-play stack */
    updateReplayControls();
  }

  function parseTraceJson(text) {
    var parsed;
    try {
      parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        return { ok: false, error: "Trace JSON must be a single object." };
      }
      if (!Array.isArray(parsed.events)) {
        return { ok: false, error: 'Trace is missing an "events" array.' };
      }
      return { ok: true, trace: parsed };
    } catch (err) {
      return { ok: false, error: "Invalid JSON: " + err.message };
    }
  }

  function clear() {
    renderTrace(null);
    setStatus("Viewer cleared. Load a trace to render.", "");
  }

  function setStatus(msg, kind) {
    var node = document.getElementById("loadStatus");
    node.textContent = msg || "";
    node.className = "load-status" + (kind ? " load-status--" + kind : "");
  }

  function loadTraceText(text, label) {
    clearPlaybackTimer(); /* a load attempt always stops any active playback (#7) */
    setPlaybackState("idle");
    var res = parseTraceJson(text);
    if (!res.ok) {
      setStatus(label + ": " + res.error, "error");
      return false;
    }
    renderTrace(res.trace);
    setStatus("Loaded " + label + " — " + res.trace.events.length + " events, outcome: " +
      (res.trace.outcome || "?") + ".", "ok");
    return true;
  }

  function loadDefaultTrace(quiet) {
    var node = document.getElementById("funcviz-default-trace");
    var res = parseTraceJson(node.textContent);
    if (!res.ok) {
      setStatus("Built-in default trace failed to parse: " + res.error, "error");
      return;
    }
    renderTrace(res.trace);
    var summary = "Showing embedded trace (" + (res.trace.traceId || "unknown") + ") — " +
      res.trace.events.length + " events, outcome: " + (res.trace.outcome || "?") + ".";
    setStatus(quiet ? summary : "Restored default trace — " + summary, "ok");
  }

  /* ---------------- wiring ----------------------------------------------- */
  document.getElementById("traceFile").addEventListener("change", function () {
    var input = this;
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      loadTraceText(String(reader.result), file.name);
      input.value = "";
    };
    reader.onerror = function () {
      setStatus("Could not read " + file.name + ".", "error");
      input.value = "";
    };
    reader.readAsText(file);
  });

  document.getElementById("loadPasteBtn").addEventListener("click", function () {
    var ta = document.getElementById("tracePaste");
    if (!ta.value.trim()) {
      setStatus("Paste trace JSON into the box first.", "error");
      return;
    }
    loadTraceText(ta.value, "pasted JSON");
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    loadDefaultTrace(false);
  });

  /* replay transport wiring (#7) — buttons drive the #6 selection API */
  document.getElementById("replayPrevBtn").addEventListener("click", prevEvent);
  document.getElementById("replayPlayBtn").addEventListener("click", function () {
    if (playbackState === "playing") pause();
    else play();
  });
  document.getElementById("replayNextBtn").addEventListener("click", nextEvent);
  document.getElementById("replayResetBtn").addEventListener("click", resetPlayback);

  /* keep node slot staggering collision-free across window resizes (#52) —
     x positions never move, only the readability slots are re-solved.
     Connectors (#54) re-derive from the same post-layout anchors, and the
     compressed axis (#53) re-measures the track width and repositions its
     deferred geometry against the new px mapping. */
  var staggerResizeTimer = null;
  window.addEventListener("resize", function () {
    if (staggerResizeTimer != null) window.clearTimeout(staggerResizeTimer);
    staggerResizeTimer = window.setTimeout(function () {
      if (!prePlay && compressionBands.length > 0 && timeScaleCache) {
        applyCompressionLayout(timeScaleCache, axisStep(timeScaleCache.domain),
          orderedEvents.length > 0);
      }
      staggerLaneNodes();
      renderConnectors();
    }, 120);
  });

  /* selection interactions — delegated on #lanes (click + keyboard).
     Manual selection always pauses autoplay first (#7), then reuses
     the #6 selection path unchanged. */
  var lanesRoot = document.getElementById("lanes");
  lanesRoot.addEventListener("click", function (e) {
    var card = e.target.closest('.event');
    var id = null;
    if (!card) return;
    id = card.getAttribute('data-event-id');
    if (id != null && id !== "") {
      pause();
      selectEvent(id);
    }
  });
  lanesRoot.addEventListener("keydown", function (e) {
    var card = e.target.closest('.event');
    var id = null;
    if (!card) return;
    id = card.getAttribute('data-event-id');
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      if (e.key === " " || e.key === "Spacebar") e.preventDefault();
      if (id != null && id !== "") {
        pause();
        selectEvent(id);
      }
    } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      e.preventDefault();
      pause();
      stepFromEvent(id, 1);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      e.preventDefault();
      pause();
      stepFromEvent(id, -1);
    }
  });

  window.Funcviz = {
    renderTrace: renderTrace,
    parseTraceJson: parseTraceJson,
    clear: clear,
    selectEvent: selectEvent,
    getSelectedEventId: getSelectedEventId,
    getOrderedEventIds: getOrderedEventIds,
    /* playback transport (#7) */
    play: play,
    pause: pause,
    next: nextEvent,
    prev: prevEvent,
    resetPlayback: resetPlayback,
    isPlaying: function () { return playbackState === "playing"; },
    getPlaybackState: function () { return playbackState; },
    /* #70 pre-play structure state — assertable by headless tests */
    isPrePlay: function () { return prePlay; },
    /* #60 playhead position (0–100) or null while hidden (pre-play) */
    playheadPct: function () { return playheadPctValue; },
    /* #54 — connector count + per-treatment counts for headless assertion */
    connectorCount: function () {
      return document.querySelectorAll("#lanes .connector[data-connector]").length;
    },
    /* #53 — compressed band count for §11.8 headless assertion */
    compressionBands: function () {
      return compressionBands.length;
    },
    /* #57/#58 — current gdb-style source window state, or null when no
       source text is rendered:
       {start, end, focus, focusSource, total, above, below,
        definitionConfidence, failureLine, failureConfidence}
       focusSource names the honest anchor: "failure-line" (schema-backed
       failures[0].sourceLine), "definition" (definitionLineRange start) or
       "top" (no anchor — line 1). definitionConfidence/failureConfidence are
       "inferred" when the §11.9 label rows are rendered, else null;
       failureLine is the matched failure line number or null. */
    sourceWindow: function () {
      return sourceWindowState;
    },
    /* #59 (spec §6.2) — call stack at the playhead, or null when no trace:
       {playheadMs, lanes, prePlay} where lanes lists the ACTIVE lane keys
       innermost-first (application → python-worker → host → client, only
       lanes with a crossed timed event and a reached/failed-here status).
       playheadMs is null and prePlay true before the run is on the axis;
       untimed events never activate a lane (same honesty rule as the
       axis). Mirrors the #stackPanel DOM seam (data-stack-lanes). */
    stackAtPlayhead: function () {
      if (!currentTrace) return null;
      if (prePlay) return { playheadMs: null, lanes: [], prePlay: true };
      return {
        playheadMs: playheadMsValue,
        lanes: playheadMsValue == null ? [] : stackActiveLanes(),
        prePlay: false
      };
    },
    setPlaybackIntervalMs: setPlaybackIntervalMs,
    getPlaybackIntervalMs: getPlaybackIntervalMs
  };

  loadDefaultTrace(true);
})();
</script>

</body>
</html>
