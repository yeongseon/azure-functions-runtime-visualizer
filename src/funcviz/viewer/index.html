<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="funcviz static viewer — renders an Azure Functions runtime trace as four horizontal swimlanes (client / host / python worker / application) over one shared elapsed-time axis, beside the application source panel.">
<title>funcviz — trace viewer</title>
<style>
  /* ============================================================
     funcviz design tokens (inline design system — single file)
     ============================================================ */
  :root {
    /* surfaces */
    --bg: #0d1117;
    --bg-raised: #151b24;
    --bg-inset: #0a0e14;
    /* strokes */
    --border: #26303d;
    --border-strong: #364252;
    /* timeline geometry — shared time axis (#52) */
    --gridline: rgba(144, 160, 180, .13);
    /* text */
    --text: #e6edf3;
    --text-dim: #93a1b5;
    --text-faint: #6b7889;
    /* lane accents */
    --client: #39c5bb;      /* teal  — client */
    --host: #5b9df8;        /* azure — functions host */
    --worker: #e3b341;      /* gold  — python worker */
    --app: #b18bf5;         /* violet— application lane */
    /* semantics */
    --ok: #3fb950;
    --fail: #f85149;
    --idle: #768390;
    /* radii */
    --radius-sm: 6px;
    --radius-md: 10px;
    /* spacing scale (4px base) */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    /* type */
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1100px 500px at 75% -10%, rgba(91,157,248,.07), transparent 60%),
      radial-gradient(900px 420px at 8% 110%, rgba(57,197,187,.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(91,157,248,.35); }
  :focus-visible { outline: 2px solid var(--host); outline-offset: 2px; }
  .vh {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ============================================================
     header
     ============================================================ */
  .app-header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-5);
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #11161e, var(--bg));
  }
  .brand-line { margin: 0; font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: .4px; }
  .brand-accent { color: var(--host); }
  .summary-sep { color: var(--text-faint); font-weight: 400; }
  .summary-text { font-size: 14px; font-weight: 500; color: var(--text-dim); letter-spacing: 0; }
  .summary-text .fn { color: var(--text); font-weight: 700; }
  .summary-text .dur { color: var(--text); font-weight: 700; }
  .outcome-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin: 0 6px 1px 4px; background: var(--idle);
  }
  .outcome-dot.outcome--success { background: var(--ok); }
  .outcome-dot.outcome--failure { background: var(--fail); }

  /* ============================================================
     outcome chip (#55, spec §2.1) — the run outcome as a headline
     element in band A; a failure header never leads with a duration.
     ============================================================ */
  .outcome-chip {
    display: inline-flex; align-items: center;
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase;
    padding: 4px 12px 4px 8px; border-radius: 999px;
    border: 1px solid var(--border-strong);
    color: var(--text-dim); background: var(--bg-raised);
  }
  .outcome-chip .outcome-dot { margin: 0 7px 0 2px; }
  .outcome-chip[data-outcome="success"] { color: var(--ok); border-color: rgba(63,185,80,.45); background: rgba(63,185,80,.08); }
  .outcome-chip[data-outcome="failed"] { color: var(--fail); border-color: rgba(248,81,73,.5); background: rgba(248,81,73,.08); }
  /* §2.1 — failure time in the summary line is subordinate, never the lead */
  .fail-at { color: var(--text-faint); font-weight: 400; font-size: 13px; }
  .runtime-meta {
    margin: 0 0 0 auto; font-family: var(--mono); font-size: 12px;
    color: var(--text-faint); text-align: right;
  }

  /* ============================================================
     toolbar — trace loading (file / paste / default)
     ============================================================ */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-5);
    border-bottom: 1px solid var(--border);
    background: var(--bg-raised);
  }
  .btn {
    display: inline-flex; align-items: center; gap: var(--sp-1);
    font-family: var(--mono); font-size: 12.5px; font-weight: 600;
    padding: 7px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: transparent; color: var(--text-dim);
    cursor: pointer; transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .btn:hover { color: var(--text); border-color: var(--host); }
  .btn--primary { background: var(--host); border-color: transparent; color: #08111f; }
  .btn--primary:hover { background: #7ab2fb; color: #08111f; }
  #tracePaste {
    flex: 1 1 300px; min-height: 36px; resize: vertical;
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
    color: var(--text); background: var(--bg-inset);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: var(--sp-1) var(--sp-2);
  }
  #tracePaste::placeholder { color: var(--text-faint); }
  .load-status { margin: 0 0 0 auto; font-size: 12px; color: var(--text-faint); font-family: var(--mono); }
  .load-status--ok { color: var(--ok); }
  .load-status--error { color: var(--fail); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:disabled:hover { color: var(--text-dim); border-color: var(--border-strong); }
  .btn--primary:disabled,
  .btn--primary:disabled:hover { background: var(--host); border-color: transparent; color: #08111f; }

  /* ============================================================
     confidence boundary banner (#10) — observed vs inferred vs
     not reached, summarized from lane status/confidence only
     ============================================================ */
  .confidence-banner {
    --banner-accent: var(--worker); /* amber when any inferred lane is populated */
    width: calc(100% - var(--sp-4) * 2);
    max-width: 1440px;
    margin: var(--sp-4) auto 0;
    padding: var(--sp-3) var(--sp-4) var(--sp-4);
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-left: 4px solid var(--banner-accent);
    border-radius: var(--radius-md);
    box-shadow: 0 3px 14px rgba(1, 4, 9, .5);
  }
  .confidence-banner--observed { --banner-accent: var(--ok); } /* every populated lane observed */
  .confidence-banner--empty { --banner-accent: var(--idle); }  /* nothing populated at all */
  .confidence-banner-title {
    margin: 0 0 var(--sp-2);
    font-size: 12px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim);
  }
  .confidence-banner-title::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 2px; background: var(--banner-accent); margin-right: var(--sp-2);
  }
  .confidence-summary {
    margin: 0 0 var(--sp-1);
    font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text);
  }
  .conf-cat--observed { color: var(--ok); }
  .conf-cat--inferred { color: var(--worker); }
  .conf-cat--not-reached { color: var(--text-faint); }
  .confidence-detail { margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-dim); }

  /* ============================================================
     replay transport (#7) — sticky inside the timeline column
     ============================================================ */
  .replay-controls {
    position: sticky; top: var(--sp-4); z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    margin-bottom: var(--sp-4);
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    box-shadow: 0 3px 14px rgba(1, 4, 9, .5);
  }
  .replay-title {
    flex: none; margin: 0 var(--sp-1) 0 0;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-faint);
  }
  .replay-status {
    margin: 0 0 0 auto; font-family: var(--mono); font-size: 11.5px;
    color: var(--text-dim); white-space: nowrap;
  }
  .replay-status[data-state="playing"] { color: var(--ok); }
  .replay-status[data-state="paused"] { color: var(--worker); }
  .replay-status[data-state="ended"] { color: var(--host); }
  .replay-status[data-state="structure"] { color: var(--client); } /* #70 pre-play */

  /* ============================================================
     layout — timeline + source panel
     ============================================================ */
  .layout {
    display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr);
    gap: var(--sp-5); padding: var(--sp-5);
    max-width: 1440px; margin: 0 auto; align-items: start;
  }
  /* right column of .layout — step detail (#6) stacked above the source panel */
  .inspector-rail {
    display: flex; flex-direction: column; gap: var(--sp-5);
    min-width: 0; align-self: stretch;
  }

  /* ============================================================
     durations — three separately-labeled chips (R4: never collapse)
     ============================================================ */
  .durations-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-3); margin-bottom: var(--sp-3); }
  .section-label {
    margin: 0; font-size: 12px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-faint);
  }
  .durations-note { margin: 0; font-size: 11.5px; font-style: italic; color: var(--text-faint); }
  .durations { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-bottom: var(--sp-5); }
  .durations-empty { margin: 0; font-size: 13px; color: var(--text-faint); }
  .duration-chip {
    flex: 1 1 210px; max-width: 320px;
    background: var(--bg-raised); border: 1px solid var(--border-strong);
    border-radius: var(--radius-md); padding: var(--sp-3) var(--sp-4);
  }
  .duration-chip.confidence-inferred {
    border-style: dashed;
    background-image: repeating-linear-gradient(-45deg, rgba(148,163,184,.06) 0 6px, rgba(148,163,184,0) 6px 14px);
  }
  .chip-head { font-family: var(--mono); font-size: 13px; }
  .chip-value { font-size: 18px; font-weight: 700; color: var(--text); }
  .chip-source { color: var(--text-dim); }
  .chip-bar { height: 4px; margin: var(--sp-2) 0 var(--sp-1); border-radius: 2px; background: var(--bg-inset); overflow: hidden; }
  .chip-bar > span { display: block; height: 100%; border-radius: 2px; }
  .bar--host { background: var(--host); }
  .bar--client { background: var(--client); }
  .chip-label { font-size: 11.5px; color: var(--text-faint); font-family: var(--mono); }
  .confidence-badge {
    flex: none; margin-left: auto; font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .8px; padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .confidence-observed .chip-head .confidence-badge,
  .event.confidence-observed .confidence-badge { background: var(--ok); color: #03130a; }
  .confidence-inferred .chip-head .confidence-badge,
  .event.confidence-inferred .confidence-badge {
    color: var(--worker); border: 1px dashed var(--worker); background: transparent;
  }

  /* ============================================================
     lanes — horizontal swimlanes over ONE shared time axis (#52)
     spec §3.1: four fixed rows, always rendered; §4.1: shared
     left→right elapsed axis with t0 at the first event.
     ============================================================ */
  .lanes {
    --lane-gutter: 216px;
    --outcome-col: 132px;
    display: grid; grid-template-columns: minmax(0, 1fr) var(--outcome-col);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: 0 3px 14px rgba(1, 4, 9, .5);
  }
  /* #55 — lanes/axis/structure stack in column 1; the outcome rail in
     column 2 spans them all at the right edge of band B (spec §3.3) */
  .lanes-main { display: flex; flex-direction: column; min-width: 0; }
  .outcome-rail {
    display: flex; flex-direction: column; gap: var(--sp-1);
    padding: var(--sp-3) var(--sp-2);
    border-left: 1px solid var(--border-strong);
    background: var(--bg-inset);
    font-family: var(--mono);
  }
  .outcome-rail-title {
    font-size: 9.5px; font-weight: 700; letter-spacing: .9px;
    text-transform: uppercase; color: var(--text-faint);
  }
  .outcome-rail-value { font-size: 13px; font-weight: 700; color: var(--text); }
  .outcome-rail-value--success { color: var(--ok); }
  .outcome-rail-value--failed { color: var(--fail); }
  .outcome-rail-value--pending { color: var(--idle); font-weight: 600; }
  .outcome-rail-lane { font-size: 11.5px; color: var(--text-dim); }
  .outcome-rail-at { font-size: 11px; color: var(--text-faint); }
  .outcome-rail-note { font-size: 10.5px; font-style: italic; color: var(--text-faint); line-height: 1.5; }
  .lane {
    display: grid; grid-template-columns: var(--lane-gutter) minmax(0, 1fr);
    background: var(--bg-raised);
  }
  .lane + .lane { border-top: 1px solid var(--border); }
  .lane--client { --lane-accent: var(--client); }
  .lane--host { --lane-accent: var(--host); }
  .lane--python-worker { --lane-accent: var(--worker); }
  .lane--application { --lane-accent: var(--app); }
  .lane-head {
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1);
    padding: var(--sp-3);
    border-right: 1px solid var(--border);
    border-left: 3px solid var(--lane-accent);
  }
  .lane-title {
    margin: 0; font-size: 12.5px; font-weight: 700;
    letter-spacing: .9px; text-transform: uppercase; color: var(--text-dim);
  }
  .lane-title::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 2px; background: var(--lane-accent); margin-right: var(--sp-2);
  }
  /* role subtitle (spec §3.1) — ownership readable without prior knowledge */
  .lane-subtitle { margin: 0; font-size: 11.5px; font-style: italic; color: var(--text-faint); }
  .lane-status {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border-strong);
    color: var(--idle); background: rgba(118,131,144,.08); white-space: nowrap;
  }
  .lane-status[data-status="reached"] { color: var(--ok); border-color: rgba(63,185,80,.45); background: rgba(63,185,80,.08); }
  .lane-status[data-status="failed-here"] { color: var(--fail); border-color: rgba(248,81,73,.5); background: rgba(248,81,73,.08); }
  .lane-reason { margin: var(--sp-1) 0 0; font-size: 11px; font-style: italic; color: var(--text-faint); }

  /* time track — elapsed runs left→right; gridlines share the axis step */
  .lane-track {
    position: relative; min-height: 92px;
    background-color: var(--bg-inset);
    background-image: repeating-linear-gradient(to right,
      var(--gridline) 0px, var(--gridline) 1px, transparent 1px, transparent var(--grid-period, 25%));
  }
  .lane-track::before { /* lane baseline — the lane's own L→R time line */
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-strong) 4%, var(--border-strong) 96%, transparent);
  }
  .lane[data-status="not-reached"] .lane-track { background-image: none; } /* empty interior (§3.2) */

  /* pre-play structure view (#70, spec §10) — before any motion, band B shows
     the fixed four-component topology: one static dashed L→R chain per lane,
     with drops linking lane to lane in order. This is structure, never
     timing: gridlines and baselines are suppressed, no axis row is drawn,
     and segments on lanes this run did not (or may not have) reached are
     dimmed so the chain never implies control arrived there. */
  .lanes[data-view="structure"] .lane-track { background-image: none; }
  .lanes[data-view="structure"] .lane-track::before { display: none; }
  .lane-chain { position: absolute; left: var(--sp-4); right: var(--sp-4); top: 50%; height: 0; }
  .lane-chain::before {
    content: ""; position: absolute; left: 0; right: 9px; top: -1px;
    border-top: 1.5px dashed var(--idle);
  }
  .lane-chain::after {
    content: ""; position: absolute; right: 0; top: -5px;
    border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    border-left: 8px solid var(--idle);
  }
  .lane-chain--unreached { opacity: .35; }
  .lane-chain-drop {
    position: absolute; right: var(--sp-4); bottom: -4px; width: 0; height: 0; z-index: 2;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 7px solid var(--idle);
  }
  .lane-chain-drop--unreached { opacity: .35; }

  /* deliberate, explained grey state for unreached lanes (FR-9.1) */
  .lane-empty {
    position: absolute; inset: var(--sp-2) var(--sp-3);
    display: flex; flex-direction: column; justify-content: center; gap: 5px;
    border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
    background: rgba(118,131,144,.05); padding: var(--sp-2) var(--sp-3);
  }
  .lane-empty-title { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--idle); }
  .lane-empty-text { margin: 0; font-size: 12px; color: var(--text-dim); }
  .lane-empty-note { margin: 0; font-size: 11px; font-style: italic; color: var(--text-faint); }
  .lane-note {
    position: absolute; inset: 0; margin: 0; padding: 0 var(--sp-4);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-style: italic; color: var(--text-faint); text-align: center;
  }

  /* #55 — the failure marker keeps ONLY its positional geometry: a dashed
     vertical line at the failure event's x. The outcome WORDS live in the
     header chip and the outcome rail, never inside the lane (spec §3.3). */
  .lane-stop-marker { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed rgba(248,81,73,.55); }

  /* untimed tray (#52 honesty): events without elapsedMs never touch the
     time axis — they are listed in a separated strip below the track that
     carries no positional meaning, each chip explicitly labeled "untimed" */
  .lane-untimed {
    grid-column: 2;
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    border-top: 1px dashed var(--border-strong);
    background: rgba(10, 14, 20, .55);
  }
  .lane-untimed-label {
    flex: none; font-family: var(--mono); font-size: 9.5px; font-weight: 700;
    letter-spacing: .9px; text-transform: uppercase; color: var(--text-faint);
  }
  .lane-untimed-events {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: var(--sp-2);
  }
  .lane-untimed .event { position: static; transform: none; }
  .lane-untimed .event-dot { display: none; }
  .event-untimed-tag {
    font-family: var(--mono); font-size: 9.5px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; color: var(--text-faint);
    border: 1px dashed var(--border-strong); border-radius: 999px; padding: 1px 6px;
  }

  /* shared elapsed-time axis row under the lanes (§4.1) */
  .axis {
    display: grid; grid-template-columns: var(--lane-gutter) minmax(0, 1fr);
    border-top: 1px solid var(--border-strong);
    background: var(--bg-raised);
  }
  .axis-gutter {
    display: flex; flex-direction: column; gap: 1px; justify-content: center;
    padding: var(--sp-1) var(--sp-3);
    border-right: 1px solid var(--border);
    font-family: var(--mono);
  }
  .axis-caption { font-size: 10px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--text-faint); }
  .axis-caption-sub { font-size: 9.5px; font-style: italic; color: var(--text-faint); }
  .axis-track { position: relative; height: 34px; background: var(--bg-inset); }
  .axis-tick { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid rgba(144,160,180,.28); }
  .axis-tick-label {
    position: absolute; top: 3px; left: 4px;
    font-family: var(--mono); font-size: 10px; color: var(--text-faint); white-space: nowrap;
  }
  .axis-end {
    position: absolute; right: var(--sp-2); top: 3px;
    font-family: var(--mono); font-size: 10px; color: var(--text-dim); white-space: nowrap;
  }

  /* #70 pre-play caption strip — stands in for the axis row while the
     structure chain is shown; labels the chain as structure, not timing */
  .structure-note {
    display: grid; grid-template-columns: var(--lane-gutter) minmax(0, 1fr);
    border-top: 1px solid var(--border-strong);
    background: var(--bg-raised);
  }
  .structure-note-gutter {
    display: flex; flex-direction: column; gap: 1px; justify-content: center;
    padding: var(--sp-1) var(--sp-3);
    border-right: 1px solid var(--border);
    font-family: var(--mono);
  }
  .structure-note-caption { font-size: 10px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--text-faint); }
  .structure-note-sub { font-size: 9.5px; font-style: italic; color: var(--text-faint); }
  .structure-note-text {
    margin: 0; display: flex; align-items: center;
    padding: var(--sp-2) var(--sp-3);
    font-size: 11.5px; color: var(--text-dim); background: var(--bg-inset);
  }

  /* ============================================================
     events — swimlane nodes at their elapsed-time x (#52).
     The dot sits exactly at the event's time; the label chip
     attaches left or right so the axis stays honest at the edges.
     Observed = solid; inferred = dashed + hatch (unchanged cues).
     ============================================================ */
  .lane-events { list-style: none; margin: 0; padding: 0; position: absolute; inset: 0; }
  .event {
    position: absolute; left: 0; top: 50%;
    display: flex; align-items: center;
    transform: translateY(-50%);
    cursor: pointer; z-index: 1;
  }
  .event[data-side="left"] { flex-direction: row-reverse; transform: translate(-100%, -50%); }
  .event-dot {
    flex: none; width: 10px; height: 10px; border-radius: 50%;
    margin-left: -5px; background: var(--lane-accent);
    box-shadow: 0 0 0 3px rgba(10,14,20,.9);
  }
  .event[data-side="left"] .event-dot { margin-left: 0; margin-right: -5px; }
  .event.confidence-inferred .event-dot { background: transparent; border: 1.5px dashed var(--lane-accent); }
  .event-chip {
    position: relative;
    display: inline-flex; align-items: center; gap: var(--sp-2);
    margin-left: var(--sp-2); padding: 3px var(--sp-2);
    max-width: 320px;
    background: var(--bg-raised); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); white-space: nowrap;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .event[data-side="left"] .event-chip { margin-left: 0; margin-right: var(--sp-2); }
  .event.confidence-observed .event-chip { border-left: 2px solid var(--lane-accent); }
  .event.confidence-inferred .event-chip {
    border-style: dashed;
    background-image: repeating-linear-gradient(-45deg, rgba(148,163,184,.06) 0 6px, rgba(148,163,184,0) 6px 14px);
  }
  .event:hover .event-chip { border-color: var(--lane-accent); }
  .event-seq {
    flex: none; width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10px; color: var(--text-faint);
    border: 1px solid var(--border); border-radius: 50%;
  }
  .event-name {
    font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text);
    max-width: 172px; overflow: hidden; text-overflow: ellipsis;
  }
  .event-elapsed { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
  .event:focus-visible .event-chip { outline: 2px solid var(--host); outline-offset: 2px; }
  .event.is-failure .event-chip { border-color: rgba(248,81,73,.65); }
  .event.is-failure .event-dot { background: var(--fail); }
  .event.confidence-inferred.is-failure .event-dot { background: transparent; border-color: var(--fail); }
  .event.is-active .event-chip {
    border-color: rgba(230,237,243,.7);
    box-shadow: 0 0 0 2px rgba(230,237,243,.55), 0 0 0 6px rgba(91,157,248,.14);
  }
  .event.is-active .event-chip::after {
    content: "current step"; position: absolute; top: -9px; left: var(--sp-2);
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    background: var(--host); color: #08111f;
    padding: 1px 7px; border-radius: 999px;
  }

  /* ============================================================
     step detail — selected step + never-cut raw log (FR-8)
     ============================================================ */
  .step-detail {
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: var(--sp-4);
  }
  .step-detail.confidence-inferred {
    border-style: dashed;
    background-image: repeating-linear-gradient(-45deg, rgba(148,163,184,.06) 0 6px, rgba(148,163,184,0) 6px 14px);
  }
  .step-detail-title {
    display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
    margin: 0 0 var(--sp-3); font-family: var(--mono);
    font-size: 15px; font-weight: 700; color: var(--text);
  }
  .step-detail-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .step-detail.confidence-observed .step-detail-title .confidence-badge { background: var(--ok); color: #03130a; }
  .step-detail.confidence-inferred .step-detail-title .confidence-badge {
    color: var(--worker); border: 1px dashed var(--worker); background: transparent;
  }
  .detail-grid {
    display: grid; grid-template-columns: auto minmax(0, 1fr);
    gap: var(--sp-1) var(--sp-3); margin: 0 0 var(--sp-3);
  }
  .detail-grid dt {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: .7px; text-transform: uppercase; color: var(--text-faint);
    padding-top: 3px; white-space: nowrap;
  }
  .detail-grid dd {
    margin: 0; font-family: var(--mono); font-size: 12.5px;
    color: var(--text-dim); overflow-wrap: anywhere;
  }
  .detail-grid dd.detail-id { color: var(--text); }
  .raw-log-label {
    margin: 0 0 var(--sp-2); font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; color: var(--text-faint);
  }
  .raw-log {
    margin: 0; padding: var(--sp-3);
    font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text);
    background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 360px; overflow: auto;
  }
  .step-detail-empty { margin: 0; font-size: 13px; font-style: italic; color: var(--text-faint); }

  /* ============================================================
     application source panel (FR-6)
     ============================================================ */
  .source-panel {
    position: sticky; top: var(--sp-4);
    background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--radius-md); overflow: hidden;
  }
  .source-head {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-4);
    background: var(--bg-raised); border-bottom: 1px solid var(--border);
  }
  .source-dot { flex: none; width: 9px; height: 9px; border-radius: 2px; background: var(--app); }
  .source-file { margin: 0; font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text); }
  .source-reason { margin: var(--sp-2) var(--sp-4) 0; }
  .source-body { max-height: 72vh; overflow: auto; padding: var(--sp-3) 0; }
  .source-code { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; }
  .source-line { display: flex; white-space: pre; padding: 0 var(--sp-4); }
  .source-line:hover { background: rgba(255,255,255,.025); }
  .line-num {
    flex: none; width: 3.6em; text-align: right; margin-right: var(--sp-4);
    color: var(--text-faint); user-select: none; white-space: pre;
  }
  .line-content { flex: 1; color: var(--text); }
  .source-line.def-line { background: rgba(177,139,245,.10); box-shadow: inset 2px 0 0 var(--app); }
  .source-line.def-line .line-num { color: var(--app); font-weight: 700; }
  .source-range-note { margin: var(--sp-3) var(--sp-4) 0; font-family: var(--mono); font-size: 11px; color: var(--app); }
  .source-placeholder { padding: var(--sp-5); color: var(--text-dim); font-size: 13.5px; line-height: 1.65; }
  .source-placeholder code {
    font-family: var(--mono); font-size: 12px; color: var(--worker);
    background: rgba(227,179,65,.08); padding: 1px 5px; border-radius: 4px;
  }

  .app-footer {
    max-width: 1440px; margin: 0 auto; padding: 0 var(--sp-5) var(--sp-5);
    font-family: var(--mono); font-size: 11.5px; color: var(--text-faint);
  }

  @media (max-width: 1080px) {
    .layout { grid-template-columns: 1fr; }
    .source-panel { position: static; }
  }
  @media (max-width: 720px) {
    /* role subtitles stay visible at every width (spec §3.1 / acceptance 2) —
       they wrap and shrink instead of disappearing */
    .lane, .axis, .structure-note { grid-template-columns: 148px minmax(0, 1fr); }
    .lanes { --outcome-col: 92px; }
    .lane-subtitle { font-size: 10.5px; }
    .lane-reason { font-size: 10px; }
    .runtime-meta { margin-left: 0; flex-basis: 100%; text-align: left; }
    .load-status { margin-left: 0; flex-basis: 100%; }
  }
</style>
</head>

    <span class="summary-sep">—</span>
    <span id="summaryText" class="summary-text">loading…</span>
  </h1>
  <!-- #55 (spec §2.1) — the run outcome as a headline chip; failure headers
       never lead with a duration -->
  <span id="outcomeChip" class="outcome-chip" role="status" data-outcome="none"></span>
  <p class="runtime-meta" id="runtimeMeta"></p>
</header>

<main class="layout">

      <button type="button" class="btn btn--primary" id="replayPlayBtn" aria-pressed="false" disabled>Play</button>
      <button type="button" class="btn" id="replayNextBtn" disabled>Next</button>
      <button type="button" class="btn" id="replayResetBtn" disabled>Reset</button>
      <span class="replay-status" id="replayStatus" role="status" aria-live="polite">No events</span>
    </div>
    <div class="durations-head">
      <h2 class="section-label">Durations</h2>
      <p class="durations-note">Three separately-reported intervals — never collapsed into one number. Bars share one scale; every chip names its measurement source.</p>
    </div>
    <div class="durations" id="durations"></div>
    <h2 class="vh">Runtime lanes</h2>
    <div class="lanes" id="lanes"></div>
  </section>

  <aside class="inspector-rail" aria-label="Trace inspection">
    <section id="stepDetail" class="step-detail" aria-labelledby="stepDetailTitle" aria-live="polite"></section>
    <aside class="source-panel" id="sourcePanel" aria-label="Application source panel"></aside>
  </aside>
</main>

<footer class="app-footer">
  funcviz static viewer · rendered locally from an embedded trace (no network) · <span id="footerMeta"></span>
</footer>

       subordinate and framed as "reached failure at". Success keeps its
       duration in the summary line as before. */
    if (outcome === "failure") {
      failLane = findFailureLane(trace);
      failEvent = failLane ? findEventById(failLane.meta.failureEvent) : null;
      if (failEvent && typeof failEvent.elapsedMs === "number") {
        summary.appendChild(tx(" · "));
        summary.appendChild(el("span", "fail-at",
          "reached failure at +" + failEvent.elapsedMs + " ms"));
      }
    } else if (hostReported) {
      summary.appendChild(tx(" · "));
      summary.appendChild(el("span", "dur", hostReported.durationMs + "ms"));
    }

    /* outcome chip — the run outcome as a band-A headline element (#55) */
    chip.textContent = "";
    chip.setAttribute("data-outcome",
      outcome === "success" ? "success" : outcome === "failure" ? "failed" : "none");
    chip.appendChild(el("span", "outcome-dot outcome--" + outcome));
    chip.appendChild(tx(outcome === "success" ? "success" : outcome === "failure" ? "failed" : outcome));

    var rt = (trace && trace.runtime) || {};
    var parts = [];
    if (rt.environment) parts.push(rt.environment);
    if (rt.language) parts.push(rt.language);
    if (rt.trigger) parts.push(rt.trigger + " trigger");
    if (rt.hostVersion) parts.push("Host " + rt.hostVersion);
    if (rt.coreToolsVersion) parts.push("Core Tools " + rt.coreToolsVersion);
    document.getElementById("runtimeMeta").textContent = parts.join(" · ");
    document.getElementById("footerMeta").textContent = trace
      ? "trace " + (trace.traceId || "?") + " · schema " + (trace.schemaVersion || "?")
      : "no trace";
  }

  /* ---------------- confidence boundary banner (#10) -------------------- */
  /* Plain-language summary of which lanes are Observed vs Inferred vs Not
     reached. Derived ONLY from lanes[*].status + lanes[*].confidence — an
     additive summary of the same schema truth, not a new source of it. */
  function renderConfidenceBanner(trace) {
    var banner = document.getElementById("confidenceBanner");
    var lanesMeta = (trace && trace.lanes) || {};
    var observed = [];
    var inferred = [];
    var notReached = [];
    var unknown = [];
    var i;
    var key;
    var meta;
    var status;
    var detail;
    var worker;
    var host;

    for (i = 0; trace && i < CONFIDENCE_LANE_ORDER.length; i++) {
      key = CONFIDENCE_LANE_ORDER[i];
      meta = lanesMeta[key];
      status = meta ? (meta.status || "not-reached") : "not-reached";
      if (status === "reached" || status === "failed-here") {
        if (meta.confidence === "inferred") inferred.push(key);
        else observed.push(key);
      } else if (status === "unknown") {
        unknown.push(key);
      } else { /* not-reached / missing */
        notReached.push(key);
      }
    }

    banner.textContent = "";
    banner.setAttribute("data-observed", observed.join(","));
    banner.setAttribute("data-inferred", inferred.join(","));
    banner.setAttribute("data-not-reached", notReached.join(","));
    banner.setAttribute("data-unknown", unknown.join(","));
    banner.className = "confidence-banner" +
      (inferred.length ? "" : observed.length ? " confidence-banner--observed" : " confidence-banner--empty");

    var title = el("h2", "confidence-banner-title", "Trace confidence boundary");
    title.setAttribute("id", "confidenceBannerTitle");
    banner.appendChild(title);

    if (!trace) {
      detail = CONFIDENCE_DETAIL_NO_TRACE;
    } else if (inferred.length) {
      /* Use the specific v0.1 success copy only for the exact observed/inferred
         shape it describes; otherwise a neutral inferred summary avoids overclaiming. */
      if (observed.join(",") === "host,python-worker" && inferred.join(",") === "client,application") {
        detail = CONFIDENCE_DETAIL_INFERRED;
      } else {
        detail = CONFIDENCE_DETAIL_INFERRED_GENERIC;
      }
    } else if (notReached.length) {
      /* Specific worker-fail copy only for the exact shape it describes;
         otherwise a neutral summary avoids overclaiming which lanes ran. */
      if (observed.join(",") === "host,python-worker" && notReached.join(",") === "client,application") {
        detail = CONFIDENCE_DETAIL_NOT_REACHED;
      } else {
        detail = CONFIDENCE_DETAIL_NOT_REACHED_GENERIC;
      }
    } else {
      detail = CONFIDENCE_DETAIL_ALL_OBSERVED;
    }

    /* worker-not-captured fallback — extra sentence on Line 2 only when the
       worker lane went unobserved while the host lane was actually reached. */
    worker = lanesMeta["python-worker"] || {};
    host = lanesMeta["host"] || {};
    var workerStatus = worker.status || "not-reached";
    var hostStatus = host.status || "not-reached";
    if (trace &&
        (workerStatus === "not-reached" || workerStatus === "unknown") &&
        (hostStatus === "reached" || hostStatus === "failed-here")) {
      detail += " " + (worker.reason || CONFIDENCE_WORKER_FALLBACK);
    }

    var summary = el("p", "confidence-summary");
    if (!trace) {
      summary.appendChild(el("strong", "conf-cat", "No trace loaded."));
      banner.appendChild(summary);
      banner.appendChild(el("p", "confidence-detail", detail));
      return;
    }
    function clause(catText, catClass, keys) {
      var names = keys.length
        ? keys.map(function (k) { return CONFIDENCE_LANE_LABELS[k] || k; }).join(", ")
        : "none";
      summary.appendChild(el("strong", catClass, catText));
      summary.appendChild(tx(" " + names + "."));
    }
    clause("Observed runtime activity:", "conf-cat conf-cat--observed", observed);
    summary.appendChild(tx(" "));
    clause("Inferred activity:", "conf-cat conf-cat--inferred", inferred);
    summary.appendChild(tx(" "));
    clause("Not reached:", "conf-cat conf-cat--not-reached", notReached);
    if (unknown.length) {
      summary.appendChild(tx(" "));
      clause("Unknown/unobserved:", "conf-cat conf-cat--unknown", unknown);
    }
    banner.appendChild(summary);

    banner.appendChild(el("p", "confidence-detail", detail));
  }

  /* ---------------- durations — three labeled chips, never collapsed ---- */
  function renderDurations(trace) {
    var host = document.getElementById("durations");
    host.textContent = "";
    var intervals = (trace && trace.intervals) || [];
    if (!intervals.length) {
      host.appendChild(el("p", "durations-empty", "No duration intervals recorded in this trace."));
      return;
    }
    var max = 1;
    intervals.forEach(function (iv) { if (iv.durationMs > max) max = iv.durationMs; });
    intervals.forEach(function (iv) {
      var conf = iv.confidence === "inferred" ? "inferred" : "observed";
      var chip = el("div", "duration-chip confidence-" + conf);
      chip.setAttribute("data-interval-id", iv.id || "");
      chip.setAttribute(
        "aria-label",
        (iv.label || "interval") + ": " + iv.durationMs + " milliseconds, " +
        (SOURCE_LABELS[iv.source] || iv.source || "unattributed") + ", " + conf
      );

      var head = el("div", "chip-head");
      head.appendChild(el("span", "chip-value", (iv.durationMs != null ? iv.durationMs : "?") + " ms"));
      head.appendChild(tx(" · "));
      head.appendChild(el("span", "chip-source", SOURCE_LABELS[iv.source] || iv.source || "unattributed"));
      head.appendChild(tx("  "));
      head.appendChild(el("span", "confidence-badge", conf.toUpperCase()));
      chip.appendChild(head);

      var bar = el("div", "chip-bar");
      var fill = el("span", iv.lane === "client" ? "bar--client" : "bar--host");
      fill.style.width = Math.max(4, Math.round((iv.durationMs / max) * 100)) + "%";
      bar.appendChild(fill);
      chip.appendChild(bar);

      chip.appendChild(el("div", "chip-label", (iv.label || "interval") + (iv.id ? " · " + iv.id : "")));
      host.appendChild(chip);
    });
  }

  /* ---------------- shared time axis (spec §4.1, #52) ------------------- */
  /* One horizontal elapsed-time axis: t0 at the first event, time increasing
     left → right. Display-only mapping from elapsedMs to a track percentage;
     nothing about the data is compressed or rescaled (compression is #53). */
  var AXIS_STEPS = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000];

  function timeScale(events) {
    var t0 = Infinity;
    var tMax = -Infinity;
    events.forEach(function (ev) {
      if (typeof ev.elapsedMs === "number") {
        if (ev.elapsedMs < t0) t0 = ev.elapsedMs;
        if (ev.elapsedMs > tMax) tMax = ev.elapsedMs;
      }
    });
    if (!isFinite(t0) || !isFinite(tMax)) { t0 = 0; tMax = 0; }
    /* realDomain is the measured span (may legitimately be 0). domain is ONLY
       a divide-by-zero guard for x math — ticks and end labels use realDomain
       so a single-timestamp trace never shows a fabricated "+1 ms" span. */
    var realDomain = tMax - t0;
    return { t0: t0, tMax: tMax, realDomain: realDomain, domain: Math.max(1, realDomain) };
  }

  function axisStep(domain) {
    var i;
    for (i = 0; i < AXIS_STEPS.length; i++) {
      if (domain / AXIS_STEPS[i] <= 6) return AXIS_STEPS[i];
    }
    return AXIS_STEPS[AXIS_STEPS.length - 1];
  }

  /* x position (%) per event id — ONLY for events with a numeric elapsedMs.
     An event without elapsedMs has no measured time, so it gets no axis
     position here (undefined) and renders in the lane's untimed tray instead;
     positional meaning is never fabricated for it. */
  function eventXs(events, scale) {
    var xs = {};
    events.forEach(function (ev) {
      if (typeof ev.elapsedMs === "number") {
        xs[ev.id] = ((ev.elapsedMs - scale.t0) / scale.domain) * 100;
      }
    });
    return xs;
  }

  /* ---------------- lanes — horizontal swimlanes on one axis (#52) ------ */
  /* Spec §3.1: four fixed rows (client / host / python-worker / application),
     always rendered, each spanning the width over the shared axis. Nodes sit
     at their elapsed-time x; vertical slot staggering keeps near-simultaneous
     events readable without ever moving their x. */
  function renderLanes(trace) {
    var hostEl = document.getElementById("lanes");
    hostEl.textContent = "";
    hostEl.setAttribute("data-view", prePlay ? "structure" : "stream");
    var main = el("div", "lanes-main");
    var lanesMeta = (trace && trace.lanes) || {};
    var events = (trace && trace.events) || [];
    var marker = null;

    var scale = timeScale(events);
    var xs = eventXs(events, scale);
    var step = axisStep(scale.domain);
    hostEl.style.setProperty("--grid-period", scale.realDomain === 0
      ? "1000%" /* single t0 line only — no fabricated intermediate gridlines */
      : (step / scale.domain * 100).toFixed(3) + "%");

    LANE_ORDER.forEach(function (key, laneIdx) {
      var meta = lanesMeta[key] || {};
      var status = meta.status || "not-reached";
      var laneEvents = events.filter(function (ev) { return ev.lane === key; });
      var timedEvents = [];
      var untimedEvents = [];
      laneEvents.forEach(function (ev) {
        (typeof ev.elapsedMs === "number" ? timedEvents : untimedEvents).push(ev);
      });
      timedEvents.sort(function (a, b) {
        return (xs[a.id] - xs[b.id]) || ((a.sequence || 0) - (b.sequence || 0));
      });
      untimedEvents.sort(function (a, b) { return (a.sequence || 0) - (b.sequence || 0); });

      var section = el("section", "lane lane--" + key);
      section.setAttribute("data-lane-name", key);
      section.setAttribute("data-status", status);
      section.setAttribute("aria-label", LANE_LABELS[key] + " lane — " +
        (LANE_ROLE_SUBTITLES[key] || "") + " — " + (STATUS_LABELS[status] || status));

      var head = el("header", "lane-head");
      head.appendChild(el("h3", "lane-title", LANE_LABELS[key]));
      head.appendChild(el("p", "lane-subtitle", LANE_ROLE_SUBTITLES[key] || ""));
      var statusChip = el("span", "lane-status", STATUS_LABELS[status] || status);
      statusChip.setAttribute("data-status", status);
      head.appendChild(statusChip);
      if (meta.reason) head.appendChild(el("p", "lane-reason", meta.reason));
      section.appendChild(head);

      var track = el("div", "lane-track");
      var list = el("ul", "lane-events");
      var empty;
      var stopX;
      var tray;
      var trayLabel;
      var untimedList;
      var chainReached;
      var nextKey;
      var nextReached;
      var chain;
      var drop;
      if (prePlay) {
        /* #70 structure view (spec §10): the fixed component chain replaces
           the event stream. Topology, not timing — dashed and grey like an
           inferred connector (§4.5), dimmed on lanes whose pre-run status is
           not-reached/unknown so the chain never implies control arrived. */
        chainReached = status === "reached" || status === "failed-here";
        chain = el("div", "lane-chain" + (chainReached ? "" : " lane-chain--unreached"));
        chain.setAttribute("aria-hidden", "true"); /* decorative; lane aria-label carries the meaning */
        track.appendChild(chain);
        nextKey = LANE_ORDER[laneIdx + 1];
        if (nextKey) {
          /* the drop is a handoff INTO the next lane; dim it when either end
             of the handoff is not reached (esp. after a failed-here lane whose
             control never continued) so it never implies control flowed on. */
          nextReached = (function (s) { return s === "reached" || s === "failed-here"; })((lanesMeta[nextKey] || {}).status);
          drop = el("span", "lane-chain-drop" +
            (chainReached && nextReached ? "" : " lane-chain-drop--unreached"));
          drop.setAttribute("aria-hidden", "true");
          track.appendChild(drop);
        }
        section.appendChild(track);
        main.appendChild(section);
        return;
      }
      if (status === "not-reached" && laneEvents.length === 0) {
        empty = el("div", "lane-empty");
        empty.appendChild(el("p", "lane-empty-title", "Lane not reached"));
        empty.appendChild(el("p", "lane-empty-text",
          meta.reason || (trace
            ? "No events were recorded on this lane before the run ended."
            : "No trace is loaded.")));
        empty.appendChild(el("p", "lane-empty-note", "An empty lane is a finding, not a rendering error."));
        track.appendChild(empty);
      } else if (laneEvents.length === 0) {
        track.appendChild(el("p", "lane-note", trace
          ? "No events recorded on this lane."
          : "No trace is loaded."));
      }
      timedEvents.forEach(function (ev) {
        var isFailure = status === "failed-here" && ev.id === meta.failureEvent;
        list.appendChild(renderEvent(ev, xs[ev.id], ev.id === selectedEventId, isFailure));
      });
      if (list.children.length) track.appendChild(list);

      /* a failure anchor is only an axis position if the failure event is
         timed; an untimed failure has no x and gets no line (#55) */
      stopX = xs[meta.failureEvent];
      if (status === "failed-here") {
        marker = renderStopMarker(stopX);
        if (marker) track.appendChild(marker);
      }
      section.appendChild(track);

      if (untimedEvents.length) {
        tray = el("div", "lane-untimed");
        trayLabel = el("span", "lane-untimed-label", "untimed — no measured time");
        trayLabel.setAttribute("title",
          "These events carry no elapsedMs in the trace. They are excluded from the time axis and listed without positional meaning.");
        tray.appendChild(trayLabel);
        untimedList = el("ul", "lane-untimed-events");
        untimedEvents.forEach(function (ev) {
          var isFailure = status === "failed-here" && ev.id === meta.failureEvent;
          untimedList.appendChild(renderEvent(ev, null, ev.id === selectedEventId, isFailure));
        });
        tray.appendChild(untimedList);
        section.appendChild(tray);
      }
      main.appendChild(section);
    });

    if (prePlay) {
      main.appendChild(renderStructureNote(trace));
    } else {
      main.appendChild(renderAxis(scale, step, events.length > 0));
    }
    hostEl.appendChild(main);
    hostEl.appendChild(renderOutcomeRail(trace));
    // staggerLaneNodes() reads laid-out geometry from `#lanes .lane-events`, so
    // it must run only after `main` is attached to the DOM (#55 fix — running it
    // before append made it a no-op and regressed the #52 collision stagger).
    if (!prePlay) {
      staggerLaneNodes();
    }
  }

  /* #55 (spec §3.3) — the outcome rail: a dedicated column at the right
     edge of band B stating the run outcome for the whole timeline. For a
     failure it names the STOPPING LANE from lanes[*].status === "failed-here"
     (never hardcoded) and the failure time from that lane's failureEvent.
     In pre-play it shows a neutral pending state — band A carries the
     recorded outcome, band B states it once the run is on the axis. */
  function renderOutcomeRail(trace) {
    var rail = el("aside", "outcome-rail");
    var outcome = (trace && trace.outcome) || "none";
    var failLane = null;
    var failEvent = null;
    rail.setAttribute("aria-label", "Run outcome");
    rail.appendChild(el("span", "outcome-rail-title", "outcome"));

    if (prePlay) {
      rail.setAttribute("data-state", "pending");
      rail.appendChild(el("span", "outcome-rail-value outcome-rail-value--pending", "not replayed yet"));
      rail.appendChild(el("span", "outcome-rail-note",
        "Pre-play — the recorded outcome is in the header and is stated here on replay."));
      return rail;
    }
    if (outcome === "failure") {
      rail.setAttribute("data-state", "failed");
      rail.appendChild(el("span", "outcome-rail-value outcome-rail-value--failed", "⨯ failed"));
      failLane = findFailureLane(trace);
      if (failLane) {
        rail.appendChild(el("span", "outcome-rail-lane",
          "in " + (LANE_LABELS[failLane.lane] || failLane.lane)));
        failEvent = findEventById(failLane.meta.failureEvent);
        if (failEvent && typeof failEvent.elapsedMs === "number") {
          rail.appendChild(el("span", "outcome-rail-at", "at +" + failEvent.elapsedMs + " ms"));
        }
        rail.appendChild(el("span", "outcome-rail-note",
          "Control did not continue past the failure."));
      } else {
        rail.appendChild(el("span", "outcome-rail-note",
          "No lane is marked failed-here in this trace's lane metadata."));
      }
      return rail;
    }
    if (outcome === "success") {
      rail.setAttribute("data-state", "success");
      rail.appendChild(el("span", "outcome-rail-value outcome-rail-value--success", "✓ success"));
      return rail;
    }
    rail.setAttribute("data-state", "empty");
    rail.appendChild(el("span", "outcome-rail-value outcome-rail-value--pending", "—"));
    rail.appendChild(el("span", "outcome-rail-note", "No trace loaded."));
    return rail;
  }

  /* #70 (spec §10) — pre-play caption strip that stands in for the axis
     row. Names the chain as fixed structure, distinguishes the dimmed
     unreached lanes, and invites Play. Explicit empty state when no trace. */
  function renderStructureNote(trace) {
    var note = el("div", "structure-note");
    var gutter = el("div", "structure-note-gutter");
    gutter.appendChild(el("span", "structure-note-caption", "structure"));
    gutter.appendChild(el("span", "structure-note-sub", "pre-play · no timing"));
    note.appendChild(gutter);
    note.appendChild(el("p", "structure-note-text", trace
      ? "Structure — fixed component decomposition, not observed timing. Faint lanes were not reached, or their activity is unknown, in this run. Press Play to replay the run."
      : "No trace loaded. The four components above are the fixed structure of every trace."));
    return note;
  }

  /* #55 (spec §3.3) — the failure marker keeps ONLY its positional geometry:
     a dashed vertical line at the failure event's x on the shared axis. The
     outcome STATEMENT (the words) lives in the header chip and the outcome
     rail, never inside a lane as if it were an event. An untimed failure has
     no x, so it gets no line — nothing is invented to anchor one. */
  function renderStopMarker(xPct) {
    if (xPct == null) return null;
    var marker = el("div", "lane-stop-marker");
    marker.style.left = xPct.toFixed(3) + "%";
    return marker;
  }

  /* shared axis row — ticks at even time steps plus the real end time (§4.1).
     Tick xs and the lane gridlines derive from the same step, so the
     repeating backgrounds and the labels can never disagree. A trace whose
     events all share one timestamp (realDomain 0) gets ONLY a "+0" tick —
     no synthetic intermediate ticks are invented from the guard domain. */
  function renderAxis(scale, step, hasEvents) {
    var axis = el("div", "axis");
    var gutter = el("div", "axis-gutter");
    gutter.appendChild(el("span", "axis-caption", "elapsed (ms)"));
    gutter.appendChild(el("span", "axis-caption-sub", "t0 = first event · shared axis"));
    axis.appendChild(gutter);

    var track = el("div", "axis-track");
    var tick = null;
    var k;
    var pct;
    if (hasEvents && scale.realDomain === 0) {
      tick = el("div", "axis-tick");
      tick.style.left = "0%";
      tick.appendChild(el("span", "axis-tick-label", "+0"));
      track.appendChild(tick);
      track.appendChild(el("span", "axis-end", "end +0 ms"));
    } else if (hasEvents) {
      for (k = 0; k * step <= scale.domain; k++) {
        pct = (k * step / scale.domain) * 100;
        if (pct > 100.0001) break;
        tick = el("div", "axis-tick");
        tick.style.left = pct.toFixed(3) + "%";
        tick.appendChild(el("span", "axis-tick-label", "+" + (k * step)));
        track.appendChild(tick);
      }
      track.appendChild(el("span", "axis-end", "end +" + scale.realDomain + " ms"));
    }
    axis.appendChild(track);
    return axis;
  }

  /* Near-simultaneous events stack into vertical slots instead of moving on
     the time axis — x is timing truth, y is readability only. */
  var NODE_SLOT_TOPS = ["50%", "20%", "80%"];

  function staggerLaneNodes() {
    var lists = document.querySelectorAll("#lanes .lane-events");
    var l;
    var i;
    var s;
    var p;
    var nodes;
    var placed;
    var node;
    var anchor;
    var width;
    var left;
    var right;
    var hit;
    for (l = 0; l < lists.length; l++) {
      nodes = lists[l].children;
      placed = []; /* { slot, left, right } */
      for (i = 0; i < nodes.length; i++) {
        node = nodes[i];
        for (s = 0; s < NODE_SLOT_TOPS.length; s++) {
          node.style.top = NODE_SLOT_TOPS[s];
          /* offsetLeft ignores the side=left translate(-100%), so derive the
             visual box from the anchor + width per side before comparing */
          anchor = node.offsetLeft;
          width = node.offsetWidth;
          left = node.getAttribute("data-side") === "left" ? anchor - width : anchor;
          right = left + width;
          hit = false;
          for (p = 0; p < placed.length; p++) {
            if (placed[p].slot === s && left < placed[p].right + 8 && right > placed[p].left - 8) {
              hit = true;
              break;
            }
          }
          if (!hit) {
            placed.push({ slot: s, left: left, right: right });
            break;
          }
        }
      }
    }
  }

  /* ---------------- event node with stable #6/#7 seams ------------------- */
  /* Swimlane node (#52): the dot sits exactly at the event's elapsed-time x;
     the label chip attaches left or right of the dot so the axis stays honest
     at both edges. Confidence cues mirror the card treatment they replace —
     observed = solid, inferred = dashed + hatch. xPct == null means the event
     carries no numeric elapsedMs: it renders without a dot or axis position,
     in the lane's untimed tray, tagged "untimed" — never a fabricated x. */
  function renderEvent(ev, xPct, isActive, isFailure) {
    var conf = ev.confidence === "inferred" ? "inferred" : "observed";
    var timedNode = xPct != null;
    var item = el("li", "event confidence-" + conf +
      (isActive ? " is-active" : "") + (isFailure ? " is-failure" : ""));
    item.setAttribute("data-event-id", ev.id || "");
    item.setAttribute("data-lane", ev.lane || "");
    item.setAttribute("data-observation", conf);
    item.setAttribute("data-step-index", ev.sequence != null ? String(ev.sequence) : "");
    if (ev.timestamp) item.setAttribute("data-timestamp", ev.timestamp);
    if (ev.raw != null) item.setAttribute("data-raw", ev.raw); /* raw-log seam (#6) */
    item.setAttribute("tabindex", "0");
    item.setAttribute("aria-selected", isActive ? "true" : "false");
    item.setAttribute("aria-controls", "stepDetail");
    item.setAttribute("aria-label",
      (ev.event || "event") + " — " + (LANE_LABELS[ev.lane] || ev.lane || "?") +
      " lane — " + conf + (timedNode
        ? " — +" + (ev.elapsedMs != null ? ev.elapsedMs : "?") + " ms"
        : " — untimed (no measured time)"));

    if (timedNode) {
      item.setAttribute("data-side", xPct > 72 ? "left" : "right");
      item.style.left = xPct.toFixed(3) + "%";
      item.appendChild(el("span", "event-dot"));
    }

    var chip = el("span", "event-chip");
    var name = el("span", "event-name", ev.event || "Unnamed event");
    chip.appendChild(el("span", "event-seq", String((ev.sequence != null ? ev.sequence : 0) + 1)));
    if (ev.event && ev.event.length > 24) name.setAttribute("title", ev.event); /* chip ellipsizes */
    chip.appendChild(name);
    if (timedNode) {
      chip.appendChild(el("span", "event-elapsed", "+" + (ev.elapsedMs != null ? ev.elapsedMs : "?") + " ms"));
    } else {
      chip.appendChild(el("span", "event-untimed-tag", "untimed"));
    }
    chip.appendChild(el("span", "confidence-badge", conf.toUpperCase()));
    item.appendChild(chip);
    return item;
  }

  /* ---------------- step detail — selected step + raw log (FR-8) -------- */
  var DETAIL_ID_KEYS = [
    ["invocationId", "Invocation ID"],
    ["workerRequestId", "Worker Request ID"],
    ["httpRequestId", "HTTP Request ID"]
  ];

  function renderStepDetail(ev) {
    var panel = document.getElementById("stepDetail");
    var emptyTitle = null;
    var conf = null;
    var title = null;
    var dl = null;
    var pre = null;
    var i;
    function row(label, value, cls) {
      dl.appendChild(el("dt", null, label));
      dl.appendChild(el("dd", cls || null, value));
    }
    panel.textContent = "";
    if (!ev) {
      panel.className = "step-detail";
      emptyTitle = el("h2", "step-detail-title", "Step detail");
      emptyTitle.setAttribute("id", "stepDetailTitle");
      panel.appendChild(emptyTitle);
      panel.appendChild(el("p", "step-detail-empty", prePlay
      ? "Pre-play structure view — the run has not been replayed yet. Press Play or select a step to inspect it."
      : "Select a step to inspect its source log line."));
      return;
    }
    conf = ev.confidence === "inferred" ? "inferred" : "observed";
    panel.className = "step-detail confidence-" + conf;

    title = el("h2", "step-detail-title");
    title.setAttribute("id", "stepDetailTitle");
    title.appendChild(el("span", "step-detail-name", ev.event || "Unnamed event"));
    title.appendChild(el("span", "confidence-badge", conf.toUpperCase()));
    panel.appendChild(title);

    dl = el("dl", "detail-grid");
    row("Lane", LANE_LABELS[ev.lane] || ev.lane || "?");
    row("Timestamp", ev.timestamp || "—");
    row("Elapsed", typeof ev.elapsedMs === "number" ? "+" + ev.elapsedMs + " ms" : "untimed — no measured elapsedMs");
    row("Confidence", "confidence: " + conf);
    for (i = 0; i < DETAIL_ID_KEYS.length; i++) {
      if (ev[DETAIL_ID_KEYS[i][0]]) {
        row(DETAIL_ID_KEYS[i][1], String(ev[DETAIL_ID_KEYS[i][0]]), "detail-id");
        break;
      }
    }
    panel.appendChild(dl);

    panel.appendChild(el("p", "raw-log-label", "Raw log"));
    pre = el("pre", "raw-log");
    pre.textContent = ev.raw != null ? String(ev.raw) : "No raw log captured for this event.";
    panel.appendChild(pre);
  }

  /* ---------------- application source panel (FR-6) ---------------------- */
  function renderSource(trace) {
    var panel = document.getElementById("sourcePanel");
    panel.textContent = "";
    var app = (trace && trace.application) || {};
    var laneMeta = ((trace && trace.lanes) || {}).application || {};
    var status = laneMeta.status || (app.sourceText ? "reached" : "not-reached");

    var head = el("header", "source-head");
    head.appendChild(el("span", "source-dot", ""));
    head.appendChild(el("h2", "source-file", trace ? (app.sourceFile || "source file") : "no trace"));
    var st = el("span", "lane-status", STATUS_LABELS[status] || status);
    st.setAttribute("data-status", status);
    head.appendChild(st);
    panel.appendChild(head);
    if (laneMeta.reason) panel.appendChild(el("p", "lane-reason source-reason", laneMeta.reason));

    var body = el("div", "source-body");
    var range = null;
    var lines = [];
    var code = null;
    var ph = null;
    if (!trace) {
      body.appendChild(el("p", "source-placeholder", "No trace loaded. Open a trace file or paste trace JSON above."));
    } else if (app.sourceText) {
      range = normalizeRange(app.definitionLineRange);
      lines = String(app.sourceText).replace(/\n$/, "").split("\n");
      code = el("ol", "source-code");
      lines.forEach(function (lineText, idx) {
        var n = idx + 1;
        var isDef = !!range && n >= range[0] && n <= range[1];
        var li = el("li", "source-line" + (isDef ? " def-line" : ""));
        li.setAttribute("data-line", String(n));
        if (isDef) li.setAttribute("aria-label", "Function definition line " + n);
        li.appendChild(el("span", "line-num", isDef ? "▸ " + n : "  " + n));
        li.appendChild(el("code", "line-content", lineText));
        code.appendChild(li);
      });
      body.appendChild(code);
      if (range) {
        body.appendChild(el("p", "source-range-note",
          "Function definition block — lines " + range[0] + "–" + range[1] + "."));
      }
    } else {
      ph = el("div", "source-placeholder");
      if (status === "unknown") {
        ph.appendChild(tx("Application execution was not observed, so the source of "));
        ph.appendChild(el("code", null, app.sourceFile || "the source file"));
        ph.appendChild(tx(" is not embedded — showing it here would imply this code ran. " +
          "Re-run with elevated worker logging (see host.json) to observe the worker/application lanes."));
      } else {
        ph.appendChild(tx("Source text was not embedded in this trace. "));
        ph.appendChild(el("code", null, app.sourceFile || "the source file"));
        ph.appendChild(tx(" was recorded as the source file, but local file loading is unavailable from file://."));
      }
      body.appendChild(ph);
    }
    panel.appendChild(body);
  }

  /* ---------------- selection API (#6 UI, #7 playback entrypoints) ------ */
  function findEventById(id) {
    var i;
    if (id == null) return null;
    for (i = 0; i < orderedEvents.length; i++) {
      if (orderedEvents[i].id === id) return orderedEvents[i];
    }
    return null;
  }

  function updateActiveCards() {
    var cards = document.querySelectorAll('#lanes .event');
    var i;
    var isActive = false;
    for (i = 0; i < cards.length; i++) {
      isActive = cards[i].getAttribute("data-event-id") === selectedEventId;
      cards[i].classList.toggle("is-active", isActive);
      cards[i].setAttribute("aria-selected", isActive ? "true" : "false");
    }
  }

  function selectEvent(id, opts) {
    var ev = findEventById(id);
    var node = null;
    if (!ev) return false;
    if (prePlay) {
      /* #70 — the first selection leaves the structure view; band B swaps
         to the real event stream (a content swap, never a node relayout) */
      prePlay = false;
      renderLanes(currentTrace);
    }
    selectedEventId = id;
    updateActiveCards();
    renderStepDetail(ev);
    updateReplayControls(); /* transport follows every selection change (#7) */
    if (opts && opts.focus) {
      node = document.querySelector('.event[data-event-id="' + id + '"]');
      if (node) node.focus();
    }
    return true;
  }

  function getSelectedEventId() { return selectedEventId; }

  function getOrderedEventIds() {
    return orderedEvents.map(function (ev) { return ev.id; });
  }

  function indexOfEvent(id) {
    var i;
    if (id != null) {
      for (i = 0; i < orderedEvents.length; i++) {
        if (orderedEvents[i].id === id) return i;
      }
    }
    return -1;
  }

  /* step ±1 from the card that owns the keydown (falls back to current selection) */
  function stepFromEvent(id, delta) {
    var idx = indexOfEvent(id);
    var next = 0;
    if (!orderedEvents.length) return false;
    if (idx === -1) idx = Math.max(0, indexOfEvent(selectedEventId));
    next = Math.min(orderedEvents.length - 1, Math.max(0, idx + delta));
    return selectEvent(orderedEvents[next].id, { focus: true });
  }

  /* ---------------- playback transport (#7) ------------------------------ */
  /* Fixed-cadence replay over the ordered event list — NOT a timing
     re-simulation. Selection stays owned by #6's selectEvent; playback
     only decides which id gets selected next, and how fast. Elapsed
     timing shown in cards/detail is untouched. */
  var DEFAULT_PLAYBACK_INTERVAL_MS = 900;
  var playbackIntervalMs = DEFAULT_PLAYBACK_INTERVAL_MS;
  var playbackState = "idle"; /* idle|playing|paused|ended */
  var playbackTimer = null;

  function clearPlaybackTimer() {
    if (playbackTimer != null) {
      window.clearInterval(playbackTimer);
      playbackTimer = null;
    }
  }

  function setPlaybackState(next) {
    playbackState = next;
    updateReplayControls();
  }

  function playbackTick() {
    var ids = getOrderedEventIds();
    var idx = indexOfEvent(selectedEventId);
    if (!ids.length || idx === -1 || idx >= ids.length - 1) {
      clearPlaybackTimer();
      setPlaybackState("ended");
      return;
    }
    selectEvent(ids[idx + 1], { focus: false }); /* never steal focus on ticks */
    if (indexOfEvent(selectedEventId) === ids.length - 1) {
      clearPlaybackTimer();
      setPlaybackState("ended"); /* stop at last event — no auto-wrap */
    }
  }

  function play() {
    var ids = getOrderedEventIds();
    if (!ids.length) return false;
    if (playbackState === "playing") return true;
    /* pre-play (#70), ended, or parked on the last event → start from the first */
    if (prePlay || playbackState === "ended" || indexOfEvent(selectedEventId) === ids.length - 1) {
      selectEvent(ids[0], { focus: false });
    }
    setPlaybackState("playing");
    clearPlaybackTimer(); /* safety — never two live timers */
    /* nothing left to walk (single-event trace) → end immediately, no phantom cadence */
    if (indexOfEvent(selectedEventId) >= ids.length - 1) {
      setPlaybackState("ended");
      return true;
    }
    playbackTimer = window.setInterval(playbackTick, playbackIntervalMs);
    return true;
  }

  function pause() {
    clearPlaybackTimer();
    /* only "playing" pauses; idle/ended/paused stay as-is so manual
       selection while stopped never mislabels the status as paused */
    if (playbackState === "playing") setPlaybackState("paused");
    return true;
  }

  function nextEvent() {
    var ids = getOrderedEventIds();
    if (!ids.length) return false;
    if (prePlay) {
      /* #70 — Next from the structure view steps into the first event */
      pause();
      return selectEvent(ids[0], { focus: true });
    }
    var idx = indexOfEvent(selectedEventId);
    if (idx === -1 || idx >= ids.length - 1) return false;
    pause(); /* manual step always pauses autoplay first */
    return selectEvent(ids[idx + 1], { focus: true });
  }

  function prevEvent() {
    var ids = getOrderedEventIds();
    var idx = indexOfEvent(selectedEventId);
    if (!ids.length || idx <= 0) return false;
    pause();
    return selectEvent(ids[idx - 1], { focus: true });
  }

  function resetPlayback() {
    var ids = getOrderedEventIds();
    clearPlaybackTimer();
    /* #70 — reset returns to the pre-play structure view, not to step 1 */
    prePlay = true;
    selectedEventId = null;
    renderLanes(currentTrace);
    renderStepDetail(null);
    setPlaybackState("idle");
    return ids.length > 0;
  }

  function setPlaybackIntervalMs(ms) {
    if (typeof ms !== "number" || !isFinite(ms) || ms <= 0) return false;
    playbackIntervalMs = ms;
    if (playbackState === "playing") { /* keep the running cadence fresh */
      clearPlaybackTimer();
      playbackTimer = window.setInterval(playbackTick, playbackIntervalMs);
    }
    return true;
  }

  function getPlaybackIntervalMs() { return playbackIntervalMs; }

  /* transport bar reflects both the selection (#6) and the playback state */
  function updateReplayControls() {
    var prevBtn = document.getElementById("replayPrevBtn");
    var playBtn = document.getElementById("replayPlayBtn");
    var nextBtn = document.getElementById("replayNextBtn");
    var resetBtn = document.getElementById("replayResetBtn");
    var statusNode = document.getElementById("replayStatus");
    var count = orderedEvents.length;
    var idx;
    var playing;
    if (prePlay) {
      /* #70 structure view: Play/Next enter the run; Prev has nothing
         before the first event and Reset is already where it would go */
      prevBtn.disabled = true;
      nextBtn.disabled = count === 0;
      resetBtn.disabled = true;
      playBtn.disabled = count === 0;
      playBtn.textContent = "Play";
      playBtn.setAttribute("aria-pressed", "false");
      statusNode.setAttribute("data-state", "structure");
      statusNode.textContent = count === 0
        ? "No events"
        : "Structure · " + count + " events · press Play";
      return;
    }
    idx = indexOfEvent(selectedEventId);
    playing = playbackState === "playing";
    prevBtn.disabled = count === 0 || idx <= 0;
    nextBtn.disabled = count === 0 || idx === -1 || idx === count - 1;
    resetBtn.disabled = count === 0;
    playBtn.disabled = count === 0;
    playBtn.textContent = playing ? "Pause" : "Play";
    playBtn.setAttribute("aria-pressed", playing ? "true" : "false");
    statusNode.setAttribute("data-state", playbackState);
    statusNode.textContent = count === 0
      ? "No events"
      : "Step " + (idx + 1) + " of " + count + " · " + playbackState;
  }

  /* ---------------- public renderer API ---------------------------------- */
  function renderTrace(trace) {
    currentTrace = trace;
    clearPlaybackTimer(); /* never a dangling timer across loads (#7) */
    playbackState = "idle";
    orderedEvents = (trace && trace.events
      ? trace.events.slice().sort(function (a, b) { return (a.sequence || 0) - (b.sequence || 0); })
      : []);
    /* #70 — fresh loads open on the pre-play structure view; nothing is
       selected and no event stream is drawn until play/step/selection */
    prePlay = true;
    selectedEventId = null;
    renderHeader(trace);
    renderConfidenceBanner(trace);
    renderDurations(trace);
    renderLanes(trace);
    renderSource(trace);
    renderStepDetail(null);
    updateReplayControls();
  }

  function parseTraceJson(text) {
    var parsed;
    try {
      parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        return { ok: false, error: "Trace JSON must be a single object." };
      }
      if (!Array.isArray(parsed.events)) {
        return { ok: false, error: 'Trace is missing an "events" array.' };
      }
      return { ok: true, trace: parsed };
    } catch (err) {
      return { ok: false, error: "Invalid JSON: " + err.message };
    }
  }

  function clear() {
    renderTrace(null);
    setStatus("Viewer cleared. Load a trace to render.", "");
  }

  function setStatus(msg, kind) {
    var node = document.getElementById("loadStatus");
    node.textContent = msg || "";
    node.className = "load-status" + (kind ? " load-status--" + kind : "");
  }

  function loadTraceText(text, label) {
    clearPlaybackTimer(); /* a load attempt always stops any active playback (#7) */
    setPlaybackState("idle");
    var res = parseTraceJson(text);
    if (!res.ok) {
      setStatus(label + ": " + res.error, "error");
      return false;
    }
    renderTrace(res.trace);
    setStatus("Loaded " + label + " — " + res.trace.events.length + " events, outcome: " +
      (res.trace.outcome || "?") + ".", "ok");
    return true;
  }

  function loadDefaultTrace(quiet) {
    var node = document.getElementById("funcviz-default-trace");
    var res = parseTraceJson(node.textContent);
    if (!res.ok) {
      setStatus("Built-in default trace failed to parse: " + res.error, "error");
      return;
    }
    renderTrace(res.trace);
    var summary = "Showing embedded trace (" + (res.trace.traceId || "unknown") + ") — " +
      res.trace.events.length + " events, outcome: " + (res.trace.outcome || "?") + ".";
    setStatus(quiet ? summary : "Restored default trace — " + summary, "ok");
  }

  /* ---------------- wiring ----------------------------------------------- */
  document.getElementById("traceFile").addEventListener("change", function () {
    var input = this;
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      loadTraceText(String(reader.result), file.name);
      input.value = "";
    };
    reader.onerror = function () {
      setStatus("Could not read " + file.name + ".", "error");
      input.value = "";
    };
    reader.readAsText(file);
  });

  document.getElementById("loadPasteBtn").addEventListener("click", function () {
    var ta = document.getElementById("tracePaste");
    if (!ta.value.trim()) {
      setStatus("Paste trace JSON into the box first.", "error");
      return;
    }
    loadTraceText(ta.value, "pasted JSON");
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    loadDefaultTrace(false);
  });

  /* replay transport wiring (#7) — buttons drive the #6 selection API */
  document.getElementById("replayPrevBtn").addEventListener("click", prevEvent);
  document.getElementById("replayPlayBtn").addEventListener("click", function () {
    if (playbackState === "playing") pause();
    else play();
  });
  document.getElementById("replayNextBtn").addEventListener("click", nextEvent);
  document.getElementById("replayResetBtn").addEventListener("click", resetPlayback);

  /* keep node slot staggering collision-free across window resizes (#52) —
     x positions never move, only the readability slots are re-solved */
  var staggerResizeTimer = null;
  window.addEventListener("resize", function () {
    if (staggerResizeTimer != null) window.clearTimeout(staggerResizeTimer);
    staggerResizeTimer = window.setTimeout(staggerLaneNodes, 120);
  });

  /* selection interactions — delegated on #lanes (click + keyboard).
     Manual selection always pauses autoplay first (#7), then reuses
     the #6 selection path unchanged. */
  var lanesRoot = document.getElementById("lanes");
  lanesRoot.addEventListener("click", function (e) {
    var card = e.target.closest('.event');
    var id = null;
    if (!card) return;
    id = card.getAttribute('data-event-id');
    if (id != null && id !== "") {
      pause();
      selectEvent(id);
    }
  });
  lanesRoot.addEventListener("keydown", function (e) {
    var card = e.target.closest('.event');
    var id = null;
    if (!card) return;
    id = card.getAttribute('data-event-id');
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      if (e.key === " " || e.key === "Spacebar") e.preventDefault();
      if (id != null && id !== "") {
        pause();
        selectEvent(id);
      }
    } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      e.preventDefault();
      pause();
      stepFromEvent(id, 1);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      e.preventDefault();
      pause();
      stepFromEvent(id, -1);
    }
  });

  window.Funcviz = {
    renderTrace: renderTrace,
    parseTraceJson: parseTraceJson,
    clear: clear,
    selectEvent: selectEvent,
    getSelectedEventId: getSelectedEventId,
    getOrderedEventIds: getOrderedEventIds,
    /* playback transport (#7) */
    play: play,
    pause: pause,
    next: nextEvent,
    prev: prevEvent,
    resetPlayback: resetPlayback,
    isPlaying: function () { return playbackState === "playing"; },
    getPlaybackState: function () { return playbackState; },
    /* #70 pre-play structure state — assertable by headless tests */
    isPrePlay: function () { return prePlay; },
    setPlaybackIntervalMs: setPlaybackIntervalMs,
    getPlaybackIntervalMs: getPlaybackIntervalMs
  };

  loadDefaultTrace(true);
})();
</script>

</body>
</html>
